<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>dastdaroz ID — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"/>
<style>
/* ─── Переменные ─────────────────────────────────────────────── */
:root {
  --acc:    #1a9e4a;
  --acc2:   #22c55e;
  --accd:   rgba(26,158,74,.1);
  --red:    #dc2626;
  --amber:  #d97706;
  --tx:     #111111;
  --tx2:    #555555;
  --tx3:    #aaaaaa;
  --b:      #e0e0e0;
  --s2:     #f6f6f6;
  --s3:     #ebebeb;
  --r:      16px;
  --fd:     'Unbounded', sans-serif;
  --fs:     'Inter', system-ui, sans-serif;
  --ease:   cubic-bezier(.32, 0, .18, 1);
  --tf:     .13s;
}

/* ─── Сброс ──────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  background: #fff;
  color: var(--tx);
  font-family: var(--fs);
  min-height: 100svh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 52px 24px 32px;
}

/* ─── Скрытые служебные элементы ────────────────────────────── */
#fb-bar, #ldot-1, #ldot-2, #status-bar { display: none !important; }

/* ─── Обёртка ────────────────────────────────────────────────── */
.wrap {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  animation: fadeUp .28s var(--ease) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ─── Логотип ────────────────────────────────────────────────── */
.logo {
  display: flex;
  justify-content: center;
  margin-bottom: 36px;
}
.logo img {
  height: 46px;
  width: auto;
  object-fit: contain;
}

/* ─── Заголовок ──────────────────────────────────────────────── */
.hd { text-align: center; margin-bottom: 20px; }
.form-title {
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1.5rem;
  color: var(--tx);
  letter-spacing: -.04em;
  line-height: 1.15;
  margin-bottom: 6px;
}
.form-title em { color: var(--tx); font-style: normal; }
.form-sub { font-size: .88rem; color: var(--tx3); line-height: 1.5; }

/* ─── Вкладки ────────────────────────────────────────────────── */
.tabs {
  display: flex;
  border-bottom: 1.5px solid var(--b);
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 9px 4px 11px;
  text-align: center;
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--fs);
  font-size: .8rem;
  font-weight: 600;
  color: var(--tx3);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: color var(--tf), border-color var(--tf);
}
.tab.active { color: var(--acc); border-bottom-color: var(--acc); font-weight: 700; }
.tab:hover:not(.active) { color: var(--tx2); }

/* ─── Алерт ──────────────────────────────────────────────────── */
.alert {
  display: none;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-size: .75rem;
  color: var(--tx2);
  line-height: 1.5;
  border: 1px solid;
}
.alert.show { display: flex; }
.alert.err  { background: rgba(220,38,38,.03); border-color: rgba(220,38,38,.15); }
.alert strong {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  margin-bottom: 2px;
  color: var(--red);
}

/* ─── Поля ───────────────────────────────────────────────────── */
.field { position: relative; margin-bottom: 10px; }
.lbl {
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tx3);
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
}
.field-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.field-err.show { display: block; }

/* ─── Инпут ──────────────────────────────────────────────────── */
.inp {
  width: 100%;
  background: #fff;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  color: var(--tx);
  font-family: var(--fs);
  font-size: .95rem;
  font-weight: 400;
  padding: 17px 18px;
  outline: none;
  transition: border-color var(--tf), box-shadow var(--tf);
}
.inp:focus      { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accd); }
.inp.has-eye    { padding-right: 52px; }
.inp.err        { border-color: rgba(220,38,38,.45); animation: shake .3s ease; }
.inp::placeholder { color: var(--tx3); }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  22%,66% { transform: translateX(-5px); }
  44%,88% { transform: translateX(5px); }
}


/* ─── Кнопка показа пароля ───────────────────────────────────── */
.eye {
  position: absolute;
  right: 0; top: 0;
  width: 52px; height: 100%;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tx3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--tf);
}
.eye:hover { color: var(--tx2); }

/* ─── Надёжность пароля ──────────────────────────────────────── */
.ps-bars { display: flex; gap: 4px; margin-top: 8px; }
.ps-bar {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--s3);
  transition: background .3s;
}
.ps-lbl { font-size: .62rem; color: var(--tx3); margin-top: 5px; display: none; }


/* ─── Чип с email ────────────────────────────────────────────── */
.email-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  padding: 11px 14px;
  margin-bottom: 14px;
  background: var(--s2);
}
.email-chip-ico {
  width: 28px; height: 28px;
  border-radius: 8px;
  flex-shrink: 0;
  background: #fff;
  border: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tx2);
}
.email-chip-text {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  font-size: .88rem;
  color: var(--tx);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-chip-edit {
  border: none;
  cursor: pointer;
  color: var(--tx);
  font-weight: 700;
  font-size: .78rem;
  font-family: var(--fs);
  padding: 5px 9px;
  border-radius: 8px;
  background: var(--s3);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  transition: opacity var(--tf);
}
.email-chip-edit:hover { opacity: .7; }


/* ─── Забыли пароль ──────────────────────────────────────────── */
.opt-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.forgot {
  font-size: .73rem;
  color: var(--tx3);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--fs);
  padding: 0;
  transition: color var(--tf);
  text-decoration: none;
}
.forgot:hover { color: var(--tx); }

/* ─── Условия использования ──────────────────────────────────── */
.terms-check { margin-top: 18px; margin-bottom: 10px; }
.terms-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.terms-checkbox { display: none; }
.terms-box {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1.5px solid var(--b);
  border-radius: 5px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color var(--tf), background var(--tf), box-shadow var(--tf);
}
.terms-checkbox:checked + .terms-box {
  background: var(--acc);
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--accd);
}
.terms-checkbox:checked + .terms-box::after {
  content: '';
  display: block;
  width: 5px;
  height: 9px;
  border: 2px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}
.terms-box.err { border-color: rgba(220,38,38,.45); }
.terms-text { font-size: .69rem; color: var(--tx3); line-height: 1.6; }
.terms-text a, .terms-text button {
  color: var(--acc);
  text-decoration: none;
}
.terms-text button {
  background: none; border: none; padding: 0;
  font-size: inherit; font-family: inherit; line-height: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.terms-text a:hover, .terms-text button:hover { text-decoration: underline; }
.terms-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.terms-err.show { display: block; }

/* ─── Кнопка отправки ────────────────────────────────────────── */
.btn-submit {
  width: 100%;
  padding: 18px;
  background: var(--acc);
  border: none;
  border-radius: var(--r);
  color: #fff;
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: .01em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s, transform .15s;
}
.btn-submit:hover:not(:disabled)  { opacity: .88; }
.btn-submit:active:not(:disabled) { transform: scale(.98); }
.btn-submit:disabled               { background: var(--s3); color: var(--tx3); cursor: not-allowed; }
.btn-submit.loading .btn-txt       { opacity: .4; }

.spinner {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
  display: none;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-submit.loading .spinner { display: block; }

/* ─── Переключение форм ──────────────────────────────────────── */
.switch { text-align: center; margin-top: 14px; font-size: .75rem; color: var(--tx3); }
.switch button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--acc);
  font-size: .75rem;
  font-family: var(--fs);
  font-weight: 700;
  padding: 0;
  transition: opacity var(--tf);
}
.switch button:hover { opacity: .7; }


/* ─── Алерт: успех ───────────────────────────────────────────── */
.alert.ok { background: rgba(26,158,74,.05); border-color: rgba(26,158,74,.22); }
.alert.ok strong { color: var(--acc); }

/* ─── Разделитель «Или другим способом» ──────────────────────── */
.or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 16px;
  font-size: .72rem;
  color: var(--tx3);
}
.or::before, .or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--b);
}

/* ─── Кнопка Google ──────────────────────────────────────────── */
.btn-google {
  width: 100%;
  padding: 16px 18px;
  background: #fff;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  color: var(--tx);
  font-family: var(--fs);
  font-weight: 600;
  font-size: .95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background var(--tf), border-color var(--tf), transform .15s;
}
.btn-google:hover:not(:disabled)  { background: var(--s2); }
.btn-google:active:not(:disabled) { transform: scale(.98); }
.btn-google:disabled              { opacity: .6; cursor: not-allowed; }
.btn-google svg { flex-shrink: 0; }
.btn-google .spinner { border-color: rgba(0,0,0,.15); border-top-color: var(--tx2); }
.btn-google.loading .spinner { display: block; }
.btn-google.loading .g-ico   { display: none; }

/* Ссылка «Забыли пароль» чуть ближе к полю */
.opt-row { margin-top: -2px; }


</style>
</head>
<body>

<script type="module">
import { auth, db } from './firebase.js';
import { SheetPdf } from './sheet-pdf.js';
import {
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  signInWithCredential,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

// ─── Константы ────────────────────────────────────────────────
const HOME = 'pulsar.html';

// ─── PDF Sheets (Оферта / Политика) ───────────────────────────
SheetPdf.define({
  id:     'terms',
  title:  'Публичная оферта',
  url:    'https://dastdaroz.shop/help/terms.pdf',
  zIndex: 900,
});
SheetPdf.define({
  id:     'privacy',
  title:  'Политика конфиденциальности',
  url:    'https://dastdaroz.shop/help/privacy.pdf',
  zIndex: 900,
});

// Экспорт в window для onclick в HTML
window.SheetPdf = SheetPdf;

// ─── Rate Limiter ─────────────────────────────────────────────
const RL = (() => {
  const SK          = 'rl_v1';
  const MAX_FAILS   = 5;
  const WIN_MS      = 15 * 60_000;
  const LOCKOUTS_MS = [30_000, 120_000, 900_000, 3_600_000];
  const G_MAX       = 30;
  const G_WIN_MS    = 10 * 60_000;

  const load = () => {
    try { return JSON.parse(sessionStorage.getItem(SK) || '{}'); }
    catch { return {}; }
  };
  const save = s => {
    try { sessionStorage.setItem(SK, JSON.stringify(s)); }
    catch {}
  };

  function check(key) {
    const now = Date.now();
    const s   = load();
    const e   = s[key];
    if (!e) return { ok: true, fails: 0 };
    if (e.until && now < e.until) return { ok: false, until: e.until };
    if (!e.until && now - e.first > WIN_MS) {
      delete s[key]; save(s);
      return { ok: true, fails: 0 };
    }
    return { ok: true, fails: e.fails || 0 };
  }

  function fail(key) {
    const now = Date.now();
    const s   = load();
    let e     = s[key];

    if (!e || (!e.until && now - e.first > WIN_MS)) {
      e = { fails: 0, lockouts: 0, first: now };
    }
    if (e.until && now >= e.until) {
      e.fails = 0;
      delete e.until;
      e.first = now;
    }

    e.fails = (e.fails || 0) + 1;

    if (e.fails >= MAX_FAILS) {
      const dur  = LOCKOUTS_MS[Math.min(e.lockouts, LOCKOUTS_MS.length - 1)];
      e.until    = now + dur;
      e.lockouts = (e.lockouts || 0) + 1;
      e.fails    = 0;
      e.first    = now;
    }

    s[key] = e;
    save(s);
    return check(key);
  }

  function success(key) {
    const s = load();
    delete s[key];
    save(s);
  }

  function checkGlobal() {
    const now = Date.now();
    const s   = load();
    const g   = s['__g'] || { t: [] };
    g.t = g.t.filter(x => now - x < G_WIN_MS);
    if (g.t.length >= G_MAX) { s['__g'] = g; save(s); return false; }
    g.t.push(now);
    s['__g'] = g;
    save(s);
    return true;
  }

  return { check, fail, success, checkGlobal, MAX_FAILS };
})();

// ─── Таймер блокировки ────────────────────────────────────────
let _cdTimer = null;
let _loginLocked = false;

function startLockout(until) {
  if (_cdTimer) clearInterval(_cdTimer);
  _loginLocked = true;
  setPassDisabled(true);

  const tick = () => {
    const sec = Math.ceil((until - Date.now()) / 1000);
    if (sec <= 0) {
      clearInterval(_cdTimer);
      _cdTimer     = null;
      _loginLocked = false;
      setPassDisabled(false);
      hideAlert();
      return;
    }
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const t = m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s} с`;
    showAlert('Доступ временно ограничен',
      `Слишком много неверных попыток. Повторите через: ${t}`);
  };
  tick();
  _cdTimer = setInterval(tick, 1000);
}

// ─── Утилиты ──────────────────────────────────────────────────
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const normEmail = v => (v || '').trim().toLowerCase();

// ─── DOM-ссылки ───────────────────────────────────────────────
const alertEl      = document.getElementById('lock-alert');
const alertTitle   = document.getElementById('alert-title');
const alertMsg     = document.getElementById('alert-msg');
const statusText   = document.getElementById('status-text');
const cardTitle    = document.getElementById('card-title');
const cardSub      = document.getElementById('card-sub');

const loginEmailEl   = document.getElementById('login-email');
const loginPassEl    = document.getElementById('login-pass');
const btnLoginNext   = document.getElementById('btn-login-next');
const btnLoginSubmit = document.getElementById('btn-login-submit');
const btnLoginBack   = document.getElementById('btn-login-back');
const btnGoogle      = document.getElementById('btn-google');
const btnForgot      = document.getElementById('btn-forgot');
const btnEye         = document.getElementById('btn-eye');
const loginStep1     = document.getElementById('login-step-1');
const loginStep2     = document.getElementById('login-step-2');
const emailChipText  = document.getElementById('email-chip-text');

let loginEmail = null;     // подтверждённый на шаге 1 email

// ─── Состояние авторизации ────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    statusText.textContent = 'Вы уже вошли — перенаправление…';
    setTimeout(() => { window.location.href = HOME; }, 500);
  } else {
    statusText.textContent = 'dastdaroz ID подключён';
  }
});

// ─── Алерты и ошибки полей ────────────────────────────────────
const showAlert = (title, msg, type = 'err') => {
  alertTitle.textContent = title;
  alertMsg.textContent   = ' ' + msg;
  alertEl.className      = `alert ${type} show`;
};
const hideAlert = () => { alertEl.className = 'alert err'; };

function showFieldErr(id, msg) {
  document.getElementById(id)?.classList.add('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearFieldErr(id) {
  document.getElementById(id)?.classList.remove('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = ''; err.classList.remove('show'); }
}
function clearAllErrors() {
  clearFieldErr('login-email');
  clearFieldErr('login-pass');
  hideAlert();
}
function setLoading(btn, on) {
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}
function setPassDisabled(on) {
  loginPassEl.disabled = on;
  btnLoginSubmit.disabled = on;
}

loginEmailEl.addEventListener('input', () => {
  if (_cdTimer) return;
  clearFieldErr('login-email');
  hideAlert();
});
loginPassEl.addEventListener('input', () => {
  if (_cdTimer) return;
  clearFieldErr('login-pass');
  hideAlert();
});

// ─── Показать / скрыть пароль ─────────────────────────────────
const EYE_OPEN  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4.1M6.6 6.6A16.6 16.6 0 002 12s3.6 7 10 7a9.7 9.7 0 004.2-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
btnEye.innerHTML = EYE_OPEN;
btnEye.addEventListener('click', () => {
  const show = loginPassEl.type === 'password';
  loginPassEl.type = show ? 'text' : 'password';
  btnEye.innerHTML = show ? EYE_CLOSE : EYE_OPEN;
  btnEye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
  loginPassEl.focus();
});

// ─── Шаги ─────────────────────────────────────────────────────
function goLoginStep(n) {
  loginStep1.style.display = n === 1 ? '' : 'none';
  loginStep2.style.display = n === 2 ? '' : 'none';
  if (n === 2) {
    cardTitle.innerHTML = 'Введите <em>пароль</em>';
    cardSub.textContent = 'Если аккаунта ещё нет, мы его создадим';
    loginPassEl.value = '';
    clearFieldErr('login-pass');
    setTimeout(() => loginPassEl.focus(), 150);
  } else {
    cardTitle.innerHTML = 'Добро <em>пожаловать</em>';
    cardSub.textContent = 'Войдите с помощью email';
    setTimeout(() => loginEmailEl.focus(), 150);
  }
}

btnLoginNext.addEventListener('click', () => {
  const email = normEmail(loginEmailEl.value);
  if (!EMAIL_RE.test(email)) { showFieldErr('login-email', 'Введите корректный email'); return; }

  const st = RL.check(email);
  if (!st.ok) { startLockout(st.until); return; }

  loginEmail = email;
  emailChipText.textContent = email;
  goLoginStep(2);
});
loginEmailEl.addEventListener('keydown', e => { if (e.key === 'Enter') btnLoginNext.click(); });

btnLoginBack.addEventListener('click', () => {
  if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; _loginLocked = false; setPassDisabled(false); }
  hideAlert();
  goLoginStep(1);
});

// ─── Вход / создание аккаунта ─────────────────────────────────
// Возвращает 'signed-in' | 'created' | 'wrong-password'; остальные ошибки — исключением.
async function signInOrCreate(email, pass) {
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    return 'signed-in';
  } catch (e) {
    // «Нет такого аккаунта» и «неверный пароль» Firebase при защите от перебора email
    // отдаёт одним и тем же кодом, поэтому различаем попыткой создать аккаунт.
    const ambiguous = ['auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-login-credentials'];
    if (!ambiguous.includes(e.code)) throw e;
  }
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    return 'created';
  } catch (e) {
    if (e.code === 'auth/email-already-in-use') return 'wrong-password';   // аккаунт есть — значит, пароль не тот
    throw e;
  }
}

let _submitting = false;

async function submitPassword() {
  if (_loginLocked || _submitting) return;
  if (!loginEmail) { goLoginStep(1); return; }

  const pass = loginPassEl.value;
  if (pass.length < 6) { showFieldErr('login-pass', 'Пароль — не менее 6 символов'); return; }

  if (!RL.checkGlobal()) {
    showAlert('Слишком много попыток', 'Подождите немного и попробуйте снова.');
    return;
  }
  const rlState = RL.check(loginEmail);
  if (!rlState.ok) { startLockout(rlState.until); return; }

  _submitting = true;
  setLoading(btnLoginSubmit, true);
  try {
    await setPersistence(auth, browserLocalPersistence);
    const res = await signInOrCreate(loginEmail, pass);

    if (res === 'wrong-password') {
      const r    = RL.fail(loginEmail);
      const left = RL.MAX_FAILS - r.fails;
      const hint = left <= 2 ? ` Осталось попыток: ${left}.` : '';
      if (!r.ok) { loginPassEl.value = ''; startLockout(r.until); return; }
      showFieldErr('login-pass', 'Неверный пароль.' + hint);
      loginPassEl.select();
      return;
    }

    RL.success(loginEmail);
    statusText.textContent = res === 'created' ? 'Аккаунт создан! Перенаправление…' : 'Успешно! Перенаправление…';
    window.location.href = HOME;
  } catch (e) {
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
  } finally {
    _submitting = false;
    if (!_loginLocked) setLoading(btnLoginSubmit, false);
  }
}
btnLoginSubmit.addEventListener('click', submitPassword);
loginPassEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitPassword(); });

// ─── Забыли пароль ────────────────────────────────────────────
btnForgot.addEventListener('click', async () => {
  if (!loginEmail) return;
  try {
    await sendPasswordResetEmail(auth, loginEmail);
    showAlert('Письмо отправлено', `Ссылка для смены пароля отправлена на ${loginEmail}. Проверьте также «Спам».`, 'ok');
  } catch (e) {
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
  }
});

// ─── Вход через Google ────────────────────────────────────────
// В WebView (наше приложение) Google блокирует вход через браузерное окно,
// поэтому там вызываем НАТИВНЫЙ вход, а в обычном браузере — popup как раньше.
//
// Контракт с нативной частью (достаточно ОДНОГО из вариантов):
//  1) Capacitor + @capacitor-firebase/authentication (skipNativeAuth: true) — подхватится сам.
//  2) Android: в существующем мосте AndroidBridge добавить метод googleSignIn()
//     (подойдёт и отдельный интерфейс "NativeAuth").
//     Результат нативный код возвращает вызовом JS:
//       window.onNativeGoogleSignIn(idToken, errorCode)
//     (idToken — Google ID token; при отмене — errorCode = 'cancelled').
//  3) iOS: WKScriptMessageHandler "googleSignIn" → то же window.onNativeGoogleSignIn(...).
function isWebView() {
  const ua = navigator.userAgent || '';
  if (window.Capacitor?.isNativePlatform?.()) return true;
  if (window.AndroidBridge || window.NativeAuth || window.webkit?.messageHandlers?.googleSignIn) return true;
  if (/DastdarozApp/.test(ua)) return true;                             // наше приложение
  if (/; wv\)/.test(ua)) return true;                                   // Android WebView
  if (/(iPhone|iPod|iPad)/.test(ua) && !/Safari/.test(ua)) return true; // iOS WKWebView
  return false;
}

let _nativeResolve = null;
window.onNativeGoogleSignIn = (idToken, error) => {
  if (!_nativeResolve) return;
  const r = _nativeResolve; _nativeResolve = null;
  if (idToken) r.resolve(idToken);
  else r.reject(Object.assign(new Error(error || 'native-failed'),
    { code: error === 'cancelled' ? 'auth/popup-closed-by-user' : 'auth/native-failed' }));
};

function nativeGoogleIdToken() {
  // 1) Capacitor-плагин
  const cap = window.Capacitor?.Plugins?.FirebaseAuthentication;
  if (cap?.signInWithGoogle) {
    return cap.signInWithGoogle({ skipNativeAuth: true }).then(r => {
      const t = r?.credential?.idToken;
      if (!t) throw Object.assign(new Error('no-token'), { code: 'auth/native-failed' });
      return t;
    }).catch(e => {
      if (/cancel/i.test(e?.message || '')) throw Object.assign(e, { code: 'auth/popup-closed-by-user' });
      throw e;
    });
  }
  // 2) Android / iOS мост с колбэком window.onNativeGoogleSignIn
  return new Promise((resolve, reject) => {
    if (window.AndroidBridge?.googleSignIn) {
      _nativeResolve = { resolve, reject };
      window.AndroidBridge.googleSignIn();
    } else if (window.NativeAuth?.googleSignIn) {
      _nativeResolve = { resolve, reject };
      window.NativeAuth.googleSignIn();
    } else if (window.webkit?.messageHandlers?.googleSignIn) {
      _nativeResolve = { resolve, reject };
      window.webkit.messageHandlers.googleSignIn.postMessage({});
    } else {
      reject(Object.assign(new Error('no-bridge'), { code: 'auth/native-unavailable' }));
    }
  });
}

btnGoogle.addEventListener('click', async () => {
  if (_submitting) return;
  hideAlert();
  if (!RL.checkGlobal()) {
    showAlert('Слишком много попыток', 'Подождите немного и попробуйте снова.');
    return;
  }

  _submitting = true;
  setLoading(btnGoogle, true);
  try {
    await setPersistence(auth, browserLocalPersistence);

    if (isWebView()) {
      // ── Приложение: нативный вход → Firebase по idToken ──
      const idToken = await nativeGoogleIdToken();
      await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
    } else {
      // ── Обычный браузер: как раньше ──
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      await signInWithPopup(auth, provider);
    }

    statusText.textContent = 'Успешно! Перенаправление…';
    window.location.href = HOME;
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    if (!isWebView() && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
      // Окно заблокировано в обычном мобильном браузере — входим через переадресацию
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await signInWithRedirect(auth, provider);
        return;
      } catch (e2) { e = e2; }
    }
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
  } finally {
    _submitting = false;
    setLoading(btnGoogle, false);
  }
});

// ─── Firebase: человекочитаемые ошибки ───────────────────────
function fbErr(code) {
  const map = {
    'auth/invalid-credential':        ['Неверные данные',          'Email или пароль неверны.'],
    'auth/invalid-login-credentials': ['Неверные данные',          'Email или пароль неверны.'],
    'auth/wrong-password':            ['Неверный пароль',          'Пароль неверный. Попробуйте ещё раз.'],
    'auth/invalid-email':             ['Некорректный email',       'Проверьте адрес и попробуйте снова.'],
    'auth/weak-password':             ['Пароль слишком простой',   'Пароль должен содержать не менее 6 символов.'],
    'auth/user-disabled':             ['Аккаунт отключён',         'Этот аккаунт заблокирован. Обратитесь в поддержку.'],
    'auth/too-many-requests':         ['Слишком много попыток',    'Подождите немного и попробуйте снова.'],
    'auth/network-request-failed':    ['Ошибка сети',              'Проверьте подключение к интернету.'],
    'auth/native-unavailable':        ['Вход через Google недоступен', 'В приложении этот способ пока не подключён. Войдите по email и паролю.'],
    'auth/native-failed':             ['Не удалось войти',          'Вход через Google не завершился. Попробуйте ещё раз или войдите по email.'],
    'auth/popup-blocked':             ['Окно заблокировано',       'Разрешите всплывающие окна для этого сайта и повторите.'],
    'auth/unauthorized-domain':       ['Домен не разрешён',        'Добавьте этот домен в Firebase → Authentication → Settings → Authorized domains.'],
    'auth/operation-not-allowed':     ['Способ входа отключён',    'Включите этот способ входа в Firebase → Authentication → Sign-in method.'],
    'auth/account-exists-with-different-credential': ['Email уже занят', 'Этот email зарегистрирован другим способом. Войдите по паролю.'],
  };
  return map[code] || ['Произошла ошибка', 'Что-то пошло не так. Попробуйте ещё раз.'];
}
