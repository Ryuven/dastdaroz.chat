// вошли в комнату (как слушатель): помним её, пока не нажмём «Выйти из комнаты»
function _roomEnter(r){
  if(!r||r.type!=='room'||!me||(r.banned||[]).includes(me.uid))return;
  if(_voiceId&&_voiceId!==r.id)leaveStage(_voiceId);          // были в другой комнате — слезаем с её ячейки
  _voiceId=r.id;updateRoomMini();
}
// idx — номер ячейки, на которую нажали; без него (кнопка «Войти в голос») — первая свободная.
// Если уже в эфире — просто пересаживаемся на выбранную свободную ячейку.
async function joinRoomStage(idx){
  const r=currentCh;if(r?.type!=='room'||!me)return;
  if((r.banned||[]).includes(me.uid)){toast('Вас исключили из этой комнаты','err');return;}
  const slots=_roomSlots(r);
  if(typeof idx!=='number'||slots[idx])idx=slots.findIndex(x=>!x);
  if(idx<0){toast('Все места заняты','err');return;}
  if(slots[idx]===me.uid)return;
  _roomEnter(r);
  const old=[];slots.forEach((u,i)=>{if(u===me.uid)old.push(i);});
  const prevSlots=r.slots,prevMembers=r.members;
  const upd={};old.forEach(i=>{upd['slots.'+i]='';});upd['slots.'+idx]=me.uid;
  const next=slots.slice();old.forEach(i=>{next[i]='';});next[idx]=me.uid;
  r.slots=Object.fromEntries(next.map((u,i)=>[i,u]));
  if(!(r.members||[]).includes(me.uid)){upd.members=arrayUnion(me.uid);r.members=[...(r.members||[]),me.uid];}
  markGroupRead(r.id);
  renderRoomStage();updateGroupInputState();updateChatHeader();
  try{await updateDoc(_grpRef(r.id),upd);}
  catch(e){r.slots=prevSlots;r.members=prevMembers;renderRoomStage();updateGroupInputState();updateChatHeader();toast('Не удалось войти: '+e.message,'err');}
}
// слезть с ячейки, но остаться в комнате слушателем
function leaveStage(id=_voiceId){
  if(!id||!me)return;
  const r=_findGR(id)||(currentCh?.id===id?currentCh:null);
  if(!r)return;
  const upd=_slotClear(r,me.uid);
  if(!Object.keys(upd).length)return;
  r.slots=Object.fromEntries(_roomSlotsRaw(r).map((u,i)=>[i,u===me.uid?'':u]));
  updateDoc(_grpRef(id),upd).catch(e=>console.warn('leaveStage',e));
  renderRoomStage();if(currentCh?.type==='room')updateChatHeader();
}

/* ── плавающая плашка комнаты: видна, пока мы в эфире, но не на экране этой комнаты ── */
const _curView=()=>_allViews.find(v=>{const e=$(v);return e&&getComputedStyle(e).display!=='none';});
function _miniPlace(side,top,animate){
  const m=$('room-mini');if(!m)return;
  const W=window.innerWidth,H=window.innerHeight,sz=m.offsetWidth||56,gap=10;
  top=Math.max(gap+56,Math.min(top,H-sz-gap-64));
  m.style.transition=animate?'left .22s var(--ease),top .22s var(--ease)':'none';
  m.style.left=(side==='left'?gap:W-sz-gap)+'px';
  m.style.top=top+'px';
  m.dataset.side=side;m.dataset.top=top;
}
let _miniKey='';
function updateRoomMini(){
  const m=$('room-mini');if(!m)return;
  const r=_voiceId?_findGR(_voiceId):null;
  const here=_curView()==='conversation'&&currentCh?.id===_voiceId;
  if(!r||here){if(m.style.display!=='none')m.style.display='none';return;}
  const stage=_roomSlots(r).includes(me?.uid),muted=stage&&(_roomAudio.deaf||!_roomAudio.mic),unread=isGroupUnread(r);
  const key=[r.id,r.photoURL||'',r.name||'',stage,muted,unread].join('|');
  if(key!==_miniKey){
    _miniKey=key;
    $('rm-ava').innerHTML=r.photoURL?`<img src="${esc(r.photoURL)}" alt=""/>`:esc(ini(r.name||'R'));
    $('rm-mic').className='rm-mic'+(muted?' off':stage?'':' idle');
    $('rm-mic').innerHTML=stage?(muted?_MICOFF_SVG:_MIC_SVG):_HEAD_SVG;
    $('rm-dot').style.display=unread?'':'none';
    m.classList.toggle('listen',!stage);
  }
  const was=m.style.display;
  m.style.display='block';
  if(was==='none'||!m.dataset.side){
    let pos={side:'right',top:Math.round(window.innerHeight*.4)};
    try{const sv=JSON.parse(localStorage.getItem('p_mini')||'null');if(sv&&sv.side)pos=sv;}catch(e){}
    _miniPlace(pos.side,pos.top,false);
  }
}
function _miniInit(){
  const m=$('room-mini');if(!m)return;
  let sx=0,sy=0,ox=0,oy=0,moved=false,drag=false;
  m.addEventListener('pointerdown',e=>{
    drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=m.offsetLeft;oy=m.offsetTop;
    m.style.transition='none';m.classList.add('drag');
    try{m.setPointerCapture(e.pointerId);}catch(err){}
  });
  m.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;
    const W=window.innerWidth,H=window.innerHeight,sz=m.offsetWidth;
    m.style.left=Math.max(0,Math.min(ox+dx,W-sz))+'px';
    m.style.top=Math.max(0,Math.min(oy+dy,H-sz))+'px';
  });
  const end=e=>{
    if(!drag)return;drag=false;m.classList.remove('drag');
    if(!moved){if(_voiceId)openChannel(_voiceId);return;}      // просто тап — возвращаемся в комнату
    const side=(m.offsetLeft+m.offsetWidth/2)<window.innerWidth/2?'left':'right';     // прилипаем к ближайшему краю
    _miniPlace(side,m.offsetTop,true);
    try{localStorage.setItem('p_mini',JSON.stringify({side,top:+m.dataset.top}));}catch(err){}
  };
  m.addEventListener('pointerup',end);
  m.addEventListener('pointercancel',()=>{drag=false;m.classList.remove('drag');});
  window.addEventListener('resize',()=>{if(m.style.display!=='none'&&m.dataset.side)_miniPlace(m.dataset.side,+m.dataset.top,false);});
}

 * Особенности: поиск по имени и email, тап по человеку открывает его профиль. */
function _shHl(text,q){
  const t=esc(text||'');
  if(!q)return t;
  const re=new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return t.replace(re,'<mark class="sh-mark">$1</mark>');
}
function _renderUserSearch(q){
  const list=document.getElementById('sh-user-list');
  if(!list)return;
  const msg=t=>`<div style="padding:28px 16px;text-align:center;color:var(--muted);font-size:var(--fs-xs)">${t}</div>`;
  if(!usersLoaded){list.innerHTML=msg('Загрузка пользователей…');return;}

  const ql=(q||'').toLowerCase().trim();
  const users=Object.values(allUsers)
    .filter(u=>u.uid!==me?.uid)
    .filter(u=>!ql||(u.displayName||'').toLowerCase().includes(ql)||(u.email||'').toLowerCase().includes(ql))
    .sort((a,b)=>(a.displayName||a.email||'').localeCompare(b.displayName||b.email||'','ru'));

  if(!users.length){
    list.innerHTML=msg(ql?'Никого не найдено':'Нет других пользователей');
    return;
  }

  const lbl=`<div class="gp-members-lbl">${ql?'Найдено':'Люди'} · ${users.length}</div>`;
  list.innerHTML=lbl+users.map(u=>{
    const pr=u.presence?.status||'offline';
    const avI=u.photoURL?`<img src="${esc(u.photoURL)}" alt=""/>`:esc(ini(u.displayName||u.email));
    const prLabel=pr==='online'?'<span style="color:var(--green)">в сети</span>':pr==='away'?'<span style="color:var(--amber)">отошёл</span>':'';
    return `<div class="ch-card" data-uid="${esc(u.uid)}" role="button" tabindex="0">

      <div class="ch-body"><div class="ch-row1"><span class="ch-title">${_shHl(u.displayName||u.email||'—',ql)}</span></div>

/* ── КНОПКА «НАЗАД» (Android) ──
 * MainActivity вызывает window.handleBack(). true — страница сама обработала «назад»
 * (закрыла шторку/окно/чат), false — приложению можно закрыться как обычно.
 * Порядок: самое верхнее закрываем первым. */
window.handleBack=function(){
  // 0. Окно звонка — сворачиваем в плавающую плитку
  if(window.VideoCall?.visible){window.VideoCall.minimize();return true;}
  // 1. Просмотр фото
  if($('lightbox')?.classList.contains('open')){closeLightbox();return true;}
  // 2. Меню сообщения
  if(_mm&&_mm.classList.contains('open')&&_mm.classList.contains('show')){closeMsgMenu();return true;}
  // 3. Шторки (профиль, участники, поиск, звонок…) — верхняя
  if(Sheet.closeTop())return true;
  // 4. Модальные окна
  const modal=document.querySelector('.modal-overlay.open');
  if(modal){closeModal(modal.id);return true;}
  // 5. Панель треда
  if($('thread-panel')?.classList.contains('open')){closeThread();return true;}
  // 6. Подсказка упоминаний
  if($('mention-popup')?.classList.contains('open')){closeMentionPopup();return true;}
  // 7. Переписка или вкладка «Комнаты»/«Группы» → к списку чатов
  const cur=_allViews.find(v=>{const e=$(v);return e&&getComputedStyle(e).display!=='none';});
  if(cur==='conversation'){leaveConversation();return true;}
  if(cur&&cur!=='no-channel'){openSidebar();return true;}
  // 8. Мы на главном экране — пусть приложение закроется как обычно
  return false;
};

function initUI(){
  const input=$('msg-input');
  initMessageEvents();

  initGroups();

  // Scroll btn
  let scrollRaf=0;
  $('msg-list').addEventListener('scroll',()=>{
    if(scrollRaf)return;
    scrollRaf=requestAnimationFrame(()=>{
      scrollRaf=0;
      if(isNearBottom()){newMsgCount=0;updateScrollBtn();$('scroll-btn').classList.remove('show');document.title='dastdaroz';}
      else $('scroll-btn').classList.add('show');
    });
  },{passive:true});

  // Input core
  input.addEventListener('input',()=>{
    ar(input);
    const len=input.value.length;
    $('btn-send').disabled=!input.value.trim()&&!pendingFile;
    // Char count
    const cc=$('char-count');
    if(len>3200){cc.textContent=`${len}/${MAX_CHARS}`;cc.className='char-count '+(len>MAX_CHARS?'over':'warn');}
    else cc.textContent='';
    // Typing
    clearTimeout(typingTimer);
    if(input.value.trim()){broadcastTyping();typingTimer=setTimeout(clearTyping,4000);}
    // Mention detection
    const val=input.value,cursor=input.selectionStart;
    const before=val.slice(0,cursor);
    const atMatch=before.match(/@([^\s]*)$/);
    if(atMatch&&usersLoaded){openMentionPopup(atMatch[1]);}
    else closeMentionPopup();
  });

  input.addEventListener('keydown',e=>{
    // Mention navigation
    if($('mention-popup').classList.contains('open')){
      if(e.key==='ArrowDown'){e.preventDefault();mentionIdx=Math.min(mentionIdx+1,mentionMatches.length-1);updateMentionHighlight();return;}
      if(e.key==='ArrowUp'){e.preventDefault();mentionIdx=Math.max(mentionIdx-1,0);updateMentionHighlight();return;}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertMention(mentionIdx);return;}
      if(e.key==='Escape'){closeMentionPopup();return;}
    }
    if((e.key==='Enter'&&!e.shiftKey)||(e.key==='Enter'&&e.ctrlKey)){e.preventDefault();sendMessage();}
  });

  input.addEventListener('blur',()=>setTimeout(closeMentionPopup,150));

  $('btn-send').addEventListener('click',sendMessage);
  $('reply-close').addEventListener('click',clearReply);

  // Emoji

  // File
  $('file-input').addEventListener('change',e=>{if(e.target.files[0])handleFileSelect(e.target.files[0]);});
  $('upload-cancel').addEventListener('click',cancelUpload);
  document.addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(f&&currentCh)handleFileSelect(f);});

  // Drag & drop
  const main=$('main');

  main.addEventListener('dragleave',()=>{dragCounter--;if(dragCounter<=0){dragCounter=0;$('drag-overlay').classList.remove('active');}});
  main.addEventListener('dragover',e=>e.preventDefault());
  main.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;$('drag-overlay').classList.remove('active');const f=e.dataTransfer.files[0];if(f&&currentCh)handleFileSelect(f);});

  // ── Звонки: видео и аудио (WebRTC + Firestore-сигнализация) ─────
  // Тип звонка — поле kind ('video' | 'audio') в документе pulsar_calls/{id}. Аудио — тот же поток без камеры.
  // Звонящий пишет offer в pulsar_calls/{id}; собеседник видит в чате баннер «Присоединиться»,
  // отвечает answer'ом. ICE-кандидаты идут через подколлекции callerCandidates / calleeCandidates.
  // «Назад» сворачивает окно в плавающую плитку (#vc-mini) с камерой собеседника.
  //
  // ICE: сейчас только STUN. Когда поднимешь свой TURN — впиши его сюда или задай window.PULSAR_ICE_SERVERS до загрузки:
  const ICE_SERVERS = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }
    // , { urls: ['turn:turn.example.com:3478?transport=udp', 'turn:turn.example.com:3478?transport=tcp', 'turns:turn.example.com:5349?transport=tcp'],
    //     username: 'USER', credential: 'PASSWORD' }
  ];
  const VideoCall = (() => {
    const $v = id => document.getElementById(id);
    const ICO = {
      mic:  $v('vc-mic').innerHTML,
      micX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor" fill-opacity=".14"/><path d="M5 11a7 7 0 0014 0M12 18v3M3 3l18 18"/></svg>',
      cam:  $v('vc-cam').innerHTML,
      camX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5" fill="currentColor" fill-opacity=".14"/><path d="M15.5 10.5l4.9-3a.6.6 0 01.9.5v8a.6.6 0 01-.9.5l-4.9-3M3 3l18 18"/></svg>'
    };
    const st = {
      state:'idle', kind:'video', min:false, ch:null, peerId:null, stream:null, facing:'user', mic:true, cam:true, session:0, t0:0, timer:null, corner:{h:'r', v:'t'}, swap:false, remoteMicOff:false,
      role:null, callRef:null, callStatus:null, pc:null, txA:null, txV:null, remote:null, remoteCamOff:false, answered:false,
      pendingIce:[], unsubs:[], ringTimer:null, dropTimer:null
    };
    const vc = $v('vc'), pip = $v('vc-pip'), localV = $v('vc-local-video'), remoteV = $v('vc-remote-video');
    const mini = $v('vc-mini'), miniV = $v('vcm-video');
    const DAY = 864e5;
    let wake = null;
    async function keepAwake(on){
      try {
        if (on){ if (!wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } }
        else { await wake?.release(); wake = null; }
      } catch(e){}
    }

    function avaInto(box, photo, name){
      box.textContent = '';
      if (photo){ const i = document.createElement('img'); i.alt = ''; i.src = photo; box.appendChild(i); }
      else box.textContent = ini(name);
    }
    const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

    function setState(s){
      st.state = s;
      ringback(s === 'calling');                                  // гудки у звонящего, пока ждём ответа
      if (s !== 'connected') vc.classList.remove('ui-hidden');
      vc.classList.toggle('calling', s === 'calling' || s === 'connecting');
      const sub = $v('vc-top-sub'), status = $v('vc-peer-status'), badge = $v('vcm-badge');
      clearInterval(st.timer);
      if (s === 'calling' || s === 'connecting'){
        const txt = s === 'calling' ? 'Вызываем…' : 'Соединяем…';
        status.textContent = txt; sub.textContent = badge.textContent = txt;
        sub.classList.remove('live'); badge.classList.remove('live');
      } else if (s === 'connected'){
        status.textContent = 'На связи'; sub.classList.add('live'); badge.classList.add('live'); st.t0 = Date.now();
        const tick = () => { sub.textContent = badge.textContent = fmt(Math.floor((Date.now() - st.t0)/1000)); };
        tick(); st.timer = setInterval(tick, 1000);
      }
      updateRemoteView();
    }
    // Тап по маленькой плитке меняет «большой экран» и плитку местами (как в Telegram). Только когда на связи.
    function swapped(){ return st.swap && st.state === 'connected'; }
    function paintMirror(){
      const m = st.facing === 'user', sw = swapped();
      localV.classList.toggle('mirror', m && !sw);        // моя камера в плитке
      remoteV.classList.toggle('mirror', m && sw);        // моя камера на большом экране
    }
    // Какое видео в каком элементе. Звук собеседника играет из того элемента, где сейчас его видео (он не muted).
    function bindVideos(force){
      const sw = swapped();
      const big = sw ? st.stream : st.remote, small = sw ? st.remote : st.stream;
      if (force || remoteV.srcObject !== big){ remoteV.srcObject = null; remoteV.srcObject = big; }
      if (force || localV.srcObject !== small){ localV.srcObject = null; localV.srcObject = small; }
      remoteV.muted = sw; localV.muted = !sw;
      remoteV.play?.().catch(()=>{}); localV.play?.().catch(()=>{});
      paintMirror();
    }
    // Заглушка (аватарка), когда на экране нет видео: на большом экране и в плитке показываем «своего» человека
    let whoKey = '';
    function paintWho(sw){
      const key = (sw ? 's' : 'n') + st.peerId;
      if (key === whoKey) return; whoKey = key;
      const meU = allUsers[me.uid] || {}, peer = allUsers[st.peerId] || {};
      const meName = me.displayName || meU.displayName || me.email, meImg = me.photoURL || meU.photoURL;
      const peerName = peer.displayName || peer.email || 'Собеседник';
      avaInto($v('vc-peer-ava'), sw ? meImg : peer.photoURL, sw ? meName : peerName);
      avaInto($v('vc-me-ava'),   sw ? peer.photoURL : meImg, sw ? peerName : meName);
    }
    function toggleSwap(){
      if (st.state !== 'connected') return;
      st.swap = !st.swap;
      bindVideos(true); updateRemoteView();
    }
    // Видео собеседника показываем, только когда связь есть, трек живой и камера у него включена
    function updateRemoteView(){
      const sw = swapped();
      const remoteLive = st.state === 'connected' && !st.remoteCamOff && !!st.remote &&
                         st.remote.getVideoTracks().some(t => t.readyState === 'live' && !t.muted);
      const bigLive = sw ? st.cam : remoteLive, smallLive = sw ? remoteLive : st.cam;
      vc.classList.toggle('has-remote', bigLive); mini.classList.toggle('has-remote', remoteLive);
      pip.classList.toggle('cam-off', !smallLive);
      pip.classList.toggle('mic-off', !st.mic && !sw);     // значок «мой микрофон выключен» — только на моей плитке
      $v('vc-top-mic').toggleAttribute('hidden', !(st.state === 'connected' && st.remoteMicOff));   // у собеседника выключен микрофон
      paintWho(sw);
      if (st.state === 'connected' && !bigLive) $v('vc-peer-status').textContent = (st.kind !== 'audio' && (sw || st.remoteCamOff)) ? 'Камера выключена' : 'На связи';
    }

    /* ── локальная камера ── */
    const AUD = { echoCancellation:true, noiseSuppression:true, autoGainControl:true };
    const VID = () => ({ facingMode:{ideal:st.facing}, width:{ideal:720}, height:{ideal:960}, frameRate:{ideal:30, max:30} });
    const hint = s => s.getVideoTracks().forEach(t => { try { t.contentHint = 'motion'; } catch(e){} });
    async function newVideoTrack(){
      const s = await navigator.mediaDevices.getUserMedia({ video: VID() });
      hint(s); return s.getVideoTracks()[0];
    }
    async function acquire(){
      const my = st.session;
      let stream = null;
      if (!navigator.mediaDevices?.getUserMedia){ toast(st.kind === 'audio' ? 'Микрофон недоступен в этом браузере' : 'Камера недоступна в этом браузере','err'); st.cam = false; st.mic = st.kind === 'audio' ? false : st.mic; paintCam(false); paintMic(st.mic); return; }
      if (st.kind === 'audio'){
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: AUD }); }
        catch(e){ toast('Нет доступа к микрофону','err'); st.mic = false; paintMic(false); return; }
        if (my !== st.session){ stream.getTracks().forEach(t => t.stop()); return; }
        st.stream = stream; stream.getAudioTracks().forEach(t => t.enabled = st.mic);
        bindVideos(true); return;
      }
      const vid = VID();
      try { stream = await navigator.mediaDevices.getUserMedia({ video: vid, audio: AUD }); }
      catch(e1){
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); toast('Нет доступа к камере','err'); st.cam = false; paintCam(false); }
        catch(e2){
          try { stream = await navigator.mediaDevices.getUserMedia({ video: vid }); toast('Микрофон недоступен','err'); st.mic = false; paintMic(false); }
          catch(e3){ toast('Нет доступа к камере и микрофону','err'); st.cam = false; st.mic = false; paintCam(false); paintMic(false); return; }
        }
      }
      if (my !== st.session){ stream.getTracks().forEach(t => t.stop()); return; }   // звонок уже закрыли
      st.stream = stream; hint(stream);
      stream.getAudioTracks().forEach(t => t.enabled = st.mic);
      bindVideos(true);
      try {
        const devs = await navigator.mediaDevices.enumerateDevices();
        const n = devs.filter(d => d.kind === 'videoinput').length;
        $v('vc-flip').hidden = n < 2 && !matchMedia('(pointer:coarse)').matches;
      } catch(e){}
    }
    function releaseStream(){
      st.stream?.getTracks().forEach(t => t.stop());
      st.stream = null; localV.srcObject = null;
    }
    // Отправляем собеседнику актуальные треки (без пересогласования соединения)
    function syncSenders(){
      const a = st.stream?.getAudioTracks()[0] || null, v = st.stream?.getVideoTracks()[0] || null;
      st.txA?.sender.replaceTrack(a).catch(()=>{});
      st.txV?.sender.replaceTrack(v).catch(()=>{});
    }
    function tuneSender(){
      const s = st.txV?.sender; if (!s) return;
      try {
        const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = 1200000; p.encodings[0].maxFramerate = 30;
        s.setParameters(p).catch(()=>{});
      } catch(e){}
    }
    function sendCamFlag(){
      if (st.callRef && st.callStatus) updateDoc(st.callRef, { ['cam.' + me.uid]: st.cam }).catch(()=>{});
    }
    // Микрофон — отдельным запросом: если правила Firestore не знают поле mic, это не сломает флаг камеры
    function sendMicFlag(){
      if (st.callRef && st.callStatus) updateDoc(st.callRef, { ['mic.' + me.uid]: st.mic }).catch(()=>{});
    }

    function paintMic(on){
      const b = $v('vc-mic'); b.classList.toggle('off', !on); b.innerHTML = on ? ICO.mic : ICO.micX;
      updateRemoteView();
    }
    function paintCam(on){
      const b = $v('vc-cam'); b.classList.toggle('off', !on); b.innerHTML = on ? ICO.cam : ICO.camX;
      updateRemoteView();
    }
    function toggleMic(){
      st.mic = !st.mic;
      st.stream?.getAudioTracks().forEach(t => t.enabled = st.mic);
      paintMic(st.mic); sendMicFlag();
    }
    // Выключая камеру, трек останавливаем полностью — индикатор камеры на телефоне гаснет.
    async function toggleCam(){
      st.cam = !st.cam; paintCam(st.cam); sendCamFlag();
      if (!st.stream) return;
      if (!st.cam){ st.stream.getVideoTracks().forEach(t => { t.stop(); st.stream.removeTrack(t); }); syncSenders(); return; }
      const my = st.session;
      try {
        const vt = await newVideoTrack();
        if (my !== st.session || !st.cam){ vt.stop(); return; }
        st.stream.addTrack(vt);
        bindVideos(true);
        syncSenders();
      } catch(e){ st.cam = false; paintCam(false); sendCamFlag(); toast('Не удалось включить камеру','err'); }
    }
    async function flip(){
      st.facing = st.facing === 'user' ? 'environment' : 'user';
      paintMirror();
      if (!st.stream || !st.cam) return;                    // камера выключена — запомнили сторону, включится уже с ней
      st.stream.getVideoTracks().forEach(t => { t.stop(); st.stream.removeTrack(t); });   // без этого мобильные браузеры не отдают вторую камеру
      const my = st.session;
      try {
        const vt = await newVideoTrack();
        if (my !== st.session){ vt.stop(); return; }
        st.stream.addTrack(vt);
        bindVideos(true);
        syncSenders();
      } catch(e){
        st.facing = st.facing === 'user' ? 'environment' : 'user';
        paintMirror();
        st.cam = false; paintCam(false); syncSenders(); sendCamFlag(); toast('Не удалось переключить камеру','err');
      }
    }

    /* ── моя камера: плавающая плитка, перетаскивание + прилипание к углам ── */
    function bounds(){
      const top = $v('vc-top'), bar = document.querySelector('#vc .vc-bar');
      return { w: vc.clientWidth, top: top.offsetTop + top.offsetHeight + 4, bot: bar.offsetTop - 4 };
    }
    function place(x, y){ pip.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)'; }
    function snap(){
      const b = bounds(), pw = pip.offsetWidth, ph = pip.offsetHeight, m = 14;
      const x = st.corner.h === 'l' ? m : b.w - pw - m;
      const y = st.corner.v === 't' ? b.top : Math.max(b.top, b.bot - ph);
      place(x, y); pip._x = x; pip._y = y;
    }
    (function pipDrag(){
      let sx, sy, ox, oy, id = null, moved = false;
      pip.addEventListener('pointerdown', e => {
        id = e.pointerId; moved = false; pip.setPointerCapture(id); pip.classList.add('drag');
        sx = e.clientX; sy = e.clientY; ox = pip._x || 0; oy = pip._y || 0;
      });
      pip.addEventListener('pointermove', e => {
        if (id !== e.pointerId) return;
        if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;      // дрожание пальца — ещё тап, не перетаскивание
        moved = true;
        const b = bounds(), pw = pip.offsetWidth, ph = pip.offsetHeight;
        pip._x = Math.min(Math.max(ox + e.clientX - sx, 6), b.w - pw - 6);
        pip._y = Math.min(Math.max(oy + e.clientY - sy, b.top - 8), b.bot - ph + 8);
        place(pip._x, pip._y);
      });
      const up = e => {
        if (id !== e.pointerId) return; id = null; pip.classList.remove('drag');
        const b = bounds(), cx = pip._x + pip.offsetWidth/2, cy = pip._y + pip.offsetHeight/2;
        st.corner = { h: cx < b.w/2 ? 'l' : 'r', v: cy < (b.top + b.bot)/2 ? 't' : 'b' };
        snap();
        if (!moved && e.type === 'pointerup') toggleSwap();                        // тап по плитке — поменять местами
      };
      pip.addEventListener('pointerup', up); pip.addEventListener('pointercancel', up);
    })();

    /* ── свёрнутый звонок: плитка собеседника, липнет к левому/правому краю ── */
    function miniPlace(side, top, animate){
      const W = window.innerWidth, H = window.innerHeight, w = mini.offsetWidth || 92, h = mini.offsetHeight || 124, gap = 10;
      top = Math.max(gap + 56, Math.min(top, H - h - gap - 64));
      mini.style.transition = animate ? 'left .22s var(--ease),top .22s var(--ease)' : 'none';
      mini.style.left = (side === 'left' ? gap : W - w - gap) + 'px';
      mini.style.top = top + 'px';
      mini.dataset.side = side; mini.dataset.top = top;
    }
    (function miniDrag(){
      let sx, sy, ox, oy, moved = false, drag = false;
      mini.addEventListener('pointerdown', e => {
        if (e.target.closest('.vcm-end')) return;
        drag = true; moved = false; sx = e.clientX; sy = e.clientY; ox = mini.offsetLeft; oy = mini.offsetTop;
        mini.style.transition = 'none'; mini.classList.add('drag');
        try { mini.setPointerCapture(e.pointerId); } catch(err){}
      });
      mini.addEventListener('pointermove', e => {
        if (!drag) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 6) return;
        moved = true;
        mini.style.left = Math.max(0, Math.min(ox + dx, window.innerWidth - mini.offsetWidth)) + 'px';
        mini.style.top  = Math.max(0, Math.min(oy + dy, window.innerHeight - mini.offsetHeight)) + 'px';
      });
      mini.addEventListener('pointerup', () => {
        if (!drag) return; drag = false; mini.classList.remove('drag');
        if (!moved){ expand(); return; }                                             // тап — вернуться в звонок
        const side = (mini.offsetLeft + mini.offsetWidth/2) < window.innerWidth/2 ? 'left' : 'right';
        miniPlace(side, mini.offsetTop, true);
      });
      mini.addEventListener('pointercancel', () => { drag = false; mini.classList.remove('drag'); });
    })();
    window.addEventListener('resize', () => {
      if (vc.classList.contains('open')) snap();
      if (st.min && mini.dataset.side) miniPlace(mini.dataset.side, +mini.dataset.top, false);
    });

    function minimize(){
      if (st.state === 'idle' || st.min) return;
      st.min = true;
      vc.classList.remove('open'); vc.setAttribute('aria-hidden', 'true');
      mini.style.display = 'block';
      miniPlace(mini.dataset.side || 'right', mini.dataset.side ? +mini.dataset.top : 80, false);
    }
    function expand(){
      if (!st.min) return;
      st.min = false; mini.style.display = 'none';
      vc.classList.add('open'); vc.setAttribute('aria-hidden', 'false');
      snap(); requestAnimationFrame(snap);
    }

    /* ── гудки: звонящий слышит «ту-у…», пока собеседник не ответил ── */
    let rb = null;
    function ringback(on){
      if (!on){ if (rb){ clearInterval(rb.iv); try { rb.ctx.close(); } catch(e){} rb = null; } return; }
      if (rb) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
        const ctx = new Ctx(), g = ctx.createGain(), o = ctx.createOscillator();
        g.gain.value = 0; o.frequency.value = 425; o.connect(g); g.connect(ctx.destination); o.start();
        const beep = () => {
          const t = ctx.currentTime; g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .05);
          g.gain.setValueAtTime(.12, t + 1); g.gain.linearRampToValueAtTime(0, t + 1.08);
        };
        ctx.resume?.(); beep();
        rb = { ctx, iv: setInterval(beep, 4000) };
      } catch(e){ rb = null; }
    }

    /* ── WebRTC ── */
    function makePC(){
      const pc = new RTCPeerConnection({ iceServers: window.PULSAR_ICE_SERVERS || ICE_SERVERS });
      const rs = st.remote = new MediaStream();
      pc.ontrack = e => {
        if (!rs.getTracks().includes(e.track)){ rs.addTrack(e.track); e.track.onmute = e.track.onunmute = e.track.onended = updateRemoteView; }
        bindVideos();
        if (miniV.srcObject !== rs){ miniV.srcObject = rs; miniV.play?.().catch(()=>{}); }   // в свёрнутой плитке видео без звука
        updateRemoteView();
      };
      const onState = () => {
        if (st.pc !== pc) return;
        const s = pc.connectionState || ({ completed:'connected' }[pc.iceConnectionState] || pc.iceConnectionState);
        if (s === 'connected'){
          clearTimeout(st.dropTimer); clearTimeout(st.ringTimer);
          if (st.state !== 'connected'){ setState('connected'); tuneSender(); } else updateRemoteView();
        } else if (s === 'disconnected'){
          $v('vc-peer-status').textContent = 'Связь нестабильна…';
          clearTimeout(st.dropTimer);
          st.dropTimer = setTimeout(() => { if (st.pc === pc && pc.connectionState !== 'connected' && pc.iceConnectionState !== 'connected'){ toast('Связь потеряна','err'); end(); } }, 12000);
        } else if (s === 'failed'){
          toast('Не удалось соединиться. Возможно, нужен TURN-сервер','err'); end();
        }
      };
      pc.onconnectionstatechange = onState; pc.oniceconnectionstatechange = onState;
      return pc;
    }
    const candData = c => Object.assign(JSON.parse(JSON.stringify(c.toJSON())), { expireAt: new Date(Date.now() + DAY) });
    function addRemoteIce(d){
      const c = { candidate:d.candidate, sdpMid:d.sdpMid, sdpMLineIndex:d.sdpMLineIndex, usernameFragment:d.usernameFragment };
      if (st.pc?.remoteDescription) st.pc.addIceCandidate(c).catch(()=>{}); else st.pendingIce.push(c);
    }
    function flushIce(){ const pc = st.pc; st.pendingIce.splice(0).forEach(c => pc?.addIceCandidate(c).catch(()=>{})); }

    function watchCall(ref, candCol){
      const my = st.session;
      st.unsubs.push(onSnapshot(ref, snap => {
        const d = snap.data(); if (!d || my !== st.session) return;
        st.callStatus = d.status;
        st.remoteCamOff = d.cam?.[st.peerId] === false; st.remoteMicOff = d.mic?.[st.peerId] === false; updateRemoteView();
        if (st.role === 'caller' && d.answer && !st.answered && st.pc?.signalingState === 'have-local-offer'){
          st.answered = true;
          st.pc.setRemoteDescription({ type:d.answer.type, sdp:d.answer.sdp })
            .then(() => { flushIce(); if (st.state === 'calling') setState('connecting'); clearTimeout(st.ringTimer); })
            .catch(e => console.warn('answer', e));
        }
        if (d.status === 'declined'){ toast('Звонок отклонён','err'); end(true); }
        else if (d.status === 'ended' || d.status === 'missed'){ toast('Звонок завершён'); end(true); }
      }, e => console.warn('call watch', e)));
      st.unsubs.push(onSnapshot(collection(ref, candCol), snap => {
        if (my !== st.session) return;
        snap.docChanges().forEach(ch => { if (ch.type === 'added') addRemoteIce(ch.doc.data()); });
      }, e => console.warn('cand watch', e)));
    }

    // Звонящий: offer → Firestore
    async function invite(){
      const my = st.session, peerId = st.peerId;
      st.role = 'caller'; st.pendingIce = []; st.answered = false;
      const pc = st.pc = makePC();
      const a = st.stream?.getAudioTracks()[0], v = st.stream?.getVideoTracks()[0];
      st.txA = pc.addTransceiver(a || 'audio', { direction:'sendrecv' });
      st.txV = st.kind === 'audio' ? null : pc.addTransceiver(v || 'video', { direction:'sendrecv' });
      const ref = st.callRef = doc(collection(fdb, 'pulsar_calls'));
      const buf = []; let ready = false;
      const push = c => addDoc(collection(ref, 'callerCandidates'), c).catch(()=>{});
      pc.onicecandidate = e => { if (!e.candidate) return; const c = candData(e.candidate); ready ? push(c) : buf.push(c); };
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      if (my !== st.session) return;
      await setDoc(ref, {
        chId: st.ch.id, from: me.uid, to: peerId, status: 'ringing', kind: st.kind,
        offer: { type: offer.type, sdp: offer.sdp }, cam: { [me.uid]: st.cam },
        createdAt: serverTimestamp(), clientTs: Date.now(), expireAt: new Date(Date.now() + DAY)
      });
      st.callStatus = 'ringing';
      if (my !== st.session){ updateDoc(ref, { status:'ended', endedBy: me.uid }).catch(()=>{}); return; }
      ready = true; buf.splice(0).forEach(push);
      if (!st.mic) sendMicFlag();                         // микрофона нет / выключен ещё до звонка
      watchCall(ref, 'calleeCandidates');
      st.ringTimer = setTimeout(() => { if (st.state === 'calling'){ toast('Не ответил','err'); end(false, 'missed'); } }, 45000);
    }

    // Принимающий: offer ← Firestore, answer → Firestore
    async function join(c){
      if (st.state !== 'idle'){ expand(); return; }
      showUI(c.from, { id: c.chId }, c.kind);
      st.role = 'callee'; setState('connecting');
      const my = st.session;
      await acquire();
      if (my !== st.session) return;
      try {
        const ref = st.callRef = doc(fdb, 'pulsar_calls', c.id);
        const cur = (await getDoc(ref)).data();
        if (my !== st.session) return;
        if (!cur || cur.status !== 'ringing'){ toast('Звонок уже завершён','err'); end(true); return; }
        st.pendingIce = []; st.answered = true;
        const pc = st.pc = makePC();
        pc.onicecandidate = e => { if (e.candidate) addDoc(collection(ref, 'calleeCandidates'), candData(e.candidate)).catch(()=>{}); };
        await pc.setRemoteDescription({ type: cur.offer.type, sdp: cur.offer.sdp });
        for (const tx of pc.getTransceivers()){
          tx.direction = 'sendrecv';                       // иначе answer уйдёт как recvonly и звонящий нас не увидит
          if (tx.receiver.track.kind === 'video') st.txV = tx; else st.txA = tx;
        }
        syncSenders();
        const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
        if (my !== st.session) return;
        await updateDoc(ref, { answer: { type: answer.type, sdp: answer.sdp }, status: 'active', answeredAt: serverTimestamp(), ['cam.' + me.uid]: st.cam });
        st.callStatus = 'active';
        if (!st.mic) sendMicFlag();
        watchCall(ref, 'callerCandidates');
      } catch(e){
        console.warn('join', e);
        if (my === st.session){ toast('Не удалось подключиться','err'); end(); }
      }
    }

    /* ── показать окно звонка ── */
    function showUI(peerId, ch, kind){
      const o = allUsers[peerId] || {}, name = o.displayName || o.email || 'Собеседник';
      st.ch = ch; st.peerId = peerId; st.session++; st.min = false; st.kind = kind === 'audio' ? 'audio' : 'video';
      vc.classList.toggle('audio', st.kind === 'audio'); vc.setAttribute('aria-label', st.kind === 'audio' ? 'Аудиозвонок' : 'Видеозвонок');
      st.facing = 'user'; st.corner = { h:'r', v:'t' }; st.mic = true; st.cam = st.kind !== 'audio'; st.remoteCamOff = false; st.swap = false; st.remoteMicOff = false; vc.classList.remove('ui-hidden');
      paintMic(true); paintCam(st.cam); $v('vc-flip').hidden = false;
      bindVideos(true);
      $v('vc-peer-name').textContent = name; $v('vc-top-name').textContent = name;
      avaInto($v('vc-peer-ava'), o.photoURL, name);
      avaInto($v('vcm-ava'), o.photoURL, name);
      avaInto($v('vc-me-ava'), me.photoURL || allUsers[me.uid]?.photoURL, me.displayName || allUsers[me.uid]?.displayName || me.email);
      const bg = $v('vc-bg-photo');
      if (o.photoURL){ bg.style.backgroundImage = 'url("' + String(o.photoURL).replace(/"/g, '%22') + '")'; bg.classList.add('on'); }

      vc.classList.remove('has-remote'); mini.classList.remove('has-remote');
      vc.classList.add('open'); vc.setAttribute('aria-hidden', 'false');
      snap(); requestAnimationFrame(snap);
      keepAwake(true);
    }

    /* ── публичное API ── */
    async function open(kind){
      if (st.state !== 'idle'){ expand(); return; }          // звонок уже идёт — просто вернуть окно
      if (!currentCh || currentCh.type !== 'direct'){ toast('Звонки доступны только в личных чатах','err'); return; }
      if (!window.RTCPeerConnection){ toast('Звонки не поддерживаются в этом браузере','err'); return; }
      if (incoming && incoming.chId === currentCh.id){ joinIncoming(); return; }   // нам уже звонят — просто отвечаем
      const oid = (currentCh.members || []).find(u => u !== me.uid);
      showUI(oid, currentCh, kind);
      setState('calling');
      const my = st.session;
      await acquire();
      if (my !== st.session) return;
      try { await invite(); }
      catch(e){ console.warn('call invite', e); if (my === st.session){ toast('Не удалось начать звонок','err'); end(true); } }
    }
    // Запись о звонке в переписке: «исходящий / входящий / пропущенный» (см. callCardHtml)
    async function logCall(ch, result, dur, kind){
      try {
        const text = kind === 'audio' ? '📞 Аудиозвонок' : '📹 Видеозвонок', name = me.displayName || me.email;
        const r = await addDoc(collection(fdb, 'pulsar_channels', ch.id, 'messages'), {
          type:'call', callKind:kind === 'audio' ? 'audio' : 'video', callResult:result, callDur:dur || 0, text,
          authorId: me.uid, authorName: name, ts: serverTimestamp(), clientTs: Date.now(),
          edited:false, deleted:false, pinned:false, reactions:{}, replyTo:null, threadCount:0
        });
        updateDoc(doc(fdb, 'pulsar_channels', ch.id), { lastMessage:{ id:r.id, text, authorId:me.uid, authorName:name, attachmentType:null, ts:serverTimestamp() } }).catch(()=>{});
      } catch(e){ console.warn('call log', e); }
    }
    // remote=true — звонок закончил собеседник (в документ ничего не пишем)
    async function end(remote = false, status = 'ended'){
      if (st.state === 'idle') return;
      const ref = st.callRef, cs = st.callStatus;
      const logCh = st.ch, kind = st.kind, asCaller = st.role === 'caller', wasLive = st.state === 'connected';
      const dur = wasLive ? Math.round((Date.now() - st.t0) / 1000) : 0;
      st.session++; clearInterval(st.timer); clearTimeout(st.ringTimer); clearTimeout(st.dropTimer);
      st.unsubs.splice(0).forEach(u => { try { u(); } catch(e){} });
      try { st.pc?.close(); } catch(e){}
      releaseStream(); remoteV.srcObject = null; miniV.srcObject = null; keepAwake(false);
      remoteV.muted = false; localV.muted = true; remoteV.classList.remove('mirror'); ringback(false);
      if (ref && !remote && cs && cs !== 'ended' && cs !== 'declined' && cs !== 'missed')
        updateDoc(ref, { status, endedBy: me.uid, endedAt: serverTimestamp() }).catch(()=>{});
      if (asCaller && cs && logCh?.id)                       // запись в чат пишет только звонящий — один документ на звонок
        logCall(logCh, wasLive ? 'ended' : cs === 'declined' ? 'declined' : status === 'missed' ? 'missed' : 'cancelled', dur, kind);
      Object.assign(st, { state:'idle', kind:'video', min:false, ch:null, peerId:null, role:null, callRef:null, callStatus:null, pc:null, txA:null, txV:null,
                          remote:null, remoteCamOff:false, answered:false, pendingIce:[], swap:false, remoteMicOff:false });
      vc.classList.remove('open', 'has-remote', 'calling', 'ui-hidden'); vc.setAttribute('aria-hidden', 'true');
      mini.style.display = 'none'; mini.classList.remove('has-remote');
    }

    /* ── входящие звонки: баннер «Присоединиться» в чате ── */
    let incoming = null, incUnsub = null, incExpiry = null, ringIv = null;
    function refreshBanner(){
      const b = $v('call-banner'); if (!b) return;
      const show = !!incoming && !!currentCh && currentCh.id === incoming.chId;
      b.style.display = show ? 'flex' : 'none';
      if (show){
        const au = incoming.kind === 'audio';
        $v('cb-t').textContent = au ? 'Аудиозвонок' : 'Видеозвонок';
        $v('cb-ico').innerHTML = au ? CALL_ICO.tel : CALL_ICO.cam;
        const o = allUsers[incoming.from] || {}; $v('cb-sub').textContent = (o.displayName || o.email || 'Собеседник') + ' звонит…'; }
    }
    function stopRing(){ clearInterval(ringIv); ringIv = null; }
    function setIncoming(c){
      const prev = incoming?.id;
      clearTimeout(incExpiry); incExpiry = null;
      if (c && st.state !== 'idle'){                                  // мы уже в звонке — отвечаем «занято»
        updateDoc(doc(fdb, 'pulsar_calls', c.id), { status:'declined', reason:'busy' }).catch(()=>{});
        c = null;
      }
      incoming = c;
      if (c){
        incExpiry = setTimeout(() => { if (incoming?.id === c.id){ incoming = null; stopRing(); refreshBanner(); } }, Math.max(1000, 60000 - (Date.now() - c.ts)));
        if (c.id !== prev){
          const o = allUsers[c.from] || {}, nm = o.displayName || o.email || 'Собеседник';
          const inChat = _curView() === 'conversation' && currentCh?.id === c.chId;
          const au = c.kind === 'audio';
          if (!inChat) toast((au ? '📞 Аудиозвонок от ' : '📹 Видеозвонок от ') + nm + ' — откройте чат и нажмите «Присоединиться»');
          try { if (document.hidden && typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(au ? 'Аудиозвонок' : 'Видеозвонок', { body: nm + ' звонит' }); } catch(e){}
          stopRing(); playNotifSound(); ringIv = setInterval(playNotifSound, 2800);
        }
      } else stopRing();
      refreshBanner();
    }
    function listenIncoming(){
      if (incUnsub || !me) return;
      incUnsub = onSnapshot(query(collection(fdb, 'pulsar_calls'), where('to', '==', me.uid), where('status', '==', 'ringing')), snap => {
        const now = Date.now(); let best = null;
        snap.forEach(d => {
          const v = d.data(), ts = v.createdAt?.toMillis?.() || v.clientTs || now;
          if (now - ts > 60000) return;                                // зависший старый вызов
          if (!best || ts > best.ts) best = { id: d.id, ...v, ts };
        });
        setIncoming(best);
      }, e => console.warn('calls listen', e));
    }
    function joinIncoming(){
      if (!incoming) return;
      const c = incoming; incoming = null; stopRing(); clearTimeout(incExpiry); refreshBanner();
      join(c);
    }
    function declineIncoming(){
      if (!incoming) return;
      const c = incoming; incoming = null; stopRing(); clearTimeout(incExpiry); refreshBanner();
      updateDoc(doc(fdb, 'pulsar_calls', c.id), { status:'declined' }).catch(()=>{});
    }
    function shutdown(){
      end(); stopRing(); clearTimeout(incExpiry); incoming = null; refreshBanner();
      try { incUnsub?.(); } catch(e){} incUnsub = null;
    }

    $v('vc-mic').addEventListener('click', toggleMic);
    $v('vc-cam').addEventListener('click', toggleCam);
    $v('vc-flip').addEventListener('click', flip);
    $v('vc-end').addEventListener('click', () => end());

    $v('cb-join').addEventListener('click', joinIncoming);

    document.addEventListener('visibilitychange', () => { if (!document.hidden && st.state !== 'idle') keepAwake(true); });
    remoteV.addEventListener('playing', updateRemoteView);
    listenIncoming();

  // Mute (button optional — may be absent)
  $('btn-mute')?.addEventListener('click',()=>{
    if(!currentCh){toast('Выберите канал','err');return;}
    const id=currentCh.id;
    if(mutedChannels.has(id)){mutedChannels.delete(id);$('btn-mute')?.classList.remove('active');toast('Уведомления включены','ok');}
    else{mutedChannels.add(id);$('btn-mute')?.classList.add('active');toast('Уведомления выключены','ok');}
    localStorage.setItem('p_muted',JSON.stringify([...mutedChannels]));
  });

  // Modals close
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.modal)));
  document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov.id);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('lightbox').classList.contains('open')){closeLightbox();return;}document.querySelectorAll('.modal-overlay.open').forEach(el=>closeModal(el.id));}});

  // Reset title on focus
  window.addEventListener('focus',()=>{document.title='dastdaroz';});

  // Navigation
  $('btn-back-to-chats').addEventListener('click',()=>{ leaveConversation(); });
  $('mob-btn-dms')?.addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-channels')?.addEventListener('click',()=>{ setNavActive('mob-btn-channels'); clearChatSearch(); showView('view-rooms'); renderRoomList(); });
  $('mob-btn-new')?.addEventListener('click',()=>{ setNavActive('mob-btn-new'); showView('view-groups'); renderGroupList(); });

  // Logout
  $('acc-logout')?.addEventListener('click',async()=>{
    if(!confirm('Выйти из dastdaroz?'))return;
    try{window.VideoCall?.shutdown();}catch(e){} stopSupport(); closeAvatarPicker(); closeBgPicker();
    await updatePresence('offline');clearTyping();
    // Убираем FCM-токен этого устройства из профиля, чтобы пуши не приходили после выхода
    // (только если там лежит именно наш токен — токен другого устройства не трогаем)
    try{
      const tok=window._myFcmToken;
      if(tok&&me){const r=doc(fdb,'users',me.uid);const s=await getDoc(r);
        if(s.exists()&&s.data().fcmToken===tok)await setDoc(r,{fcmToken:null},{merge:true});}
    }catch(e){}
    try{window.AndroidBridge?.onLogout?.();}catch(e){}   // Android: сбросить UID для FcmTokenWorker
    await signOut(auth);location.replace('login.html');
  });
}
</script>
</body>
</html>
