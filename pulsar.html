<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>dastdaroz</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"/></noscript>
<style>
:root{
  --bg:#f3f7f4;--surface:#ffffff;--surface-2:#edf4ef;--surface-3:#e0ede3;--surface-4:#c8dccb;
  --border:rgba(0,0,0,.07);--border-h:rgba(0,0,0,.15);
  --accent:#1a9e4a;--accent-dim:rgba(26,158,74,.09);--accent-mid:rgba(26,158,74,.25);
  --text:#171f1a;--muted:#5a7a62;--muted-2:#8aa88e;--muted-3:#c8dccb;
  --accent-2:#22c55e;--acc-shadow:rgba(26,158,74,.25);
  --green:#1a9e4a;--red:#dc2626;--amber:#d97706;--blue:#2563eb;
  --font-display:'Unbounded',sans-serif;--font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --topbar-h:56px;--mob-nav-h:58px;--thread-w:340px;
  --safe-b:env(safe-area-inset-bottom,0px);--spring:cubic-bezier(.34,1.56,.64,1);
  --tf:.14s;--ease:cubic-bezier(.4,0,.2,1);
  /* шкала размеров */
  --fs-2xs:.6875rem;--fs-xs:.75rem;--fs-sm:.8125rem;--fs-md:.875rem;--fs-lg:1rem;--fs-xl:1.25rem;--fs-2xl:1.5rem;--fs-3xl:2.5rem;
  --r-sm:6px;--r:10px;--r-lg:14px;--r-xl:20px;
  /* ── единые токены элементов ── */
  --av-xs:24px;--av-sm:32px;--av-md:40px;--av-lg:48px;--av-xl:72px;       /* аватары */
  --ctl-sm:28px;--ctl-md:36px;--ctl-lg:40px;--ctl-xl:48px;--tb-btn:var(--ctl-md);       /* кнопки/поля */
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.12);--shadow-lg:0 8px 32px rgba(0,0,0,.12);--shadow-accent:0 3px 10px var(--acc-shadow);
  --on-accent:#fff;--red-dim:rgba(220,38,38,.1);--accent-soft:rgba(26,158,74,.06);
  --scrim:rgba(0,0,0,.35);--scrim-strong:rgba(0,0,0,.6);
  /* слои (листы Sheet.js: 650 между conn и notif) */
  --z-bar:10;--z-float:20;--z-drop:50;--z-popup:100;--z-input:120;--z-nav:150;--z-scrim:190;--z-mention:200;--z-panel:250;--z-modal:300;--z-conn:500;--z-menu:550;--z-notif:8000;--z-lightbox:9998;--z-toast:9999;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--on-accent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button,a,label,[role=button]{touch-action:manipulation}   /* без задержки тапа и зума по двойному тапу */
button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent-mid);outline-offset:2px}   /* фокус с клавиатуры — в цвет приложения; у полей ввода своя подсветка */
button:focus:not(:focus-visible){outline:none}
input:focus,textarea:focus,select:focus{outline:none}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:var(--r-sm)}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}

/* ── SHELL ── */
#shell{display:grid;height:100svh;grid-template-columns:1fr;grid-template-areas:"main"}
#shell.active{display:grid}
#shell.thread-open{grid-template-columns:1fr var(--thread-w);grid-template-areas:"main thread"}

/* Шапка сайдбара — как в Telegram */
.sb-head{
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--surface);
  position:sticky;top:0;z-index:var(--z-bar);
}
.sb-head-top{
  display:flex;align-items:center;gap:12px;width:100%;
}
.sb-logo-img{
  height:29px;width:auto;object-fit:contain;flex-shrink:0;
  display:block;
}
.sb-head-actions{display:flex;gap:4px}
.sb-action-btn{
  width:var(--tb-btn);height:var(--tb-btn);display:flex;align-items:center;justify-content:center;
  border-radius:var(--r);background:var(--surface-2);color:var(--text);
  transition:background var(--tf),color var(--tf);
}
.sb-action-btn:hover{background:var(--surface-3);color:var(--text)}
.sb-action-btn svg{width:22px;height:22px}

/* Список чатов */
.sb-chat-list{
  flex:1;overflow-y:auto;padding:0 0 8px;
}

/* Метка-раздел (тег "Каналы" / "Личные") */
.sb-section-tag{
  padding:8px 16px 4px;
  font-size:var(--fs-2xs);letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted-2);display:flex;align-items:center;gap:8px;
}
.sb-section-tag span{flex:1}
.sb-section-tag button{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);color:var(--muted-2);font-size:var(--fs-md);line-height:1;
  transition:background var(--tf),color var(--tf);
}
.sb-section-tag button:hover{background:var(--surface-3);color:var(--accent)}

/* ── CHAT CARD ── */
.ch-card{
  display:flex;align-items:center;gap:14px;
  padding:6px 16px;cursor:pointer;
  transition:background var(--tf);position:relative;
  user-select:none;min-width:0;
}
.ch-card:hover{background:var(--surface-2)}
.ch-card.active{background:var(--accent-dim)}
.ch-card.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;background:var(--accent);border-radius:0 2px 2px 0;
}

/* Аватар/иконка */
.ch-ava-wrap{
  position:relative;flex-shrink:0;
  width:56px;height:56px;
}
.ch-ava{
  width:56px;height:56px;border-radius:50%;
  background:var(--surface-3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-lg);font-weight:700;color:var(--accent);
  position:relative;overflow:hidden;
  transition:border-color var(--tf);
}
.ch-ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ch-ava.ch-ava--ch{
  border-radius:var(--r-lg);
  background:var(--accent-dim);border-color:var(--accent-mid);
  font-size:var(--fs-md);color:var(--accent);
}
.ch-card.active .ch-ava{border-color:var(--accent-mid)}

/* Presence dot */
.ch-presence{
  position:absolute;bottom:0;right:0;
  width:13px;height:13px;border-radius:50%;
  border:2.5px solid var(--surface);
  transition:border-color var(--tf);
  pointer-events:none;
}
.ch-card.active .ch-presence{border-color:#eaf6ee}
.ch-presence.online{background:var(--green)}
.ch-presence.away{background:var(--amber)}
.ch-presence.offline{background:var(--muted-2)}

/* Тело карточки */
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ch-row1{display:flex;align-items:center;gap:6px}
.ch-title{
  font-size:.96875rem;font-weight:500;color:var(--text);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-card:not(.active) .ch-title{color:var(--muted);font-weight:400}
.ch-card:hover .ch-title,.ch-card.active .ch-title{color:var(--text);font-weight:500}
.ch-ts{font-size:var(--fs-xs);color:var(--muted-2);white-space:nowrap;flex-shrink:0}
.ch-card.has-unread .ch-ts{color:var(--accent)}

.ch-preview{
  flex:1;font-size:.84375rem;color:var(--muted-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-preview b{color:var(--muted);font-weight:500}
.ch-preview.empty{font-style:italic;color:var(--muted-3)}

/* Unread badge */
.ch-badge{
  background:var(--red);color:var(--on-accent);
  font-size:var(--fs-2xs);font-weight:700;
  min-width:20px;height:20px;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(220,38,38,.35);
}

/* Skeleton */
/* верхний отступ — внутри первой карточки (фон активного чата идёт от самой шапки, без пустой полосы) */
.sb-chat-list>.ch-card:first-child{padding-top:12px}
#chat-list-skeleton>.ch-card-sk:first-child{padding-top:12px}
.ch-card-sk{display:flex;align-items:center;gap:14px;padding:6px 16px}
.sk-circle{width:56px;height:56px;border-radius:50%;background:var(--surface-3);flex-shrink:0;animation:skPulse 1.8s ease-in-out infinite}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:8px}


/* User panel (нижняя панель) */

.icon-btn{width:var(--ctl-md);height:var(--ctl-md);display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);transition:background var(--tf),color var(--tf)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.active{color:var(--accent)}

/* ── MAIN ── */
#main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}

/* Topbar */
.topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:5}
.topbar .icon-btn{width:var(--tb-btn);height:var(--tb-btn)}
.topbar-who{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.topbar-ava{
  width:var(--av-md);height:var(--av-md);border-radius:50%;flex-shrink:0;overflow:hidden;position:relative;
  background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:var(--fs-md);
}
.topbar-ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.topbar-name{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.topbar-ch-name{font-size:var(--fs-lg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.topbar-desc{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.topbar-desc.online{color:var(--accent)}
.topbar-desc:empty{display:none}
.topbar-actions{gap:6px}
/* Иконки в скруглённых квадратах: нейтральная плитка и акцентная (звонки) */
.tile{background:var(--surface-2);color:var(--text);border-radius:var(--r)}
.tile:hover{background:var(--surface-3);color:var(--text)}
.tile-accent{background:var(--accent-dim);color:var(--accent)}
.tile-accent:hover{background:var(--accent-mid);color:var(--accent)}
.tile svg{width:20px;height:20px}
.topbar-actions{display:flex;flex-shrink:0;align-items:center}

/* Pinned bar */
#pinned-bar{display:none;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(135deg,rgba(26,158,74,.07),rgba(26,158,74,.03));border-bottom:1px solid rgba(26,158,74,.15);cursor:pointer;transition:background var(--tf);flex-shrink:0}
#pinned-bar:hover{background:linear-gradient(135deg,rgba(26,158,74,.12),var(--accent-soft))}
#pinned-bar.visible{display:flex}
.pinned-icon{color:var(--accent);flex-shrink:0}
.pinned-text{font-size:var(--fs-2xs);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinned-text strong{color:var(--accent)}
.pinned-close{color:var(--muted-2);padding:2px;transition:color var(--tf);flex-shrink:0;border-radius:var(--r-sm)}
.pinned-close:hover{color:var(--text);background:var(--surface-3)}

/* ── DRAG DROP OVERLAY ── */
#drag-overlay{position:absolute;inset:0;z-index:var(--z-drop);background:var(--accent-soft);border:2px dashed var(--accent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(2px)}
#drag-overlay.active{display:flex}
.drag-icon{font-size:var(--fs-3xl)}
.drag-label{font-size:var(--fs-sm);color:var(--accent);font-family:var(--font-display);font-weight:700;letter-spacing:.04em}
.drag-sub{font-size:var(--fs-2xs);color:var(--muted)}

/* ── MESSAGES ── */
#msg-list{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column;overscroll-behavior:contain;scroll-behavior:smooth}

/* Date divider */
.date-div{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;pointer-events:none}
.date-div-line{flex:1;height:1px;background:var(--border)}
.date-div-text{font-size:var(--fs-2xs);color:var(--muted-2);white-space:nowrap;letter-spacing:.04em}

/* Message group */
.msg-group{position:relative;padding:1px 16px;display:flex;flex-direction:column}
.msg-group.msg-first{margin-top:12px}
.msg-group.new-msg{animation:msgSlideIn .24s var(--ease) both}
@keyframes msgSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Row — bubble alignment */
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg-row.is-me{justify-content:flex-end}

/* Bubble wrap */
.msg-bubble-wrap{display:flex;flex-direction:column;max-width:min(500px,74%);min-width:0}
.msg-row.is-me .msg-bubble-wrap{align-items:flex-end}
/* Meta */
.msg-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;padding:0 2px}
.msg-row.is-me .msg-meta{flex-direction:row-reverse}
.msg-author{font-size:var(--fs-xs);font-weight:600;color:var(--text);cursor:pointer;transition:color var(--tf)}
.msg-author:hover{color:var(--accent)}
.msg-author.is-me{color:var(--accent)}
.msg-time{font-size:var(--fs-2xs);color:var(--muted-2);font-weight:300}
.msg-edited-tag{font-size:var(--fs-2xs);color:var(--muted-2);font-style:italic}
.msg-pinned-tag{font-size:var(--fs-2xs);color:var(--accent);background:var(--accent-dim);padding:1px 4px;border-radius:var(--r-sm)}
/* Bubble */
.msg-bubble{position:relative;max-width:100%;padding:8px 12px;word-break:break-word;transition:background var(--tf)}   /* max-width: длинная цитата не раздувает пузырёк за экран */
.msg-row:not(.is-me) .msg-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:16px 16px 16px 4px}
.msg-row.is-me .msg-bubble{background:rgba(26,158,74,.13);border:1px solid rgba(26,158,74,.22);border-radius:16px 16px 4px 16px}
/* Consecutive — скругление только у сгруппированных (тот же автор) */
.msg-group.msg-grouped .msg-row:not(.is-me) .msg-bubble{border-top-left-radius:4px}
.msg-group.msg-grouped .msg-row.is-me .msg-bubble{border-top-right-radius:4px}
/* Text */
.msg-text{font-size:var(--fs-sm);line-height:1.6;color:var(--text);white-space:pre-wrap}
.msg-row.is-me .msg-text{color:#0d2e18}
.msg-text a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.msg-text a:hover{color:#8ab8e8}
.msg-text.deleted{color:var(--muted-2);font-style:italic}
.msg-text strong{font-weight:600}.msg-text em{font-style:italic}
/* Inline time inside bubble */
.msg-text{display:flow-root}   /* вмещает плавающее время */
/* Время (и статус) — в правом нижнем углу пузырька: рядом с последней строкой, если влезает, иначе строкой ниже справа */
/* --ts-drop — насколько опустить время относительно строки текста (больше = ниже).
   Общая высота (drop + 11px + нижний отступ) всегда 15px, поэтому высота пузыря от drop не зависит. */
.msg-ts-inline{--ts-drop:9px;float:right;display:inline-flex;align-items:center;gap:4px;margin:var(--ts-drop) 0 calc(4px - var(--ts-drop)) 10px;font-size:var(--fs-2xs);color:var(--muted-2);white-space:nowrap;line-height:1}
.msg-edited-inline{font-style:italic}
.msg-row.is-me .msg-ts-inline{color:rgba(13,46,24,.45)}
/* Статус доставки: ⏱ отправляется · ✓ на сервере · ✓✓ доставлено · зелёные ✓✓ прочитано (только свои, личные чаты) */
.msg-st{display:inline-flex;align-items:center;color:inherit}
.msg-st:empty{display:none}
.msg-st svg{display:block;width:17px;height:11px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.msg-st[data-st="3"]{color:var(--accent)}
/* Mention */
.mention{color:var(--accent);background:var(--accent-dim);padding:0 4px;border-radius:var(--r-sm);font-weight:500;cursor:pointer;transition:background var(--tf)}
.mention:hover{background:var(--accent-mid)}
.mention.is-me{background:rgba(26,158,74,.18);border:1px solid var(--accent-mid)}
/* Code inline */
.msg-text code{background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.09);padding:1px 4px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-family:var(--mono);color:var(--blue)}
/* Code block */
.code-block{margin:6px 0;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);border-radius:var(--r);overflow:hidden}
.code-block-head{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;border-bottom:1px solid var(--border)}
.code-lang{font-size:var(--fs-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.code-copy{font-size:var(--fs-2xs);color:var(--muted);padding:2px 8px;border-radius:var(--r-sm);background:rgba(0,0,0,.05);cursor:pointer;border:none;transition:color var(--tf)}
.code-copy:hover{color:var(--accent)}.code-copy.copied{color:var(--green)}
.code-block pre{padding:12px 12px;overflow-x:auto;font-size:var(--fs-xs);font-family:var(--mono);line-height:1.6;color:#1e3a2a}
/* Reply ref */
/* Цитата ответа — внутри пузырька, с акцентной линией слева */
.msg-reply-ref{display:flex;flex-direction:column;gap:1px;min-width:0;max-width:100%;margin:0 0 6px;padding:4px 10px;border-left:3px solid var(--accent);background:var(--accent-dim);border-radius:4px var(--r) var(--r) 4px;cursor:pointer;transition:background var(--tf)}
.msg-reply-ref:hover{background:var(--accent-mid)}
.msg-reply-author{font-size:var(--fs-xs);color:var(--accent);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-reply-text{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Image / file */
.msg-attachment{margin-top:4px}
.msg-img-wrap{display:inline-block;position:relative;cursor:pointer;border-radius:var(--r-lg);overflow:hidden}
.msg-img{max-width:260px;max-height:220px;display:block;object-fit:cover;border-radius:var(--r-lg);transition:opacity var(--tf)}
.msg-img:hover{opacity:.88}
.msg-img-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);opacity:0;transition:opacity var(--tf)}
.msg-img-wrap:hover .msg-img-overlay{opacity:1}
.msg-img-overlay svg{color:var(--on-accent)}
.msg-file{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.04);border:1px solid var(--border);padding:8px 12px;border-radius:var(--r-lg);cursor:pointer;transition:border-color var(--tf);text-decoration:none;max-width:240px}
.msg-file:hover{border-color:var(--border-h)}
.msg-file-icon{width:var(--ctl-sm);height:var(--ctl-sm);background:var(--accent-dim);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.msg-file-info{min-width:0}
.msg-file-name{font-size:var(--fs-xs);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;display:block}
.msg-file-size{font-size:var(--fs-2xs);color:var(--muted)}
/* Reactions */
.msg-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reaction-btn{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-lg);font-size:var(--fs-2xs);cursor:pointer;transition:background var(--tf),border-color var(--tf),color var(--tf);user-select:none}
.reaction-btn:hover{border-color:var(--border-h);background:var(--surface-3)}
.reaction-btn.active{border-color:var(--accent-mid);background:var(--accent-dim)}
.reaction-count{font-size:var(--fs-2xs);color:var(--muted)}
.reaction-btn.active .reaction-count{color:var(--accent)}
/* Thread button */
.msg-thread-btn{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:var(--fs-2xs);color:var(--blue);cursor:pointer;border-radius:var(--r-sm);padding:2px 6px;transition:background var(--tf)}
.msg-thread-btn:hover{background:rgba(106,159,216,.08)}
/* ── МЕНЮ СООБЩЕНИЯ ── */
#msg-menu{position:fixed;inset:0;z-index:var(--z-menu);display:none}
#msg-menu.open{display:block}
.mm-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .18s}
.mm-clone{position:absolute;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .12s}
.mm-pill,.mm-list{position:absolute;background:var(--surface);box-shadow:var(--shadow-lg);opacity:0;transform:scale(.9);transition:opacity .16s,transform .2s var(--spring)}
#msg-menu.show .mm-scrim,#msg-menu.show .mm-clone,#msg-menu.show .mm-pill,#msg-menu.show .mm-list{opacity:1}
#msg-menu.show .mm-pill,#msg-menu.show .mm-list{transform:none}
.mm-pill{display:flex;gap:2px;padding:6px 8px;border-radius:30px}
.mm-react{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;line-height:1;transition:transform .15s var(--spring),background var(--tf)}
.mm-react:hover{background:var(--surface-2)}
.mm-react:active{transform:scale(1.3)}
.mm-react.mine{background:var(--accent-dim)}
.mm-list{min-width:224px;padding:6px;border-radius:var(--r-xl)}
.mm-item{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:var(--r-lg);font-size:var(--fs-md);color:var(--text);text-align:left;transition:background var(--tf)}
.mm-item svg{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
.mm-item:hover,.mm-item:active{background:var(--surface-2)}
.mm-item.danger,.mm-item.danger svg{color:var(--red)}
.mm-item.danger:hover,.mm-item.danger:active{background:var(--red-dim)}

/* Edit */
.msg-edit-wrap{margin-top:4px;min-width:min(280px,62vw)}
.msg-edit-input{width:100%;background:var(--surface-2);border:1px solid var(--accent-mid);color:var(--text);font-size:var(--fs-sm);line-height:1.55;padding:8px 12px;border-radius:var(--r);resize:none;min-height:52px;max-height:180px;overflow-y:auto;font-family:inherit;box-shadow:0 0 0 2px rgba(26,158,74,.08)}
.msg-edit-btns{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.msg-edit-save{flex-shrink:0;white-space:nowrap;background:var(--accent);color:var(--on-accent);padding:6px 16px;border-radius:var(--r);font-size:var(--fs-xs);font-weight:700;transition:opacity var(--tf)}
.msg-edit-save:hover{opacity:.85}
.msg-edit-cancel{flex-shrink:0;white-space:nowrap;color:var(--muted);padding:6px 12px;border-radius:var(--r);font-size:var(--fs-xs);transition:color var(--tf),background var(--tf)}
.msg-edit-cancel:hover{color:var(--text);background:var(--surface-3)}
/* Typing */
#typing-bar{position:absolute;left:0;right:0;bottom:100%;padding:0 20px 6px;font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:6px;pointer-events:none}
#typing-bar:empty{display:none}
.typing-dots{display:flex;align-items:center;gap:2px}
.typing-dots span{display:block;width:4px;height:4px;border-radius:50%;background:var(--muted);animation:tdot 1.4s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* ── SCROLL-TO-BOTTOM BUTTON ── */
#scroll-btn{
  position:absolute;bottom:90px;right:20px;z-index:var(--z-float);
  width:var(--ctl-lg);height:var(--ctl-lg);border-radius:var(--r);
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);cursor:pointer;
  box-shadow:var(--shadow-md);
  transition:opacity var(--tf),transform var(--tf),color var(--tf),background var(--tf);
  opacity:0;pointer-events:none;transform:translateY(8px)
}
#scroll-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#scroll-btn:hover{background:var(--accent-dim);border-color:var(--accent-mid)}
#scroll-btn svg{width:20px;height:20px}
#scroll-btn-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--red);color:var(--on-accent);font-size:var(--fs-2xs);font-weight:700;
  min-width:16px;height:16px;border-radius:var(--r);
  display:none;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid var(--surface)
}
#scroll-btn-badge.show{display:flex}

/* ── MENTION AUTOCOMPLETE ── */
#mention-popup{
  position:absolute;bottom:calc(100% + 6px);left:14px;right:14px;z-index:var(--z-mention);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-lg);overflow:hidden;
  display:none;max-height:200px;overflow-y:auto
}
#mention-popup.open{display:block;animation:scaleIn .15s var(--ease)}
@keyframes scaleIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.mention-item{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer;transition:background var(--tf)}
.mention-item:hover,.mention-item.active{background:var(--surface-3)}
.mention-av{width:var(--av-xs);height:var(--av-xs);border-radius:var(--r);background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;position:relative}
.mention-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mention-name{font-size:var(--fs-xs);font-weight:500;color:var(--text)}
.mention-email{font-size:var(--fs-2xs);color:var(--muted)}
.mention-online{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;flex-shrink:0}

/* ── INPUT ── */
.input-wrap{
  padding:0 0 var(--safe-b);flex-shrink:0;position:relative;
  background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
}
.upload-preview{display:none;align-items:center;gap:12px;padding:14px 20px 4px}
.upload-preview.visible{display:flex}
.upload-thumb{width:var(--av-md);height:var(--av-md);border-radius:var(--r-sm);object-fit:cover;background:var(--surface-3);flex-shrink:0;border:1px solid var(--border)}
.upload-info{flex:1;min-width:0}
.upload-name{font-size:var(--fs-xs);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-progress{height:3px;background:var(--surface-3);border-radius:var(--r-sm);margin-top:4px;overflow:hidden}
.upload-progress-fill{height:100%;background:var(--accent);border-radius:var(--r-sm);width:0%;transition:width .15s}
.upload-cancel{color:var(--muted);padding:4px;border-radius:var(--r-sm);transition:color var(--tf),background var(--tf);flex-shrink:0}
.upload-cancel:hover{color:var(--red);background:var(--red-dim)}

.input-reply-bar{display:none;align-items:center;gap:8px;padding:12px 12px 0 16px}
.input-reply-bar.visible{display:flex}
.input-reply-body{flex:1;min-width:0;border-left:3px solid var(--accent);padding:1px 0 1px 10px}
.input-reply-to{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input-reply-to strong{color:var(--accent);font-weight:700}
.input-reply-preview{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input-reply-close{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:color var(--tf),background var(--tf)}
.input-reply-close:hover{color:var(--text);background:var(--surface-3)}

.input-box{display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
/* Поле ввода — светлая «таблетка», растёт вместе с текстом */
.input-field{
  flex:1;min-width:0;display:flex;align-items:flex-end;
  background:var(--surface-2);border:1.5px solid transparent;border-radius:22px;
  padding:6px 16px;
  transition:border-color var(--tf),background var(--tf);
}
.input-field:focus-within{background:var(--surface);border-color:var(--accent-mid)}
#msg-input,#thread-input{flex:1;min-width:0;background:none;color:var(--text);font-size:var(--fs-md);line-height:1.45;resize:none;min-height:22px;max-height:140px;overflow-y:auto;padding:3px 0;tab-size:4}
#msg-input::placeholder,#thread-input::placeholder{color:var(--muted-2)}

.input-icon-btn{width:var(--ctl-lg);height:var(--ctl-lg);display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);transition:color var(--tf),background var(--tf);flex-shrink:0;cursor:pointer}
.input-icon-btn:hover{color:var(--accent);background:var(--accent-dim)}
/* Кнопка отправки — круглая; пока пусто, спокойная серая */
.input-send{width:var(--ctl-lg);height:var(--ctl-lg);background:var(--accent);color:var(--on-accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:var(--shadow-accent);transition:background var(--tf),color var(--tf),transform .18s,box-shadow var(--tf)}
.input-send:hover:not(:disabled){transform:scale(1.06)}
.input-send:disabled{background:var(--surface-2);color:var(--muted-2);box-shadow:none;cursor:default}
.input-send svg{width:20px;height:20px}
/* Счётчик символов — минимально */
.char-count{font-size:var(--fs-2xs);color:var(--muted-2);transition:color var(--tf);text-align:right;padding:0 20px 8px}
.char-count:empty{display:none}
.char-count.warn{color:#aaaacc}
.char-count.over{color:var(--red)}


/* ── THREAD ── */
#thread-panel{grid-area:thread;background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
#thread-panel.open{display:flex;animation:slideFromRight .22s var(--ease)}
@keyframes slideFromRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.thread-head{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.thread-title{font-size:var(--fs-sm);font-weight:600;flex:1;color:var(--text)}
.thread-close{color:var(--muted);padding:4px;border-radius:var(--r-sm);transition:color var(--tf),background var(--tf)}
.thread-close:hover{color:var(--text);background:var(--surface-3)}
.thread-root{padding:16px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(26,158,74,.05),transparent);flex-shrink:0}
.thread-root-author{font-size:var(--fs-xs);font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.thread-root-time{font-weight:300;color:var(--muted-2);font-size:var(--fs-2xs)}
.thread-root-text{font-size:var(--fs-xs);color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
#thread-msgs{flex:1;overflow-y:auto;padding:6px 0}
.thread-reply-row{display:flex;align-items:flex-start;gap:12px;padding:4px 16px;transition:background var(--tf)}
.thread-reply-row:hover{background:rgba(0,0,0,.025)}
.thread-reply-av{width:var(--av-sm);height:var(--av-sm);border-radius:7px;background:var(--accent-dim);border:1px solid var(--accent-mid);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;position:relative}
.thread-reply-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thread-reply-body{flex:1;min-width:0}
.thread-reply-meta{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.thread-reply-author{font-size:var(--fs-xs);font-weight:600;color:var(--text)}
.thread-reply-time{font-size:var(--fs-2xs);color:var(--muted-2)}
.thread-reply-text{font-size:var(--fs-xs);color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
/* Поле ввода в треде — те же .input-wrap / .input-box / .input-field / .input-send, что и в основном чате */
#thread-panel .input-wrap{border-top:1px solid var(--border);border-radius:0}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;z-index:var(--z-lightbox);background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
#lightbox.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.8)}
#lightbox-close{position:absolute;top:16px;right:16px;color:var(--on-accent);font-size:var(--fs-xl);padding:8px 12px;border-radius:var(--r);background:var(--scrim);transition:background var(--tf);border:1px solid rgba(255,255,255,.15)}
#lightbox-close:hover{background:var(--scrim-strong)}
#lightbox-dl{position:absolute;bottom:20px;right:20px;color:var(--on-accent);font-size:var(--fs-xs);padding:8px 16px;border-radius:var(--r);background:var(--scrim);transition:background var(--tf);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:6px}
#lightbox-dl:hover{background:var(--scrim-strong)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;z-index:var(--z-modal);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);width:min(480px,calc(100vw - 24px));animation:scaleIn .2s var(--ease) both;position:relative;border-radius:var(--r);overflow:hidden}

.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 60%)}

/* ── КНОПКИ (единый стандарт, как в home.html: зелёная + серая) ── */
.btn{min-height:var(--ctl-lg);padding:0 20px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:var(--r);transition:opacity var(--tf),background var(--tf),border-color var(--tf),color var(--tf);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700;box-shadow:var(--shadow-accent)}
.btn-primary:hover:not(:disabled){opacity:.88}.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:none;border:1.5px solid var(--border-h);color:var(--muted)}.btn-ghost:hover{border-color:rgba(0,0,0,.25);color:var(--text)}

/* ── PROFILE SHEET ── */
.prof-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px 8px}
/* фон: на всю ширину, строго 981×363, поднят под ручку sheet; аватарка делит его нижний край пополам */
.prof-cover{position:relative;align-self:stretch;margin:0 -24px;aspect-ratio:981/363;overflow:hidden;background:linear-gradient(135deg,var(--accent-dim),var(--surface-2))}
.prof-cover-img,.prof-cover-img img{position:absolute;inset:0;width:100%;height:100%;display:block}
.prof-cover-img img{object-fit:cover}
.prof-cover-btn,.prof-cover-close{position:absolute;z-index:2;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.45);transition:transform .12s,background var(--tf)}
/* ручка sheet профиля — поверх фона (вне потока), фон идёт от самого верха */
#bs-profile .bs-drag,#bs-group-profile .bs-drag{position:absolute;top:0;left:56px;right:56px;z-index:5}
#bs-profile .bs-drag::before,#bs-group-profile .bs-drag::before{background:rgba(255,255,255,.85);box-shadow:0 0 4px rgba(0,0,0,.35)}
.prof-cover-btn:active,.prof-cover-close:active{transform:scale(.92);background:rgba(0,0,0,.6)}
.prof-cover-close,.prof-cover-btn{top:max(12px,env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:50%}
.prof-cover-close{right:12px}
.prof-cover-btn{left:12px}
.prof-head .prof-av-wrap{margin-top:calc(var(--av-xl) / -2);z-index:1}
.prof-head>*:not(.prof-cover){position:relative;z-index:1}
.prof-av-wrap{position:relative;width:var(--av-xl);height:var(--av-xl);border-radius:50%;flex-shrink:0}
.prof-av-inner{
  width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;
  background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-2xl);font-weight:800;
  box-shadow:0 0 0 4px var(--surface);
}
.prof-av-inner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.prof-av-status{
  position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;
  border:3px solid var(--surface);transition:background .3s;
}
.prof-av-status{display:none!important}
.prof-av-status.online {background:var(--green)}
.prof-av-status.away   {background:var(--amber)}
.prof-av-status.offline{background:var(--muted-2)}
.prof-name{font-family:var(--font-display);font-weight:800;font-size:var(--fs-lg);color:var(--text);line-height:1.25;margin-top:12px}
.prof-sub{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.prof-sub:empty{display:none}
.prof-bio{font-size:var(--fs-sm);color:var(--text);line-height:1.55;margin-top:12px;max-width:34ch}
.prof-bio:empty{display:none}

.prof-pad{padding:8px 24px 16px;display:flex;flex-direction:column;gap:16px}

/* Статус: один клик, сохраняется сразу */
.prof-status-btns{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:var(--r-lg)}
.prof-status-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;border-radius:var(--r);font-size:var(--fs-2xs);color:var(--muted);
  background:none;border:none;cursor:pointer;transition:background var(--tf),color var(--tf);
}
.prof-status-btn:hover{color:var(--text)}
.prof-status-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm)}
.prof-sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--muted-2)}
.prof-status-btn.active.online  .prof-sdot{background:var(--green)}
.prof-status-btn.active.away    .prof-sdot{background:var(--amber)}
.prof-status-btn.active.offline .prof-sdot{background:var(--muted)}

.prof-av-wrap.own{cursor:pointer}
.prof-av-wrap.own:active{opacity:.8}
.prof-av-wrap.own .prof-av-status{bottom:auto;top:1px}
.prof-av-edit{position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.prof-count{float:right;color:var(--muted-2)}
.prof-foot{position:sticky;bottom:0;background:var(--surface);z-index:1}
/* Форма */
.prof-field label{font-size:var(--fs-2xs);color:var(--muted);display:block;margin-bottom:4px}
.prof-field input,.prof-field textarea{
  width:100%;background:var(--surface-2);border:1px solid transparent;color:var(--text);
  font-size:var(--fs-md);padding:12px 12px;border-radius:var(--r);font-family:var(--font);
  transition:border-color var(--tf),background var(--tf);
}
.prof-field input:focus,.prof-field textarea:focus{border-color:var(--accent-mid);background:var(--surface);outline:none}
.prof-field input::placeholder,.prof-field textarea::placeholder{color:var(--muted-2)}
.prof-field textarea{resize:none;line-height:1.5}
.prof-field+.prof-field{margin-top:12px}

/* Чужой профиль */
.prof-actions{padding:6px 24px 24px}
.prof-action-btn{
  width:100%;padding:12px 16px;border-radius:var(--r-lg);border:none;cursor:pointer;
  font-size:var(--fs-sm);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  box-shadow:var(--shadow-accent);transition:opacity var(--tf);
}
.prof-action-btn:hover{opacity:.9}

/* Footer */
#btn-save-profile{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.06em}
.prof-foot{display:flex;gap:8px;align-items:center;padding:12px 24px;border-top:1px solid var(--border)}

/* ── ACCOUNT SHEET (меню профиля, 1-й уровень — как профиль в home.html) ── */
#view-profile>*{flex-shrink:0}
.acc-group>*{flex-shrink:0}
.avp-top{padding:4px 16px 14px}
.avp-gallery{width:100%;height:var(--ctl-xl);border-radius:var(--r-lg);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-accent);transition:opacity .15s,transform .12s}
.avp-gallery:active{transform:scale(.98)}.avp-gallery:disabled{opacity:.6}
.avp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px;padding:2px 1px 0;border-top:1px solid var(--surface-3)}
.avp-item{position:relative;display:block;width:100%;aspect-ratio:1/1;padding:0;margin:0;border:none;border-radius:0;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px var(--surface-3)}
.avp-item:active{opacity:.75}
.avp-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bgp-grid{grid-template-columns:1fr}
.bgp-grid .avp-item{aspect-ratio:981/363}
.avp-item.sel::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);pointer-events:none}
.avp-check{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center}
.avp-item.sel .avp-check{display:flex}
.acc-title{font-family:var(--font-display);font-weight:900;font-size:1.1875rem;color:var(--text);padding:0 4px 12px}
.acc-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);cursor:pointer;transition:background var(--tf),transform .12s}
.acc-card:active{transform:scale(.985)}
.acc-av-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
.acc-av{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:1.1875rem;position:relative}
.acc-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.acc-av-st{position:absolute;bottom:0;right:0;width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);background:var(--muted-2)}
.acc-av-st.online{background:var(--green)}.acc-av-st.away{background:var(--amber)}
.acc-card-body{flex:1;min-width:0}
.acc-name{font-family:var(--font-display);font-weight:900;font-size:1rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.acc-sub{font-size:.78125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-lbl{font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);padding:16px 4px 6px;font-weight:600}
.acc-group{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;border:1.5px solid var(--border);background:var(--surface)}
.acc-row{display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;background:var(--surface);text-align:left;cursor:pointer;transition:background var(--tf);text-decoration:none;color:inherit;-webkit-appearance:none;appearance:none}
.acc-row:not([style*="none"])~.acc-row:not([style*="none"]){border-top:1.5px solid var(--border)}
.acc-row:active{background:var(--surface-2)}
.acc-row-ico{width:41px;height:41px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.acc-row-ico svg{width:18px;height:18px}
.acc-row-body{flex:1;min-width:0}
.acc-row-title{font-size:.90625rem;font-weight:600;color:var(--text);margin-bottom:1px}
.acc-row-sub{font-size:.75rem;color:var(--muted)}
.acc-row-arrow{color:var(--muted);flex-shrink:0;opacity:.4}
.acc-badge{min-width:20px;height:20px;padding:0 6px;background:var(--red);color:#fff;border-radius:99px;display:none;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:800;flex-shrink:0}
.acc-logout{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 16px;background:var(--red-dim);border:1.5px solid rgba(220,38,38,.18);border-radius:var(--r-lg);cursor:pointer;transition:background var(--tf)}
.acc-logout:active{background:rgba(220,38,38,.18)}
.acc-logout-ico{width:36px;height:36px;border-radius:11px;flex-shrink:0;background:rgba(220,38,38,.12);display:flex;align-items:center;justify-content:center}
.del-warn{padding:12px 14px;border-radius:var(--r-lg);background:var(--red-dim);border:1px solid rgba(220,38,38,.18);font-size:.84rem;line-height:1.6;color:var(--text)}
.del-warn b{color:var(--red)}
.del-list{margin:14px 0 16px;padding-left:18px;font-size:.84rem;line-height:1.65;color:var(--muted);list-style:disc}
.del-list li{margin-bottom:6px}
.del-link{display:inline-block;margin-top:14px;font-size:.8rem;font-weight:600;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.del-btn{width:100%;margin-top:12px;padding:14px;border-radius:var(--r-lg);border:none;background:var(--red);color:#fff;font-family:var(--font-display);font-weight:800;font-size:var(--fs-xs);letter-spacing:.04em;cursor:pointer;transition:opacity var(--tf),transform .12s}
.del-btn:disabled{opacity:.4;cursor:not-allowed}
.del-btn:not(:disabled):active{transform:scale(.98)}
.acc-logout-t{font-size:.90625rem;font-weight:600;color:var(--red)}
.acc-logout-s{font-size:.75rem;color:rgba(220,38,38,.55);margin-top:1px}
/* Промокод */
.promo-inp{width:100%;background:var(--surface-2);border:1.5px solid var(--border-h);border-radius:var(--r-lg);padding:15px 18px;font-size:var(--fs-lg);font-weight:600;color:var(--text);letter-spacing:.06em;text-transform:uppercase;transition:border-color .15s,box-shadow .15s}
.promo-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.promo-btn{width:100%;margin-top:14px;padding:15px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-accent);transition:opacity .15s,transform .12s}
.promo-btn:active{opacity:.85;transform:scale(.98)}
/* Достижения */
.lb-top{display:flex;align-items:center;gap:12px;padding:14px;background:var(--accent-dim);border:1.5px solid var(--accent-mid);border-radius:var(--r-xl);margin-bottom:6px}
.lb-top-ico{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lb-top-t{font-family:var(--font-display);font-weight:900;font-size:var(--fs-md);color:var(--text)}
.lb-top-s{font-size:var(--fs-xs);color:var(--muted);line-height:1.45;margin-top:2px}
.lb-lbl{font-size:var(--fs-2xs);letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);padding:16px 4px 8px;font-weight:600}
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg)}
.lb-row.me{border-color:var(--accent-mid);background:var(--accent-dim)}
.lb-av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:var(--fs-md);flex-shrink:0;position:relative}
.lb-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lb-name{flex:1;min-width:0;font-size:var(--fs-md);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-you{font-size:var(--fs-2xs);font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--accent-mid);padding:3px 8px;border-radius:6px;flex-shrink:0}
.lb-empty{padding:44px 20px;text-align:center;font-size:var(--fs-sm);color:var(--muted)}
/* Техподдержка (чат) */
.supsh-msgs{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.supsh-msg-wrap{display:flex;flex-direction:column;max-width:80%}
.supsh-msg-wrap-them{align-self:flex-start;align-items:flex-start}
.supsh-msg-wrap-me{align-self:flex-end;align-items:flex-end}
.supsh-msg-name{font-size:var(--fs-2xs);font-weight:700;color:var(--accent-2);margin-bottom:3px;padding:0 2px}
.supsh-msg{padding:9px 13px;border-radius:16px;font-size:var(--fs-md);line-height:1.44;word-break:break-word;white-space:pre-wrap}
.supsh-msg-them{background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px}
.supsh-msg-me{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-bottom-right-radius:4px}
.supsh-msg-time{font-size:var(--fs-2xs);opacity:.62;margin-top:4px;display:block}
.supsh-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:40px 20px;text-align:center}
.supsh-empty svg{opacity:.3;margin-bottom:4px}
.supsh-empty-t{font-weight:700;font-size:var(--fs-md);color:var(--text)}
.supsh-empty-s{font-size:var(--fs-xs);max-width:220px;line-height:1.55}
.supsh-input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 14px calc(var(--safe-b) + 10px);border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.supsh-input{flex:1;resize:none;max-height:100px;border:1.5px solid var(--border-h);border-radius:20px;padding:9px 15px;font-size:var(--fs-md);background:var(--surface-2);color:var(--text);transition:border-color .15s}
.supsh-input:focus{border-color:var(--accent)}
.supsh-send{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);flex-shrink:0;transition:transform .12s,opacity .12s}
.supsh-send:active{transform:scale(.9)}.supsh-send:disabled{opacity:.5}

/* Notifications */
#notif-bar{position:fixed;top:12px;right:12px;z-index:var(--z-notif);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notif-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:flex-start;width:290px;pointer-events:auto;animation:notifIn .3s var(--ease) both;cursor:pointer;transition:border-color var(--tf),transform var(--tf)}
.notif-card:hover{border-color:var(--border-h);transform:translateX(-2px)}
@keyframes notifIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.notif-card.fade{opacity:0;transform:translateX(16px);transition:opacity .3s,transform .3s}
.notif-avatar{width:var(--av-sm);height:var(--av-sm);border-radius:var(--r);background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden}
.notif-avatar img{width:100%;height:100%;object-fit:cover}
.notif-body{flex:1;min-width:0}
.notif-ch{font-size:var(--fs-2xs);color:var(--muted-2);margin-bottom:1px}
.notif-name{font-size:var(--fs-xs);font-weight:600;color:var(--text);margin-bottom:2px}
.notif-msg{font-size:var(--fs-2xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Подсветка сообщения при переходе из закрепа */
.msg-group.flash .msg-bubble{outline:2px solid var(--accent-mid);outline-offset:2px;transition:outline-color .3s}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);z-index:var(--z-toast);background:var(--surface);border:1px solid var(--border);padding:8px 16px;font-size:var(--fs-xs);display:flex;align-items:center;gap:8px;border-radius:var(--r-lg);opacity:0;transition:transform .25s var(--ease),opacity .2s ease;pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:rgba(26,158,74,.4)}.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#toast.err{border-color:rgba(220,38,38,.4)}
#toast.ok .toast-dot{background:var(--green)}#toast.err .toast-dot{background:var(--red)}

/* No channel */
#no-channel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* Connection */
#conn-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:var(--z-conn);background:var(--red-dim);border-bottom:1px solid rgba(220,38,38,.2);padding:8px 20px;font-size:var(--fs-2xs);color:var(--red);align-items:center;justify-content:center;gap:8px}
#conn-banner.show{display:flex}

/* ── ПОИСК (как .store-search в home.html) ── */
.store-search{padding:12px 16px 6px;flex-shrink:0}
.store-search-in{display:flex;align-items:center;gap:12px;height:var(--ctl-xl);padding:0 6px 0 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);transition:border-color .15s,background .15s}
.store-search-in:focus-within{border-color:var(--accent-mid);background:var(--surface)}
.store-search-in>svg{flex-shrink:0;color:var(--muted-2)}
.store-search-in input{flex:1;min-width:0;height:100%;border:none;outline:none;background:none;padding:0;font-family:var(--font);font-size:var(--fs-lg);color:var(--text);-webkit-appearance:none;appearance:none;caret-color:var(--accent)}
.store-search-in input::placeholder{color:var(--muted-2)}
.store-search-x{display:none;width:var(--ctl-md);height:var(--ctl-md);border:none;border-radius:var(--r-lg);background:var(--surface);color:var(--muted);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.store-search-x:active{transform:scale(.92)}
.store-search.has-q .store-search-x{display:flex}

/* Skeleton */
.sk-line{height:9px;background:var(--surface-3);border-radius:var(--r-sm);margin:4px 0;animation:skPulse 1.8s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:.35}50%{opacity:.7}}

/* Mobile nav */
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:var(--z-nav);height:var(--mob-nav-h);background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:var(--safe-b);align-items:stretch}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;padding:12px 4px;color:var(--muted-2);border:none;background:none;position:relative;transition:color var(--tf),opacity .08s}
.mob-nav-btn svg{transition:transform .2s var(--spring)}
.mob-nav-btn.active{color:var(--accent)}
.mob-nav-btn.active svg{transform:scale(1.15)}
.mob-nav-btn::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2.5px;background:var(--accent);border-radius:0 0 3px 3px;transform:scaleX(0);transition:transform .25s var(--spring)}
.mob-nav-btn.active::before{transform:scaleX(1)}
.mob-nav-btn:active{opacity:.55}
.mob-nav-btn:active svg,.mob-nav-btn:active .mn-av{transform:scale(.82)!important;transition-duration:.06s}
/* бейдж/точка как .mn-badge в home */
.mob-dot{position:absolute;top:10px;right:calc(50% - 18px);width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);display:none}
.mob-dot.show{display:block}
/* аватар в навигации как .mn-av в home */
.mn-av{width:var(--av-sm);height:var(--av-sm);border-radius:50%!important;background:var(--accent-dim);border:none!important;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-display);font-weight:900;font-size:var(--fs-xs)!important;color:var(--accent);transition:transform .2s var(--spring);flex-shrink:0;position:relative}
.mn-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mob-nav-btn.active .mn-av{transform:scale(1.08)}
.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:var(--z-scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.mob-overlay.open{opacity:1;pointer-events:auto}

@media(max-width:780px){
  :root{--thread-w:100vw;--mob-nav-h:calc(66px + var(--safe-b))}  #shell{grid-template-columns:1fr;grid-template-areas:"main"}
  #shell.thread-open{grid-template-columns:1fr;grid-template-areas:"main"}

  #thread-panel{position:fixed;inset:0;bottom:var(--mob-nav-h);z-index:var(--z-panel)}
  #mob-nav{display:flex}
  /* Внутри чата нижняя навигация скрыта, поле ввода стоит в потоке у нижнего края */
  body.in-chat{--mob-nav-h:0px}
  body.in-chat #mob-nav{display:none}
  body.in-chat #scroll-btn{bottom:90px}
  body.in-chat #toast{bottom:84px}
  body.in-chat #notif-bar{top:calc(var(--topbar-h) + 8px);bottom:auto}
  #main{padding-bottom:var(--mob-nav-h)}

  #toast{bottom:calc(var(--mob-nav-h) + 8px)}
  #notif-bar{top:auto;bottom:calc(var(--mob-nav-h) + 60px);right:8px}
  .notif-card{width:calc(100vw - 44px)}
  #scroll-btn{bottom:calc(var(--mob-nav-h) + 80px + 56px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .msg-group.new-msg{animation:none}
}

/* ── TOPBAR BACK BUTTON ── */
.topbar-back-btn{width:var(--tb-btn);height:var(--tb-btn);display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);transition:background var(--tf),color var(--tf);flex-shrink:0}
.topbar-back-btn:hover{background:var(--surface-2);color:var(--text)}

/* ── ГРУППЫ ── */
.grp-top{padding:12px 16px 0;flex-shrink:0}
.grp-create{width:100%;height:var(--ctl-xl);border-radius:var(--r-lg);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-accent);transition:opacity .15s,transform .12s}
.grp-create:active{transform:scale(.98)}
.grp-create svg{width:18px;height:18px}
/* квадратная аватарка группы (в списке и в шапке чата) */
.ch-ava.ch-ava--sq{border-radius:var(--r-lg);background:var(--accent-dim);border-color:var(--accent-mid);font-family:var(--font-display);font-weight:800;font-size:var(--fs-xl)}
.topbar-ava.sq{border-radius:var(--r)}
.grp-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 40px;text-align:center}
.grp-empty-ico{width:62px;height:62px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;color:var(--muted)}
.grp-empty-t{font-family:var(--font-display);font-weight:800;font-size:var(--fs-xl);color:var(--text)}
.grp-empty-s{font-size:var(--fs-xs);color:var(--muted);max-width:220px;line-height:1.65}
/* ник собеседника — внутри пузырька (в группах) */
.msg-author-in{font-size:var(--fs-xs);font-weight:700;line-height:1.3;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* шторка «Новая группа» */
.grp-sheet{flex:1;display:flex;flex-direction:column;min-height:min(640px,82svh)}
.grp-sheet .prof-foot{margin-top:auto;padding-bottom:calc(12px + var(--safe-b))}
.grp-sheet .acc-lbl{padding:0 4px 8px}
.grp-ava-row{display:flex;justify-content:center;padding-top:4px}
.grp-ava-pick{position:relative;width:96px;height:96px;flex-shrink:0;border-radius:var(--r-xl);cursor:pointer;transition:opacity var(--tf)}
.grp-ava-pick:active{opacity:.8}
.grp-ava-in{width:100%;height:100%;border-radius:var(--r-xl);overflow:hidden;position:relative;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center}
.grp-ava-in img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.grp-ava-ltr{font-family:var(--font-display);font-weight:800;font-size:2rem}
.grp-hint{font-size:var(--fs-xs);color:var(--muted);line-height:1.5;padding:8px 4px 0}
.prof-status-btn:disabled{opacity:.45;cursor:default}
.prof-status-btn:disabled:hover{color:var(--muted)}
#grp-submit,#grp-pick-done{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.06em}
.grp-pick-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.sh-mark{background:var(--accent-dim);color:var(--accent);border-radius:4px;padding:0 1px}
.grp-check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-h);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);transition:background var(--tf),border-color var(--tf)}
.grp-check svg{display:none}
.ch-card.sel .grp-check{background:var(--accent);border-color:var(--accent)}
.ch-card.sel .grp-check svg{display:block}
/* публичная группа: если не участник — вместо поля ввода кнопка «Вступить» */
.grp-join{flex-shrink:0;padding:12px 16px calc(12px + var(--safe-b));background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0}
.grp-join .btn{width:100%;min-height:var(--ctl-xl);border-radius:var(--r-lg);font-size:var(--fs-xs)}

/* ── ПРОФИЛЬ ГРУППЫ (как профиль аккаунта, но аватарка квадратная) ── */
.gp-av,.gp-av .prof-av-inner{border-radius:var(--r-xl)}
.gp-av .prof-av-inner{font-family:var(--font-display);font-weight:800}
#gp-save{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.06em}
.gp-members{padding:4px 0 8px}
.gp-members-lbl{font-size:var(--fs-2xs);letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);padding:12px 24px 4px;font-weight:600}
.gp-role{font-size:var(--fs-2xs);font-weight:700;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:2px 8px;border-radius:6px;flex-shrink:0}
/* ── ГРУППЫ: действия, переключатель, непрочитанное ── */
.gp-acts{padding:8px 24px 4px}
.gp-leave{padding:12px 24px 16px}
.gp-sw{width:44px;height:26px;border-radius:13px;background:var(--surface-4);position:relative;flex-shrink:0;transition:background var(--tf)}
.gp-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease)}
.gp-sw.on{background:var(--accent)}
.gp-sw.on::after{transform:translateX(18px)}
.gp-kick{width:var(--ctl-md);height:var(--ctl-md);border-radius:var(--r);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted-2);transition:background var(--tf),color var(--tf)}
.gp-kick:hover,.gp-kick:active{color:var(--red);background:var(--red-dim)}
.grp-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
.grp-dot.muted{background:var(--muted-3)}
#groups-list .ch-card.has-unread .ch-title{color:var(--text);font-weight:600}
/* ── ГОЛОСОВЫЕ КОМНАТЫ ── */
#rooms-list .ch-card.has-unread .ch-title{color:var(--text);font-weight:600}
.room-badge{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;border:2.5px solid var(--surface);display:flex;align-items:center;justify-content:center}
.room-badge svg{width:10px;height:10px}
.room-live-t{color:var(--green);font-weight:700}
#room-stage{--rs-d:clamp(54px,17vw,68px);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px 12px}
.rs-head{display:flex;align-items:center;gap:6px;padding:0 4px 10px}
.rs-count{flex:1;min-width:0;font-size:var(--fs-2xs);letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-gear{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:background var(--tf),color var(--tf)}
.rs-gear:active{background:var(--surface-2);color:var(--text)}
.rs-join{height:34px;padding:0 16px;border-radius:17px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:var(--fs-xs);flex-shrink:0;transition:opacity .15s,transform .12s}
.rs-join:active{transform:scale(.96)}
.rs-join.leave{background:var(--red-dim);color:var(--red)}
.rs-join:disabled{opacity:.5}
.rs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;justify-items:center}
.rs-cell{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-width:0;padding:0;background:none;border:none;cursor:pointer}
.rs-ava{position:relative;width:var(--rs-d);height:var(--rs-d);border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent-mid);transition:width .18s var(--ease),height .18s var(--ease)}
.rs-ava-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:calc(var(--rs-d) * .34)}
.rs-ava-in img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rs-cell.me .rs-ava{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.rs-cell.empty .rs-ava{box-shadow:none}
.rs-cell.empty .rs-ava-in{background:transparent;border:2px dashed var(--border-h);color:var(--muted-2)}
.rs-cell:active .rs-ava{transform:scale(.94)}
.rs-name{font-size:var(--fs-2xs);font-weight:600;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-cell.empty .rs-name{color:var(--muted-2);font-weight:500}
.rs-mute{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:2.5px solid var(--surface);display:flex;align-items:center;justify-content:center;z-index:1}
.rs-mute svg{width:10px;height:10px}
/* пока открыта клавиатура — ячейки сжимаются в одну строку, чтобы чату хватало места */
#room-stage.compact{--rs-d:clamp(38px,12vw,46px);padding-bottom:8px}
#room-stage.compact .rs-grid{grid-template-columns:repeat(6,1fr);gap:0 4px}
#room-stage.compact .rs-name{display:none}
#room-stage.compact .rs-head{padding-bottom:8px}
.room-ctl{display:none;gap:4px;flex-shrink:0;align-items:center}
.room-ctl-btn{width:var(--ctl-lg);height:var(--ctl-lg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);background:var(--surface-2);transition:color var(--tf),background var(--tf),transform .1s}
.room-ctl-btn:active{transform:scale(.92)}
.room-ctl-btn.on{color:var(--accent);background:var(--accent-dim)}
.room-ctl-btn.off{color:var(--red);background:var(--red-dim)}
.room-ctl-btn .i-off{display:none}
.room-ctl-btn.off .i-on{display:none}
.room-ctl-btn.off .i-off{display:block}
.ra-soon{font-size:var(--fs-2xs);font-weight:700;color:var(--muted-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:6px;flex-shrink:0}
#room-mini{position:fixed;z-index:600;width:56px;height:56px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#room-mini .rm-ava{width:100%;height:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:1.3rem;border:2.5px solid var(--green);box-shadow:var(--shadow-lg,0 6px 20px rgba(0,0,0,.22));animation:rmPulse 2.2s ease-in-out infinite;transition:transform .12s}
#room-mini .rm-ava img{width:100%;height:100%;object-fit:cover}
#room-mini.drag .rm-ava{transform:scale(1.08);animation:none}
#room-mini .rm-mic{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;border:2.5px solid var(--surface);display:flex;align-items:center;justify-content:center}
#room-mini .rm-mic.off{background:var(--red)}
#room-mini .rm-mic.idle{background:var(--muted-2)}
#room-mini.listen .rm-ava{border-color:var(--accent-mid);animation:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
#room-mini .rm-dot{position:absolute;left:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid var(--surface)}
#room-mini .rm-mic svg{width:11px;height:11px}
@keyframes rmPulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.22),0 0 0 0 rgba(34,197,94,.45)}50%{box-shadow:0 6px 20px rgba(0,0,0,.22),0 0 0 7px rgba(34,197,94,0)}}
#rc-submit{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.06em}
/* ── Входящий видеозвонок: баннер в чате ── */
.call-banner{display:none;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;background:linear-gradient(135deg,rgba(26,158,74,.14),rgba(26,158,74,.05));border-bottom:1px solid rgba(26,158,74,.2)}
.cb-ico{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;animation:cbPulse 1.6s ease-out infinite}
.cb-ico svg{width:20px;height:20px}
@keyframes cbPulse{0%{box-shadow:0 0 0 0 var(--acc-shadow)}100%{box-shadow:0 0 0 12px rgba(26,158,74,0)}}
.cb-text{flex:1;min-width:0}
.cb-t{font-size:var(--fs-sm);font-weight:700}
.cb-s{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-btn{height:var(--ctl-md);border-radius:999px;font-size:var(--fs-sm);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cb-yes{padding:0 16px;background:var(--accent);color:var(--on-accent)}
.cb-yes:active{transform:scale(.96)}
.cb-no{width:var(--ctl-md);background:var(--red-dim);color:var(--red)}
.cb-no svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.cb-ico{animation:none}}

/* ── Запись о звонке в переписке (исходящий / входящий / пропущенный) ── */
.msg-text.msg-call{white-space:normal}
.mc-row{display:flex;align-items:center;gap:12px;min-width:240px;padding:0}
.mc-ico{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent)}
.mc-ico svg{width:20px;height:20px}
.mc-info{flex:1;min-width:0}
.mc-title{font-size:var(--fs-sm);font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-sub{display:flex;align-items:center;gap:4px;margin-top:1px;font-size:var(--fs-xs);line-height:1.3;opacity:.75;font-variant-numeric:tabular-nums}
.mc-sub>svg{width:12px;height:12px;flex:0 0 auto;color:var(--accent)}

.mc-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.mc-side .msg-ts-inline{float:none;margin:0}
.mc-back{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--accent-dim);color:var(--accent);transition:transform var(--tf)}
.mc-back svg{width:18px;height:18px}
.mc-back:active{transform:scale(.92)}
.msg-call.missed .mc-ico{background:var(--red);color:#fff}
.msg-call.missed .mc-title,.msg-call.missed .mc-sub>svg{color:var(--red)}

/* ── VIDEO CALL (полноэкранное окно, не шторка) ── */
#vc{position:fixed;inset:0;z-index:7000;display:flex;flex-direction:column;overflow:hidden;background:#0a120d;color:#fff;
  height:100vh;height:100dvh;visibility:hidden;opacity:0;transform:scale(1.03);pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease),visibility 0s linear .22s;-webkit-user-select:none;user-select:none}
#vc.open{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.vc-bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(34,197,94,.22),transparent 60%),linear-gradient(180deg,#0f1d14 0%,#08100b 100%)}
.vc-bg-photo{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.15) brightness(.5);opacity:0;transition:opacity .4s}
.vc-bg-photo.on{opacity:1}
.vc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,8,.55) 0%,rgba(6,10,8,.2) 38%,rgba(6,10,8,.8) 100%)}
.vc-remote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vc-remote video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#vc.has-remote .vc-remote video{display:block}
.vc-peer{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 32px;text-align:center;transition:opacity .3s}
#vc.has-remote .vc-peer{opacity:0;pointer-events:none}
.vc-peer-ava{position:relative;width:132px;height:132px;margin-bottom:44px;flex-shrink:0}
.vc-ava{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--accent-dim);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:3rem;color:var(--accent-2);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.vc-ava img{width:100%;height:100%;object-fit:cover}
.vc-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent-2);opacity:0;animation:vcRing 2.4s var(--ease) infinite}
.vc-ring.r2{animation-delay:1.2s}
#vc:not(.calling) .vc-ring{animation:none}
@keyframes vcRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.vc-peer-name{font-family:var(--font-display);font-weight:800;font-size:var(--fs-2xl);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-peer-status{font-size:var(--fs-sm);color:rgba(255,255,255,.7);letter-spacing:.02em}
.vc-note{margin-top:18px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:var(--fs-2xs);color:rgba(255,255,255,.6)}
#vc.has-remote .vc-note{display:none}

/* верхняя панель */
.vc-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.vc-tbtn{width:var(--ctl-lg);height:var(--ctl-lg);border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;transition:background var(--tf)}
.vc-tbtn:hover{background:rgba(255,255,255,.24)}
.vc-tbtn svg{width:20px;height:20px}
.vc-top-mid{flex:1;min-width:0;text-align:center;transition:opacity .2s}
#vc.calling .vc-top-mid{opacity:0}
.vc-top-name{font-size:var(--fs-md);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-top-sub{font-size:var(--fs-xs);color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;min-height:1em}
.vc-top-sub.live{color:var(--accent-2)}
.vc-top-spacer{width:var(--ctl-lg);flex:0 0 auto}

/* моя камера — плавающая плитка сверху, перетаскивается и прилипает к углам */
.vc-pip{position:absolute;left:0;top:0;z-index:3;width:108px;aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;background:#142019;
  border:1.5px solid rgba(255,255,255,.22);box-shadow:0 8px 28px rgba(0,0,0,.5);touch-action:none;cursor:grab;will-change:transform;
  transition:transform .28s var(--spring)}
.vc-pip.drag{transition:none;cursor:grabbing}
.vc-pip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vc-pip video.mirror{transform:scaleX(-1)}
.vc-pip-off{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 8px;text-align:center;background:#142019;color:rgba(255,255,255,.7);font-size:var(--fs-2xs);line-height:1.3}
.vc-pip-off .vc-ava{position:relative;inset:auto;width:44px;height:44px;flex:0 0 auto;font-size:1.1rem;box-shadow:none}
.vc-pip.cam-off .vc-pip-off{display:flex}
.vc-pip.cam-off video{visibility:hidden}
.vc-pip-badge{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:var(--red);display:none;align-items:center;justify-content:center}
.vc-pip-badge svg{width:12px;height:12px}
.vc-pip.mic-off .vc-pip-badge{display:flex}
.vc-remote video.mirror{transform:scaleX(-1)}
/* тап по экрану прячет / показывает кнопки */
.vc-top,.vc-bar{transition:opacity .25s var(--ease),transform .25s var(--ease)}
#vc.ui-hidden .vc-top{opacity:0;transform:translateY(-12px);pointer-events:none}
#vc.ui-hidden .vc-bar{opacity:0;transform:translateY(12px);pointer-events:none}
/* у собеседника выключен микрофон — значок рядом с именем */
.vc-top-row{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.vc-top-mic{width:16px;height:16px;flex:0 0 auto;color:#ff6b6b}
.vc-top-mic[hidden]{display:none}   /* моя камера на большом экране (после тапа по плитке) */

/* нижняя панель: все кнопки — ровные круги одного размера */
.vc-bar{position:relative;z-index:2;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.vc-btn{flex:0 0 auto;width:60px;height:60px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:background var(--tf),color var(--tf),transform var(--tf)}
.vc-btn:hover{background:rgba(255,255,255,.24)}
.vc-btn:active{transform:scale(.92)}
.vc-btn svg{width:26px;height:26px}
.vc-btn.off{background:#fff;color:#111}
.vc-btn.end{background:var(--red);color:#fff;box-shadow:0 6px 20px rgba(220,38,38,.45)}
.vc-btn.end:hover{background:#ef4444}
.vc-btn.end svg{transform:rotate(135deg)}
.vc-btn[hidden]{display:none}
@media (min-width:720px){
  .vc-pip{width:168px}
  .vc-peer-ava{width:168px;height:168px;margin-bottom:56px}
  .vc-bar{gap:20px;padding-bottom:32px}
}

/* свёрнутый звонок: плавающая плитка с камерой собеседника (как плашка голосовой комнаты) */
#vc-mini{position:fixed;z-index:900;display:none;width:92px;height:124px;border-radius:var(--r-lg);overflow:hidden;background:#0f1a13;
  border:1.5px solid rgba(255,255,255,.22);box-shadow:0 8px 28px rgba(0,0,0,.45);touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;animation:vcmIn .25s var(--spring)}
#vc-mini.drag{cursor:grabbing;transform:scale(1.05)}
@keyframes vcmIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
#vc-mini video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#vc-mini.has-remote video{display:block}
.vcm-ava{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:1.8rem;color:var(--accent-2);
  background:radial-gradient(100% 70% at 50% 0%,rgba(34,197,94,.25),transparent 70%),#0f1a13}
.vcm-ava img{width:100%;height:100%;object-fit:cover}
#vc-mini.has-remote .vcm-ava{display:none}
.vcm-badge{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:var(--fs-2xs);font-variant-numeric:tabular-nums;color:#fff}
.vcm-badge.live{color:var(--accent-2)}
.vcm-end{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.vcm-end svg{width:13px;height:13px;transform:rotate(135deg)}
/* на связи без видео собеседника: имя уже в шапке, в центре — аватарка и статус */
#vc:not(.calling) .vc-peer-name{display:none}
#vc:not(.calling) .vc-peer-ava{margin-bottom:18px}
/* аудиозвонок: нет камеры — прячем плитку, кнопки камеры и переворота; имя остаётся по центру */
#vc.audio .vc-pip,#vc.audio #vc-cam,#vc.audio #vc-flip{display:none}
#vc.audio .vc-peer-name{display:block}
#vc.audio .vc-peer-ava{margin-bottom:24px}
@media (prefers-reduced-motion:reduce){#vc,.vc-pip,.vc-ring,#vc-mini{transition:none!important;animation:none!important}}
</style>
</head>
<body>



<div id="conn-banner"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.5v3M6 8v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Нет соединения</div>
<div id="notif-bar"></div>
<div class="mob-overlay" id="mob-overlay"></div>

<!-- Mobile nav -->
<nav id="mob-nav">
  <button class="mob-nav-btn active" id="mob-btn-dms" aria-label="Сообщения">
