/* ── MARKDOWN / CODE RENDERING ── */
function renderText(raw){
  if(!raw) return '';
  const hold=[];                                   // готовые куски (код), которые разметка не трогает
  const keep=h=>{hold.push(h);return '\u0000'+(hold.length-1)+'\u0000';};
  // Блоки кода ```lang … ``` — текст уже экранирован один раз
  let html=esc(raw).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    const c=code.trim();
    return keep(`<div class="code-block">
      <div class="code-block-head"><span class="code-lang">${lang||'code'}</span><button class="code-copy" data-code="${c}" title="Скопировать">Скопировать</button></div>
      <pre>${c}</pre>
    </div>`);
  });
  // Inline-код
  html=html.replace(/`([^`\n]+)`/g,(m,c)=>keep(`<code>${c}</code>`));
  html=html.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');   // жирный
  html=html.replace(/\*(?=\S)(.+?)(?<=\S)\*/g,'<em>$1</em>');               // курсив
  html=html.replace(/~~(.*?)~~/g,'<del>$1</del>');             // зачёркнутый
  // Упоминания @Имя
  html=html.replace(/@([А-Яа-яёA-Za-z][А-Яа-яёA-Za-z\s]*?)(?=\s|$|[^\wА-Яа-яЁё])/g,(m,name)=>{
    const isMe=name.trim().toLowerCase()===(me?.displayName||'').toLowerCase();
    return`<span class="mention${isMe?' is-me':''}" data-mention="${name.trim()}">@${name.trim()}</span>`;
  });
  // Ссылки
  html=html.replace(/(?<!href="|src=")(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return html.replace(/\u0000(\d+)\u0000/g,(m,i)=>hold[i]);
}

function playNotifSound(){
  try{const ctx=_actx||(_actx=new(window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+.12);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.22);}catch(e){}
}

/* ── FCM TOKEN: приходит от Android (MainActivity → evaluateJavascript) ── */
window.onFcmToken=function(token){
  if(!token)return;
  window._myFcmToken=token;             // нужен при выходе: чистим токен только этого устройства
  if(me)saveFcmToken(token);            // уже авторизован — сохраняем сразу
  else window._pendingFcmToken=token;   // сохраним в onAuthStateChanged
};
async function saveFcmToken(token){
  if(!me||!token)return;
  try{
    await setDoc(doc(fdb,'users',me.uid),{fcmToken:token,fcmUpdatedAt:new Date().toISOString()},{merge:true});
    console.log('[FCM] Токен сохранён в Firestore');
  }catch(e){console.warn('[FCM] Не удалось сохранить токен:',e);}
}

async function broadcastTyping(){

  _lastTypingSent=now;
  try{
    await setDoc(doc(fdb,'pulsar_typing',`${currentCh.id}_${me.uid}`),{uid:me.uid,name:me.displayName,chId:currentCh.id,ts:serverTimestamp()},{merge:true});

}
async function clearTyping(){
  if(!me||!currentCh)return;
  _lastTypingSent=0;
  try{await setDoc(doc(fdb,'pulsar_typing',`${currentCh.id}_${me.uid}`),{uid:me.uid,chId:currentCh.id,ts:null},{merge:true});}catch(e){}
}
function startTypingListener(chId){
  if(typingUnsub){typingUnsub();typingUnsub=null;}
  clearTimeout(_typingExpiry);
  const bar=$('typing-bar');bar.innerHTML='';
  const typing={};                                   // docId -> {name, ts}
  const render=()=>{
    const cutoff=Date.now()-5000;
    const names=Object.values(typing).filter(t=>t.ts>cutoff).map(t=>t.name);
    clearTimeout(_typingExpiry);
    if(!names.length){bar.innerHTML='';return;}
    const suffix=names.length>1?'печатают…':'печатает…';
    bar.innerHTML=`<div class="typing-dots"><span></span><span></span><span></span></div><span>${esc(names.slice(0,3).join(', '))} ${suffix}</span>`;
    _typingExpiry=setTimeout(render,1000);          // сам погаснет, если «печатает» зависло
  };
  // Только документы этого чата (раньше слушалась вся коллекция)
  typingUnsub=onSnapshot(query(collection(fdb,'pulsar_typing'),where('chId','==',chId)),snap=>{
    snap.docChanges().forEach(c=>{
      const dt=c.doc.data();
      if(c.type==='removed'||dt.uid===me?.uid||!dt.ts){delete typing[c.doc.id];return;}
      typing[c.doc.id]={name:dt.name||'Кто-то',ts:dt.ts.toDate?dt.ts.toDate().getTime():Date.now()};
    });
    render();
  },()=>{});
}

/* ── LOAD USERS ── */
async function loadAllUsers(){
  try{
    const snap=await getDocs(collection(fdb,'users'));
    snap.forEach(d=>{allUsers[d.id]={uid:d.id,...d.data()};});
    usersLoaded=true;
    onSnapshot(collection(fdb,'pulsar_presence'),snap=>{
      snap.docChanges().forEach(c=>{
        const d=c.doc;
        if(c.type==='removed'){if(allUsers[d.id])delete allUsers[d.id].presence;return;}
        if(allUsers[d.id])allUsers[d.id].presence=d.data();
        else allUsers[d.id]={uid:d.id,...d.data(),presence:d.data()};
      });
      scheduleChatList();
      if(currentCh?.type==='direct')updateChatHeader();
    });
  }catch(e){console.error('loadAllUsers:',e);usersLoaded=true;}
}

  }

  // Badge
  const badgeHtml = (!isActive && uc > 0)
    ? `<span class="ch-badge">${uc>99?'99+':uc}</span>` : '';

  const title = isDM ? esc(o?.displayName||o?.email||'—') : esc(ch.name||'');

  return `<div class="ch-card${isActive?' active':''}${uc>0&&!isActive?' has-unread':''}" data-chid="${esc(ch.id)}"${oid?` data-uid="${esc(oid)}"`:''} role="button" tabindex="0">
    ${avaHtml}
    <div class="ch-body">
      <div class="ch-row1">
        <span class="ch-title">${title}</span>
        ${ts?`<span class="ch-ts">${ts}</span>`:''}
        ${badgeHtml}
      </div>
      ${previewHtml}
    </div>
  </div>`;
}

// Все чаты в одном массиве, сортировка по lastMessage.ts
let _allChs = [], _allDmChs = [], _allGroups = [];
let _sbQuery = '';

let _chatListLoaded = false;

function rebuildChatList(){
  const list = $('chat-list');
  $('chat-list-skeleton')?.remove();

  // Объединяем каналы + DM
  const combined = [
    ..._allChs,
    ..._allDmChs
  ].sort((a,b)=>{
    const ta = a.lastMessage?.ts?.toDate?.()?.getTime() || a.createdAt?.toDate?.()?.getTime() || 0;
    const tb = b.lastMessage?.ts?.toDate?.()?.getTime() || b.createdAt?.toDate?.()?.getTime() || 0;
    return tb - ta;
  });

  // Фильтрация по поиску
  const q = _sbQuery.trim().toLowerCase();
  const filtered = q ? combined.filter(ch=>{
    if(ch.type==='direct'){
      const oid=(ch.members||[]).find(u=>u!==me.uid);
      const o=allUsers[oid]||{};
      return (o.displayName||'').toLowerCase().includes(q)||(o.email||'').toLowerCase().includes(q);
    }
    return (ch.name||'').toLowerCase().includes(q)||(ch.description||'').toLowerCase().includes(q);
  }) : combined;

  // Люди без личного чата — показываем только при поиске
  let people = [];
  if(q){
    const dmUids = new Set(_allDmChs.map(ch=>(ch.members||[]).find(u=>u!==me.uid)));
    people = Object.values(allUsers).filter(u=>
      u.uid!==me.uid && !dmUids.has(u.uid) &&
      ((u.displayName||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))
    );
  }

  if(!filtered.length && !people.length){
    // Не показываем пустое состояние пока данные ещё не пришли
    if(!_chatListLoaded && !q) return;
    list.innerHTML = `<div style="padding:20px 14px;font-size:var(--fs-xs);color:var(--muted-2);text-align:center">${q?'Ничего не найдено':'Нет чатов — создайте первый'}</div>`;
    return;
  }

  _chatListLoaded = true;

  const chatsHtml = filtered.map(ch=>{
    if(ch.type==='direct'){
      const oid=(ch.members||[]).find(u=>u!==me.uid);
      return makeChCard(ch, allUsers[oid]||{displayName:'Пользователь'}, oid);
    }
    return makeChCard(ch, null);
  }).join('');

  const peopleHtml = people.length ? `<div class="sb-section-tag"><span>Люди</span></div>` + people.map(u=>{
    const pr  = u.presence?.status || 'offline';
    const avI = u.photoURL ? `<img src="${esc(u.photoURL)}" alt=""/>` : esc(ini(u.displayName||u.email));
    return `<div class="ch-card" data-person="${esc(u.uid)}" role="button" tabindex="0">
      <div class="ch-ava-wrap"><div class="ch-ava"><span>${avI}</span></div><div class="ch-presence ${pr}"></div></div>
      <div class="ch-body"><div class="ch-row1"><span class="ch-title">${esc(u.displayName||u.email||'—')}</span></div>
      <div class="ch-preview">${esc(u.email||'')}</div></div>
    </div>`;
  }).join('') : '';

  list.innerHTML = chatsHtml + peopleHtml;

  _chatListLoaded = true;

}

// Перерисовка не чаще одного раза за кадр (presence/каналы приходят пачками)
function scheduleChatList(){
  if(_clRaf)return;
  _clRaf=requestAnimationFrame(()=>{_clRaf=0;rebuildChatList();});
}

// Один набор обработчиков на весь список (карточки пересоздаются при каждой перерисовке)
function bindChatListEvents(){
  const list=$('chat-list');
  let lpTimer=null,longPressed=false;
  const stopLp=()=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}};
  list.addEventListener('click',e=>{
    const el=e.target.closest('.ch-card');if(!el)return;
    if(longPressed){longPressed=false;return;}
    if(el.dataset.person){openOrCreateDM(el.dataset.person);return;}
    openChannel(el.dataset.chid);
  });
  list.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const el=e.target.closest('.ch-card');if(el)el.click();
  });
  // Долгое нажатие на личный чат — профиль собеседника
  list.addEventListener('touchstart',e=>{
    const el=e.target.closest('.ch-card');
    if(!el||!el.dataset.uid)return;
    longPressed=false;stopLp();
    lpTimer=setTimeout(()=>{longPressed=true;lpTimer=null;openUserProfile(el.dataset.uid);},500);
  },{passive:true});
  list.addEventListener('touchmove',stopLp,{passive:true});
  list.addEventListener('touchcancel',stopLp);
  list.addEventListener('touchend',e=>{
    stopLp();
    if(longPressed){if(e.cancelable)e.preventDefault();longPressed=false;}
  });
}

/* ── OPEN CHANNEL ── */
async function openChannel(chId){
  if(currentCh?.id===chId){showView('conversation');markLatestIncoming();return;}
  if(msgUnsub){msgUnsub();msgUnsub=null;}
  closeThread();clearTyping();
  replyTo=null;
  delete unreadCounts[chId];
  if(_allGroups.some(g=>g.id===chId))markGroupRead(chId);
  knownMsgIds=new Set();currentMsgs=[];newMsgCount=0;
  updateScrollBtn();

  // ── Сразу открываем чат, без ожидания ──
  _openingChId=chId;
  showView('conversation');
  $('ch-name').textContent='…';
  $('ch-desc').textContent='';$('ch-desc').className='topbar-desc';
  $('ch-ava').innerHTML='';
  $('msg-list').innerHTML='<div style="padding:28px;text-align:center;color:var(--muted);font-size:var(--fs-xs)">Загрузка…</div>';
  clearReply();cancelUpload();
  $('grp-join').style.display='none';$('input-wrap').style.display='';   // состояние предыдущей группы не тянем
  closeSidebar();
  if(matchMedia('(pointer:fine)').matches)setTimeout(()=>$('msg-input').focus(),150);   // на телефоне клавиатуру не выдвигаем сама

  // ── Грузим данные канала в фоне ──
  // Данные канала уже есть в списке чатов — запрос в базу нужен только как запасной путь
  let chData=_allChs.find(c=>c.id===chId)||_allDmChs.find(c=>c.id===chId)||_allGroups.find(c=>c.id===chId);
  if(!chData){
    try{const s=await getDoc(doc(fdb,'pulsar_channels',chId));if(!s.exists()){toast('Канал не найден','err');openSidebar();return;}chData={id:s.id,...s.data()};}
    catch(e){toast('Ошибка: '+e.message,'err');openSidebar();return;}
  }
  // Если пользователь уже открыл другой чат пока грузилось — выходим
  if(_openingChId!==chId) return;
  currentCh=chData;
  updateChatHeader();
  document.querySelectorAll('.ch-card').forEach(el=>el.classList.toggle('active',el.dataset.chid===chId));
  loadPinnedMsgs(chId);
  startMessageListener(chId);
  startTypingListener(chId);
}

/* ── ШАПКА ЧАТА ── */
function _plural(n,a,b,c){return n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;}
function updateChatHeader(){
  if(!currentCh)return;
  const ava=$('ch-ava'),nameEl=$('ch-name'),sub=$('ch-desc');

    nm=o.displayName||o.email||'DM';photo=o.photoURL||null;
    const st=o.presence?.status||'offline';
    sub.className='topbar-desc'+(st==='online'?' online':'');
    sub.textContent=st==='online'?'в сети':st==='away'?'отошёл':'не в сети';
  }else if(isGrp){

  }else{

  if($('btn-video'))$('btn-video').style.display=isGrp?'none':'';
  if(photo)ava.innerHTML=`<img src="${esc(photo)}" alt=""/>`;
  else ava.textContent=(currentCh.type==='direct'||isGrp)?ini(nm):(currentCh.type==='private'?'🔒':'#');
  updateGroupInputState();
}

/* ── MESSAGE LISTENER (incremental) ── */
function startMessageListener(chId){
  const list=$('msg-list');
  list.innerHTML='<div style="padding:28px;text-align:center;color:var(--muted);font-size:var(--fs-xs)">Загрузка…</div>';
  _lastMsgMeta=null;
  // Берём 150 ПОСЛЕДНИХ сообщений (desc + limit), затем разворачиваем по возрастанию.
  // Раньше asc + limit отдавал 150 самых старых — новые в больших чатах не появлялись.
  const q=query(collection(fdb,'pulsar_channels',chId,'messages'),orderBy('clientTs','desc'),limit(150));
  let first=true;
  msgUnsub=onSnapshot(q,snap=>{
    if(first){
      first=false;
      currentMsgs=snap.docs.map(d=>({id:d.id,chId,_pending:d.metadata.hasPendingWrites,...d.data()})).reverse();
      currentMsgs.forEach(m=>knownMsgIds.add(m.id));
      firstLoadTs=Date.now();
      fullRender(currentMsgs);
      scrollBot();
      markLatestIncoming();
      return;
    }
    const changes=snap.docChanges();
    const added=changes.filter(c=>c.type==='added').sort((a,b)=>(a.doc.data().clientTs||0)-(b.doc.data().clientTs||0));
    added.forEach(change=>{
      const m={id:change.doc.id,chId,_pending:change.doc.metadata.hasPendingWrites,...change.doc.data()};
      if(knownMsgIds.has(m.id))return;
      knownMsgIds.add(m.id);
      const isNew=(m.clientTs||0)>firstLoadTs;
      const stuck=appendMessage(m,isNew);
      if(currentCh?.type==='group')markGroupRead(chId);          // группа открыта — всё, что пришло, прочитано
      if(m.authorId!==me.uid&&isNew){
        showInAppNotif(m,currentCh?.name||'DM');
        if(document.hidden||!document.hasFocus())document.title='(!) Pulsar — Galelium';
        if(!stuck){newMsgCount++;updateScrollBtn();}
      }
    });
    if(added.length)markLatestIncoming();      // «доставлено» / «прочитано» для входящих
    changes.filter(c=>c.type==='modified').forEach(change=>{
      const m={id:change.doc.id,chId,_pending:change.doc.metadata.hasPendingWrites,...change.doc.data()};
      const idx=currentMsgs.findIndex(x=>x.id===m.id);
      if(idx>=0)currentMsgs[idx]=m;
      updateMessageEl(m);
    });
    refreshStatuses();
  },e=>{list.innerHTML=`<div style="padding:20px;color:var(--red);font-size:var(--fs-xs);text-align:center">Ошибка: ${esc(e.message)}</div>`;});
}

/* ── FULL RENDER (initial) ── */
function fullRender(msgs){
  const list=$('msg-list');
  if(!msgs.length){list.innerHTML='<div class="empty-chat" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:40px;text-align:center"><div style="font-size:var(--fs-3xl)">💬</div><div style="font-size:var(--fs-sm);font-weight:500">Напишите первое сообщение!</div><div style="font-size:var(--fs-xs);color:var(--muted-2)">Это начало вашего общения в '+(currentCh?.type==='group'?'этой группе':'этом канале')+'</div></div>';return;}
  list.innerHTML='';
  const frag=document.createDocumentFragment();     // один reflow вместо сотни
  let pDate='',pAId='',pTs=0;
  msgs.forEach(msg=>{
    const ts=msgTs(msg);
    const dk=ts.toDateString();
    if(dk!==pDate){frag.appendChild(makeDateDiv(ts));pDate=dk;pAId='';}
    const grouped=shouldGroup(msg,pAId,pTs);
    frag.appendChild(makeMsgEl(msg,grouped,false));
    pAId=msg.authorId;pTs=msg.clientTs||0;
  });
  list.appendChild(frag);
  _lastMsgMeta={dateKey:pDate,authorId:pAId,ts:pTs};
  refreshStatuses();
}

/* ── APPEND NEW MESSAGE (incremental) ── */
function appendMessage(msg,animate){
  const list=$('msg-list');
  list.querySelector('.empty-chat')?.remove();       // заглушка «Напишите первое сообщение»
  // Решаем про автопрокрутку ДО вставки: после неё высокое сообщение уже «уехало» за порог
  const stick=isNearBottom()||msg.authorId===me?.uid;
  const ts=msgTs(msg),dk=ts.toDateString(),meta=_lastMsgMeta;
  let grouped=false;
  if(!meta||meta.dateKey!==dk)list.appendChild(makeDateDiv(ts));        // новый день — группировку не тянем
  else grouped=shouldGroup(msg,meta.authorId,meta.ts);
  list.appendChild(makeMsgEl(msg,grouped,animate));
  currentMsgs.push(msg);
  _lastMsgMeta={dateKey:dk,authorId:msg.authorId,ts:msg.clientTs||0};
  refreshStatuses();
  if(stick)scrollBot();
  return stick;
}

/* ── UPDATE SINGLE MESSAGE EL ── */
function updateMessageEl(msg){
  const group=document.querySelector(`.msg-group[data-msgid="${msg.id}"]`);
  if(!group)return;

  // 1. Текст — обновляем только текстовый узел, сохраняем tsInline
  const textEl=group.querySelector('.msg-text[data-msgid]');
  if(textEl){
    if(msg.deleted){
      textEl.textContent='Сообщение удалено';
      textEl.className='msg-text deleted';
    } else {
      // Сохраняем tsInline если есть
      const tsSpan=textEl.querySelector('.msg-ts-inline');
      textEl.innerHTML=renderText(msg.text||'');
      if(tsSpan) textEl.appendChild(tsSpan.cloneNode(true));
    }
  }

  // 2. Реакции — ищем в msg-bubble-wrap
  const bubbleWrap=group.querySelector('.msg-bubble-wrap');
  if(!bubbleWrap) return;
  const reactWrap=bubbleWrap.querySelector('.msg-reactions');
  const rl=REACT5.filter(e=>(msg.reactions||{})[e]?.length);
  if(rl.length){
    const newReact=document.createElement('div');
    newReact.className='msg-reactions';
    newReact.innerHTML=rl.map(e=>`<button class="reaction-btn ${(msg.reactions[e]||[]).includes(me.uid)?'active':''}" data-msgid="${esc(msg.id)}" data-emoji="${e}">${e}<span class="reaction-count">${msg.reactions[e].length}</span></button>`).join('');
    if(reactWrap) reactWrap.replaceWith(newReact);
    else bubbleWrap.appendChild(newReact);
  } else if(reactWrap){
    reactWrap.remove();
  }

  // 3. Тег "изменено"
  const meta=group.querySelector('.msg-meta');
  if(meta&&msg.edited&&!meta.querySelector('.msg-edited-tag')){
    meta.insertAdjacentHTML('beforeend','<span class="msg-edited-tag">(изм.)</span>');
  }
  const inl=group.querySelector('.msg-ts-inline');
  if(!meta&&inl&&msg.edited&&!inl.querySelector('.msg-edited-inline'))
    inl.insertAdjacentHTML('afterbegin','<span class="msg-edited-inline">изм.</span>');

  // 4. Счётчик ответов в треде
  const tc=msg.threadCount||0;
  const tb=bubbleWrap.querySelector('.msg-thread-btn');
  if(tc>0&&!msg.deleted){
    const label=` ${tc} ${tc===1?'ответ':tc<5?'ответа':'ответов'} `;
    if(tb){if(tb.lastChild&&tb.lastChild.nodeType===3)tb.lastChild.textContent=label;}
    else bubbleWrap.insertAdjacentHTML('beforeend',`<button class="msg-thread-btn" data-msgid="${esc(msg.id)}"><svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M1 8V3a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H9l-3 2v-2H3a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>${label}</button>`);
  }else if(tb)tb.remove();
}

/* ── HELPERS FOR BUILDING MESSAGE HTML ── */
function msgTs(msg){return msg.ts?.toDate?.()||new Date(msg.clientTs||Date.now());}
function shouldGroup(msg,pAId,pTs){return msg.authorId===pAId&&((msg.clientTs||0)-pTs)<300000&&!msg.replyTo;}

/* ── СТАТУС ДОСТАВКИ (личные чаты) ──
 * ⏱ отправляется · ✓ сообщение на сервере · ✓✓ дошло до собеседника · ● собеседник увидел
 * В документе сообщения: deliveredTo / readBy — массивы uid. Их пишет клиент ПОЛУЧАТЕЛЯ.
 * Если более позднее моё сообщение доставлено/прочитано — более ранние тоже (достаточно отметить последнее). */
const ST_ICON={
  0:'<svg viewBox="0 0 18 11"><circle cx="9" cy="5.5" r="4"/><path d="M9 3.4v2.3l1.5.9"/></svg>',
  1:'<svg viewBox="0 0 18 11"><path d="M6 5.8l3 3L15 2.2"/></svg>',
  2:'<svg viewBox="0 0 18 11"><path d="M1.5 5.8l3 3L10.5 2.2M6 5.8l3 3L15 2.2"/></svg>',
  3:'<svg viewBox="0 0 18 11"><circle class="st-dot" cx="9" cy="5.5" r="4"/></svg>'
};
const ST_TITLE=['Отправляется…','Отправлено','Доставлено','Прочитано'];

function _msgRank(m,oid){
  if(!m.ts&&m._pending)return 0;                       // ещё не подтверждено сервером
  if((m.readBy||[]).includes(oid))return 3;
  if((m.deliveredTo||[]).includes(oid))return 2;
  return 1;
}
function refreshStatuses(){
  if(!currentCh||currentCh.type!=='direct'||!me)return;
  const oid=(currentCh.members||[]).find(u=>u!==me.uid);
  if(!oid)return;
  const list=$('msg-list');
  let best=0;                                          // самый высокий статус среди более поздних моих сообщений
  for(let i=currentMsgs.length-1;i>=0;i--){
    const m=currentMsgs[i];
    if(m.authorId!==me.uid)continue;
    const own=_msgRank(m,oid);
    const st=own===0?0:Math.max(own,best);
    if(own>best)best=own;
    const el=list.querySelector(`.msg-group[data-msgid="${m.id}"] .msg-st`);
    if(el&&el.dataset.st!==String(st)){
      el.dataset.st=String(st);
      el.innerHTML=ST_ICON[st];
      el.title=ST_TITLE[st];
    }
  }
}

// Сторона получателя: пишем в последнее входящее сообщение «доставлено» и, если чат открыт, «прочитано»
const _rcptSent={};                                    // msgId -> 'd' | 'r' (уже записали в этой сессии)
let _rcptOff=false;                                    // правила Firestore запретили — больше не пытаемся
function markIncoming(chId,msg,read){
  if(_rcptOff||!msg||!me||msg.authorId===me.uid)return;
  const have=_rcptSent[msg.id]||'';
  const hasD=have!==''||(msg.deliveredTo||[]).includes(me.uid);
  const hasR=have==='r'||(msg.readBy||[]).includes(me.uid);
  const upd={};
  if(!hasD)upd.deliveredTo=arrayUnion(me.uid);
  if(read&&!hasR)upd.readBy=arrayUnion(me.uid);
  if(!Object.keys(upd).length)return;
  _rcptSent[msg.id]=read?'r':(have||'d');
  updateDoc(doc(fdb,'pulsar_channels',chId,'messages',msg.id),upd).catch(e=>{
    delete _rcptSent[msg.id];
    if(e&&e.code==='permission-denied')_rcptOff=true;
    console.warn('receipt:',e&&e.message);
  });
}
// Чат реально перед глазами: открыт экран переписки и страница видима (в приложении Android фокус окна не проверяем)
function isChatSeenNow(){
  const conv=$('conversation');
  if(!conv||conv.style.display==='none')return false;
  if(document.hidden)return false;
  return document.hasFocus()||/DastdarozApp/.test(navigator.userAgent);
}
function markLatestIncoming(){
  if(!currentCh||currentCh.type!=='direct'||!me)return;
  for(let i=currentMsgs.length-1;i>=0;i--){
    const m=currentMsgs[i];
    if(m.authorId!==me.uid){markIncoming(currentCh.id,m,isChatSeenNow());return;}
  }
}
// Чат не открыт, но приложение запущено: «доставлено» по превью последнего сообщения в списке чатов
function markDeliveredFromList(ch){
  const lm=ch.lastMessage;
  if(_rcptOff||!lm||!lm.id||lm.authorId===me.uid)return;
  if(currentCh?.id===ch.id)return;                     // открытый чат ведёт слушатель сообщений
  let store={};
  try{store=JSON.parse(localStorage.getItem('p_dlv')||'{}');}catch(e){}
  if(store[ch.id]===lm.id)return;
  store[ch.id]=lm.id;
  try{localStorage.setItem('p_dlv',JSON.stringify(store));}catch(e){}
  markIncoming(ch.id,{id:lm.id,authorId:lm.authorId},false);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)markLatestIncoming();});
window.addEventListener('focus',markLatestIncoming);

function makeDateDiv(ts){
  const div=document.createElement('div');
  div.className='date-div';
  div.dataset.date=ts.toDateString();
  div.innerHTML=`<div class="date-div-line"></div><div class="date-div-text">${fmtD({toDate:()=>ts})}</div><div class="date-div-line"></div>`;
  return div;
}

function makeAvHtml(msg, grouped){
  return ''; // аватарки в чате не показываются
}

function makeAttachHtml(msg){
  if(msg.attachmentType==='image'){
    return`<div class="msg-attachment"><div class="msg-img-wrap"><img class="msg-img" src="${esc(msg.attachmentUrl)}" alt="${esc(msg.attachmentName)}" data-lightbox="${esc(msg.attachmentUrl)}" loading="lazy"/><div class="msg-img-overlay"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="white" stroke-width="1.4"/><path d="M7 10h6M10 7v6" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg></div></div></div>`;
  }
  if(msg.attachmentType==='file'){
    return`<div class="msg-attachment"><a class="msg-file" href="${esc(msg.attachmentUrl)}" target="_blank" rel="noopener" download>
      <div class="msg-file-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8 1H3a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L8 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1v5h5" stroke="currentColor" stroke-width="1.2"/></svg></div>
      <div class="msg-file-info"><span class="msg-file-name">${esc(msg.attachmentName)}</span><span class="msg-file-size">${esc(msg.attachmentSize||'')}</span></div>
    </a></div>`;
  }
  return'';
}

function makeMsgEl(msg, grouped, animate){
  const isMe = msg.authorId === me.uid;
  const react = msg.reactions || {};
  const rl = REACT5.filter(e => react[e]?.length);
  const threadCount = msg.threadCount || 0;
  const ts = fmtT({toDate: () => msgTs(msg)});
  const isDM = currentCh?.type === 'direct';
  const isGrp = currentCh?.type === 'group';

  const div = document.createElement('div');
  div.className = `msg-group${!grouped?' msg-first':' msg-grouped'}${isMe?' from-me':''}${animate?' new-msg':''}`;
  div.dataset.msgid = msg.id;

  // Мета (имя + время над сообщением): только в каналах и группах, у первого сообщения автора.
  // В личной переписке имя не показываем — время лежит внутри пузырька.
  const showMeta = !grouped && !isDM && !isGrp;   // в группах ник уходит внутрь пузырька
  const metaHtml = showMeta ? `<div class="msg-meta">
    <span class="msg-author${isMe?' is-me':''}" data-uid="${esc(msg.authorId)}">${esc(msg.authorName)}</span>
    <span class="msg-time">${ts}</span>
    ${msg.edited?'<span class="msg-edited-tag">(изм.)</span>':''}
    ${msg.pinned?'<span class="msg-pinned-tag">📌</span>':''}
  </div>` : '';

  // Время внутри пузырька (малое, справа внизу) — для своих и при группировке
  // + значок статуса (⏱/✓/✓✓/●) — только у своих сообщений в личной переписке; заполняет refreshStatuses()
  const stHtml = (isMe && isDM && !msg.deleted) ? '<span class="msg-st"></span>' : '';
  const editedInl = (msg.edited && !showMeta) ? '<span class="msg-edited-inline">изм.</span>' : '';   // без меты «изм.» рядом со временем
  const tsInline = (isMe || grouped || isDM || isGrp) ? `<span class="msg-ts-inline">${editedInl}<span class="msg-ts-time">${ts}</span>${stHtml}</span>` : '';

  const textHtml = msg.deleted
    ? '<div class="msg-text deleted">Сообщение удалено</div>'
    : `<div class="msg-text" data-msgid="${esc(msg.id)}">${renderText(msg.text||'')}${tsInline}</div>`;

  const reactHtml = rl.length ? `<div class="msg-reactions">${rl.map(e=>
    `<button class="reaction-btn ${react[e]?.includes(me.uid)?'active':''}" data-msgid="${esc(msg.id)}" data-emoji="${e}">${e}<span class="reaction-count">${react[e].length}</span></button>`
  ).join('')}</div>` : '';

  const threadHtml = threadCount > 0 && !msg.deleted
    ? `<button class="msg-thread-btn" data-msgid="${esc(msg.id)}">
        <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M1 8V3a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H9l-3 2v-2H3a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        ${threadCount} ${threadCount===1?'ответ':threadCount<5?'ответа':'ответов'}
      </button>` : '';

  div.innerHTML = `
    <div class="msg-row${isMe?' is-me':''}">
      ${makeAvHtml(msg, grouped)}
      <div class="msg-bubble-wrap">
        ${metaHtml}
        <div class="msg-bubble">
          ${(isGrp && !isMe && !grouped)?`<div class="msg-author-in" data-uid="${esc(msg.authorId)}" style="color:${uidColor(msg.authorId)}">${esc(msg.authorName)}</div>`:''}
          ${msg.replyTo?`<div class="msg-reply-ref" data-scroll="${esc(msg.replyTo.id)}"><span class="msg-reply-author">${esc(msg.replyTo.authorName)}</span><span class="msg-reply-text">${esc(msg.replyTo.text?.slice(0,80)||'Вложение')}</span>
        </div>`:''}
          ${textHtml}
          ${makeAttachHtml(msg)}
        </div>
        ${reactHtml}${threadHtml}
      </div>
    </div>
  `;
  return div;
}


// Все клики по сообщениям — одним обработчиком на список (раньше ~15 слушателей на каждое сообщение)
function initMessageEvents(){
  $('msg-list').addEventListener('click',e=>{
    const t=e.target;let el;
    if(t.closest('.msg-edit-wrap'))return;                       // клики внутри редактора не трогаем
    if((el=t.closest('.code-copy'))){
      e.stopPropagation();
      navigator.clipboard.writeText(el.dataset.code||'').then(()=>{el.textContent='Скопировано';el.classList.add('copied');setTimeout(()=>{el.textContent='Скопировать';el.classList.remove('copied');},2000);}).catch(()=>toast('Не удалось скопировать','err'));
      return;
    }
    if((el=t.closest('.reaction-btn'))){e.stopPropagation();toggleReact(el.dataset.msgid,el.dataset.emoji);return;}
    if((el=t.closest('[data-scroll]'))){const g=document.querySelector(`.msg-group[data-msgid="${el.dataset.scroll}"]`);if(g)g.scrollIntoView({behavior:'smooth',block:'center'});return;}
    if((el=t.closest('[data-lightbox]'))){e.stopPropagation();openLightbox(el.dataset.lightbox);return;}
    if((el=t.closest('.msg-thread-btn'))){openThread(el.dataset.msgid);return;}
    if((el=t.closest('[data-uid]'))){openUserProfile(el.dataset.uid);return;}
    if((el=t.closest('.msg-bubble'))){                           // тап по пузырьку — меню сообщения
      if(t.closest('a'))return;                                  // ссылки открываются как обычно
      if(window.getSelection&&String(window.getSelection()))return; // выделяют текст — не мешаем
      e.stopPropagation();
      openMsgMenu(el.closest('.msg-group'));
    }
  });
  // Долгое нажатие на телефоне / правая кнопка мыши — то же меню
  $('msg-list').addEventListener('contextmenu',e=>{
    const b=e.target.closest('.msg-bubble');
    if(!b||b.querySelector('.msg-edit-wrap'))return;
    e.preventDefault();openMsgMenu(b.closest('.msg-group'));
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMsgMenu();});
}

/* ── PINNED ── */
async function loadPinnedMsgs(chId){
  try{const snap=await getDocs(query(collection(fdb,'pulsar_channels',chId,'messages'),where('pinned','==',true),orderBy('clientTs','desc'),limit(10)));pinnedMsgs=snap.docs.map(d=>({id:d.id,...d.data()}));updatePinnedBar();}
  catch(e){pinnedMsgs=[];updatePinnedBar();}
}
function updatePinnedBar(){
  const bar=$('pinned-bar');
  if(!pinnedMsgs.length){bar.classList.remove('visible');return;}
  bar.classList.add('visible');const p=pinnedMsgs[0];
  $('pinned-bar-author').textContent=p.authorName||'';
  $('pinned-bar-text').textContent=(p.text||'Вложение').slice(0,80);
}
async function pinMessage(msgId,isPinned){
  if(!currentCh)return;
  try{await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{pinned:!isPinned});toast(isPinned?'Откреплено':'Закреплено ✓','ok');loadPinnedMsgs(currentCh.id);}
  catch(e){toast('Ошибка: '+e.message,'err');}
}


/* ── МЕНЮ СООБЩЕНИЯ ── */
const MM_ICONS={
  reply:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v3"/>',
  thread:'<path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2h-6l-5 4v-4H6a2 2 0 01-2-2z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/>',
  delete:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>'
};
let _mm=null,_mmMsgId=null,_mmTimer=0,_mmGroup=null;
function _mmRoot(){
  if(_mm)return _mm;
  _mm=document.createElement('div');_mm.id='msg-menu';
  _mm.innerHTML='<div class="mm-scrim"></div><div class="mm-clone"></div><div class="mm-pill"></div><div class="mm-list"></div>';
  document.body.appendChild(_mm);
  _mm.querySelector('.mm-scrim').addEventListener('click',closeMsgMenu);
  _mm.addEventListener('click',e=>{
    const id=_mmMsgId;
    const r=e.target.closest('.mm-react');
    if(r){closeMsgMenu();toggleReact(id,r.dataset.emoji);return;}
    const it=e.target.closest('.mm-item');
    if(!it)return;
    const msg=currentMsgs.find(m=>m.id===id);
    closeMsgMenu();
    if(!msg)return;
    if(it.dataset.a==='copy'){
      navigator.clipboard.writeText(msg.text||'').then(()=>toast('Скопировано','ok')).catch(()=>toast('Не удалось скопировать','err'));
      return;
    }
    msgAction(it.dataset.a,id,!!msg.pinned);
  });
  return _mm;
}
function closeMsgMenu(){
  if(!_mm||!_mm.classList.contains('open'))return;
  if(_mmGroup){_mmGroup.style.visibility='';_mmGroup=null;}      // оригинал возвращаем на место
  _mm.classList.remove('show');_mmMsgId=null;
  clearTimeout(_mmTimer);
  _mmTimer=setTimeout(()=>{_mm.classList.remove('open');_mm.querySelector('.mm-clone').innerHTML='';},180);
}
function openMsgMenu(group){
  if(!group)return;
  const msg=currentMsgs.find(m=>m.id===group.dataset.msgid);
  if(!msg||msg.deleted)return;
  const root=_mmRoot(),isMe=msg.authorId===me.uid;
  clearTimeout(_mmTimer);_mmMsgId=msg.id;
  if(_mmGroup)_mmGroup.style.visibility='';
  _mmGroup=group;group.style.visibility='hidden';          // пока открыто меню, показываем только копию
  const cloneBox=root.querySelector('.mm-clone'),pill=root.querySelector('.mm-pill'),list=root.querySelector('.mm-list');

  // Копия сообщения поверх затемнения
  const c=group.cloneNode(true);
  c.classList.remove('new-msg');
  c.removeAttribute('data-msgid');c.querySelectorAll('[data-msgid]').forEach(n=>n.removeAttribute('data-msgid'));
  c.style.cssText='margin:0;width:100%';
  // Пузырёк в копии делаем непрозрачным: его цвет полупрозрачный и сквозь него просвечивали дата и соседние сообщения
  const ob=group.querySelector('.msg-bubble'),cb=c.querySelector('.msg-bubble');
  if(ob&&cb){
    const col=getComputedStyle(ob).backgroundColor;
    cb.style.backgroundColor=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f3f7f4';
    cb.style.backgroundImage=`linear-gradient(${col},${col})`;
  }
  cloneBox.innerHTML='';cloneBox.appendChild(c);

  pill.innerHTML=REACT5.map(e=>`<button class="mm-react${(msg.reactions?.[e]||[]).includes(me.uid)?' mine':''}" data-emoji="${e}">${e}</button>`).join('');
  const items=[['reply','Ответить'],['thread','Ответить в треде']];
  if(msg.text)items.push(['copy','Копировать текст']);
  items.push(['pin',msg.pinned?'Открепить':'Закрепить']);
  if(isMe)items.push(['edit','Изменить'],['delete','Удалить']);
  list.innerHTML=items.map(([a,l])=>`<button class="mm-item${a==='delete'?' danger':''}" data-a="${a}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${MM_ICONS[a]}</svg>${l}</button>`).join('');

  root.classList.add('open');                        // показываем (прозрачным) — чтобы измерить
  const vv=window.visualViewport,vw=window.innerWidth,vh=vv?vv.height:window.innerHeight;
  const tb=document.querySelector('.topbar'),topMin=(tb?tb.getBoundingClientRect().bottom:0)+8,botMax=vh-8,gap=8;
  const gr=group.getBoundingClientRect(),wr=(group.querySelector('.msg-bubble-wrap')||group).getBoundingClientRect();
  const pillH=pill.offsetHeight,pillW=pill.offsetWidth,listH=list.offsetHeight,listW=list.offsetWidth;
  const cloneH=Math.min(gr.height,Math.max(100,botMax-topMin-pillH-listH-gap*2));   // очень длинное — обрезаем
  const total=pillH+gap+cloneH+gap+listH;
  const top=Math.max(topMin,Math.min(gr.top-pillH-gap,botMax-total));
  const cTop=top+pillH+gap;
  Object.assign(cloneBox.style,{left:gr.left+'px',top:cTop+'px',width:gr.width+'px',height:cloneH+'px'});
  const place=(el,w,y)=>{                            // прижимаем к стороне пузырька, не выходя за экран
    const x=isMe?wr.right-w:wr.left;
    Object.assign(el.style,{top:y+'px',left:Math.max(8,Math.min(x,vw-w-8))+'px',transformOrigin:isMe?'top right':'top left'});
  };
  place(pill,pillW,top);
  place(list,listW,cTop+cloneH+gap);
  requestAnimationFrame(()=>root.classList.add('show'));
}

/* ── MESSAGE ACTIONS ── */
function msgAction(action,msgId,isPinned=false){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  if(action==='reply'){replyTo={id:msg.id,text:msg.text||'',authorName:msg.authorName};$('reply-bar').classList.add('visible');updateInputRadius();$('reply-to-name').textContent=msg.authorName;$('reply-preview').textContent=(msg.text||'Вложение').slice(0,80);$('msg-input').focus();}
  if(action==='edit'&&msg.authorId===me.uid&&!msg.deleted){msg._prevText=msg.text;startEdit(msgId,msg.text||'');}
  if(action==='delete'&&msg.authorId===me.uid){if(!confirm('Удалить сообщение?'))return;delMsg(msgId);}
  if(action==='pin')pinMessage(msgId,isPinned);
  if(action==='thread')openThread(msgId);
}
function startEdit(msgId,text){
  cancelEdit();
  // Ищем текстовый элемент внутри пузырька
  const el=document.querySelector(`.msg-bubble .msg-text[data-msgid="${msgId}"]`);if(!el)return;
  editingId=msgId;
  const w=document.createElement('div');w.className='msg-edit-wrap';w.dataset.editwrap=msgId;
  w.innerHTML=`<textarea class="msg-edit-input" rows="2">${esc(text)}</textarea><div class="msg-edit-btns"><button class="msg-edit-cancel">Отмена</button><button class="msg-edit-save">Сохранить</button></div>`;
  el.style.display='none';        // текст не удаляем, а прячем — после сохранения/отмены он возвращается на место
  el.after(w);
  const ta=w.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ar(ta);
  ta.addEventListener('input',()=>ar(ta));
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit(msgId,ta.value);}if(e.key==='Escape')cancelEdit();});
  w.querySelector('.msg-edit-save').addEventListener('click',()=>saveEdit(msgId,ta.value));
  w.querySelector('.msg-edit-cancel').addEventListener('click',cancelEdit);
}
function cancelEdit(){
  if(!editingId)return;
  document.querySelector(`[data-editwrap="${editingId}"]`)?.remove();
  const t=document.querySelector(`.msg-text[data-msgid="${editingId}"]`);
  if(t)t.style.display='';        // возвращаем спрятанный текст
  editingId=null;
}
async function saveEdit(msgId,t){
  const tx=t.trim();if(!tx||!currentCh)return;
  const msg=currentMsgs.find(m=>m.id===msgId);
  if(msg&&tx===(msg.text||'')){cancelEdit();return;}      // ничего не поменяли — не помечаем «изм.»
  const prevText=msg?msg.text:null,prevEdited=msg?!!msg.edited:false;
  // Оптимистично обновляем локально
  if(msg){msg.text=tx;msg.edited=true;}
  cancelEdit();                                            // убирает редактор и возвращает текст
  if(msg) updateMessageEl(msg);
  try{
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{text:tx,edited:true,editedAt:serverTimestamp()});
  }catch(e){
    toast('Ошибка сохранения: '+e.message,'err');
    // Откат
    if(msg){
      msg.text=prevText;msg.edited=prevEdited;updateMessageEl(msg);
      if(!prevEdited)document.querySelectorAll(`.msg-group[data-msgid="${msgId}"] .msg-edited-inline,.msg-group[data-msgid="${msgId}"] .msg-edited-tag`).forEach(n=>n.remove());
    }
  }
}
async function delMsg(msgId){if(!currentCh)return;try{await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{deleted:true,text:''});}catch(e){toast('Ошибка: '+e.message,'err');}}
async function toggleReact(msgId,emoji){
  if(!currentCh||!me)return;
  const ref=doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId);
  const msg=currentMsgs.find(m=>m.id===msgId);
  const prev=msg?(msg.reactions||{}):null;
  const users=prev?.[emoji]||[];
  const adding=!users.includes(me.uid);
  // Оптимистично: сразу обновляем интерфейс
  if(msg){msg.reactions={...prev,[emoji]:adding?[...users,me.uid]:users.filter(u=>u!==me.uid)};updateMessageEl(msg);}
  try{
    await updateDoc(ref,{[`reactions.${emoji}`]:adding?arrayUnion(me.uid):arrayRemove(me.uid)});
  }catch(e){
    console.error('react:',e);
    if(msg){msg.reactions=prev;updateMessageEl(msg);}     // настоящий откат
    toast('Не удалось поставить реакцию','err');
  }
}

/* ── FILE UPLOAD ── */
function handleFileSelect(file){
  if(!file)return;
  pendingFile=file;
  const isImg=file.type.startsWith('image/');
  $('upload-preview').classList.add('visible');
  $('upload-name').textContent=file.name+' ('+fmtSize(file.size)+')';
  $('upload-fill').style.width='0%';
  if(isImg){const r=new FileReader();r.onload=e=>{$('upload-thumb').src=e.target.result;};r.readAsDataURL(file);}
  else $('upload-thumb').src='';
  updateInputRadius();
  $('btn-send').disabled=false;
}
function cancelUpload(){pendingFile=null;if(uploadTask)uploadTask.cancel();$('upload-preview').classList.remove('visible');$('upload-thumb').src='';$('file-input').value='';updateInputRadius();$('btn-send').disabled=!$('msg-input').value.trim();}
function updateInputRadius(){
  const hasAbove=$('upload-preview').classList.contains('visible')||$('reply-bar').classList.contains('visible');
}

/* ── SEND MESSAGE ── */
async function sendMessage(){
  const input=$('msg-input'),text=input.value.trim();
  if(!text&&!pendingFile)return;
  if(!currentCh)return;
  if(text.length>MAX_CHARS){toast(`Слишком длинное сообщение (макс. ${MAX_CHARS})`,'err');return;}
  const chId=currentCh.id;                 // фиксируем чат: пока грузится файл, пользователь мог перейти в другой
  clearTyping();

  let attachData={};
  if(pendingFile){
    const file=pendingFile;pendingFile=null;$('btn-send').disabled=true;
    try{
      const path=`pulsar/${chId}/${Date.now()}_${file.name}`;
      const storRef=sRef(storage,path);
      uploadTask=uploadBytesResumable(storRef,file);
      await new Promise((res,rej)=>{uploadTask.on('state_changed',s=>{$('upload-fill').style.width=(s.bytesTransferred/s.totalBytes*100)+'%';},rej,async()=>{const url=await getDownloadURL(uploadTask.snapshot.ref);attachData={attachmentUrl:url,attachmentName:file.name,attachmentSize:fmtSize(file.size),attachmentType:file.type.startsWith('image/')?'image':'file'};res();});});
    }catch(e){if(e?.code!=='storage/canceled')toast('Ошибка загрузки: '+e.message,'err');$('btn-send').disabled=false;return;}
    cancelUpload();
  }

  input.value='';ar(input);$('btn-send').disabled=true;$('char-count').textContent='';
  const payload={text:text||'',authorId:me.uid,authorName:me.displayName||me.email,ts:serverTimestamp(),clientTs:Date.now(),edited:false,deleted:false,pinned:false,reactions:{},replyTo:replyTo||null,threadCount:0,...attachData};
  clearReply();
  let sentId=null;
  try{
    sentId=(await addDoc(collection(fdb,'pulsar_channels',chId,'messages'),payload)).id;
  }catch(e){toast('Ошибка отправки: '+e.message,'err');input.value=text;ar(input);$('btn-send').disabled=false;return;}
  // Превью в списке чатов — отдельно: сбой тут не должен возвращать текст в поле (получился бы дубль)

function openThread(msgId){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  threadMsgId=msgId;
  $('shell').classList.add('thread-open');
  $('thread-panel').classList.add('open');
  const user=allUsers[msg.authorId]||{};
  const avI=user.photoURL?`<img src="${esc(user.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit"/>`:esc(ini(msg.authorName));
  $('thread-root').innerHTML=`<div class="thread-root-author">${avI} ${esc(msg.authorName)} <span class="thread-root-time">${fmtT({toDate:()=>msgTs(msg)})}</span></div><div class="thread-root-text">${renderText(msg.text||'[Вложение]')}</div>`;
  if(threadUnsub)threadUnsub();
  const tq=query(collection(fdb,'pulsar_channels',currentCh.id,'messages',msgId,'thread'),orderBy('clientTs','asc'));
  const tmList=$('thread-msgs');
  threadUnsub=onSnapshot(tq,snap=>{
    const replies=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!replies.length){tmList.innerHTML='<div style="padding:20px;font-size:var(--fs-xs);color:var(--muted);text-align:center">Ответов пока нет<br><span style="font-size:var(--fs-2xs);color:var(--muted-2)">Напишите первый</span></div>';return;}
    tmList.innerHTML=replies.map(r=>{
      const u=allUsers[r.authorId]||{};
      const avI2=u.photoURL?`<img src="${esc(u.photoURL)}" alt=""/>`:esc(ini(r.authorName));
      return`<div class="thread-reply-row"><div class="thread-reply-av">${avI2}</div><div class="thread-reply-body"><div class="thread-reply-meta"><span class="thread-reply-author">${esc(r.authorName)}</span><span class="thread-reply-time">${fmtT(r.ts||{toDate:()=>new Date(r.clientTs)})}</span></div><div class="thread-reply-text">${renderText(r.text||'')}</div></div></div>`;
    }).join('');
    requestAnimationFrame(()=>{tmList.scrollTop=tmList.scrollHeight;});
  });
}

function openMentionPopup(query){

  if(!mentionMatches.length){popup.classList.remove('open');return;}

  }).join('');
  popup.classList.add('open');

function insertMention(idx){
  const u=mentionMatches[idx];if(!u)return;

// фото из галереи → квадрат 512×512 → Storage → профиль
async function _squareBlob(file,size){
  const bmp=await createImageBitmap(file);
  const side=Math.min(bmp.width,bmp.height);
  const c=document.createElement('canvas'); c.width=c.height=size;
  c.getContext('2d').drawImage(bmp,(bmp.width-side)/2,(bmp.height-side)/2,side,side,0,0,size,size);
  bmp.close?.();
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Не удалось обработать фото')),'image/jpeg',.88));
}
async function _avpUploadFile(file){
  if(_avpBusy||!me) return;
  if(!file.type.startsWith('image/')){ toast('Выберите изображение','err'); return; }
  const btn=$('avp-gallery'), lbl=btn.querySelector('span');
  btn.disabled=true; lbl.textContent='Загрузка…';
  let url=null;
  try{
    const blob=await _squareBlob(file,512);
    const snap=await uploadBytesResumable(sRef(storage,`avatars/${me.uid}/${Date.now()}.jpg`),blob,{contentType:'image/jpeg'});
    url=await getDownloadURL(snap.ref);
  }catch(e){ toast('Не удалось загрузить: '+e.message,'err'); }
  btn.disabled=false; lbl.textContent='Выбрать из галереи';
  if(url) _setAvatar(url);
}

/* ════════════════════════════════════════════════════════════════
 *  ГРУППЫ  (pulsar_channels/{id}, type:'group')
 *  Хранятся в той же коллекции, что и каналы, поэтому сообщения, реакции, треды,
 *  закрепы и «печатает…» работают без изменений. В список чатов не попадают —
 *  только во вкладку «Группы».
 *    ├─ name, description, photoURL
 *    ├─ privacy     'public' (пока только он)
 *    ├─ members     string[]  uid участников (создатель — первый)
 *    ├─ createdBy, createdAt, order:9999, lastMessage
 * ════════════════════════════════════════════════════════════════ */
const GRP_COLORS=['#1a9e4a','#2563eb','#d97706','#7c3aed','#db2777','#0891b2','#dc2626','#65a30d'];
function uidColor(uid=''){let h=0;for(let i=0;i<uid.length;i++)h=(h*31+uid.charCodeAt(i))>>>0;return GRP_COLORS[h%GRP_COLORS.length];}
const GRP_ICON='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>';
let _grpLoaded=false,_grpQuery='',_grpBase=false,_grpPickMode='create';
let _pendingJoin=(()=>{try{return new URLSearchParams(location.search).get('join')||localStorage.getItem('p_join');}catch(e){return null;}})();
// «прочитано» хранится на устройстве: время, когда группу последний раз видели
const _readMap=(()=>{try{return JSON.parse(localStorage.getItem('p_gread')||'{}');}catch(e){return {};}})();
function _saveRead(){try{localStorage.setItem('p_gread',JSON.stringify(_readMap));}catch(e){}}
function markGroupRead(id){_readMap[id]=Date.now();_saveRead();}
function isGroupUnread(g){
  if(!me||!(g.members||[]).includes(me.uid))return false;
  const lm=g.lastMessage;if(!lm?.ts||lm.authorId===me.uid)return false;
  const t=lm.ts.toDate?lm.ts.toDate().getTime():0;
  return t>(_readMap[g.id]||0);
}
const groupLink=id=>location.origin+location.pathname+'?join='+encodeURIComponent(id);
async function shareGroupLink(){
  const g=_gpGroup();if(!g)return;
  const url=groupLink(g.id);
  if(navigator.share){
    try{await navigator.share({title:g.name,text:`Вступайте в группу «${g.name}» в Pulsar`,url});return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована','ok');}
  catch(e){toast('Не удалось скопировать','err');}
}
let _grpBuilt=false,_grpBusy=false,_grpBlob=null,_grpPrev='',_grpPicked=new Set();

function _mentionPool(){

/* ── список во вкладке «Группы» ── */
function makeGroupCard(g){
  const n=(g.members||[]).length,lm=g.lastMessage;
  const ts=lm?.ts?fmtSbTime(lm.ts):'';
  const ava=g.photoURL?`<img src="${esc(g.photoURL)}" alt="" loading="lazy"/>`:esc(ini(g.name||'G'));
  const cnt=`${n} ${_plural(n,'участник','участника','участников')}`;
  let tail;
  if(lm){
    const icon=lm.attachmentType==='image'?'🖼 ':lm.attachmentType==='file'?'📎 ':'';
    tail=`<b>${esc((lm.authorName||'').split(' ')[0])}:</b> ${esc(icon+((lm.text||'').slice(0,55)||(lm.attachmentType?'Файл':'')))}`;
  }else tail=esc((g.description||'').slice(0,60))||'Нет сообщений';
  const unread=currentCh?.id!==g.id&&isGroupUnread(g);
  return `<div class="ch-card${currentCh?.id===g.id?' active':''}${unread?' has-unread':''}" data-chid="${esc(g.id)}" role="button" tabindex="0">

      <div class="ch-preview"><b>${cnt}</b> · ${tail}</div>
    </div>
  </div>`;
}
function renderGroupList(){
  const list=$('groups-list');
  if(!list||!me||!_grpLoaded)return;                    // пока данные не пришли — висит skeleton
  const q=_grpQuery.trim().toLowerCase();
  const act=g=>g.lastMessage?.ts?.toDate?.()?.getTime()||g.createdAt?.toDate?.()?.getTime()||Date.now();
  const vis=_allGroups
    .filter(g=>g.privacy!=='private'||(g.members||[]).includes(me.uid))     // приватные (на будущее) видят только участники
    .filter(g=>!q||(g.name||'').toLowerCase().includes(q)||(g.description||'').toLowerCase().includes(q))
    .sort((a,b)=>act(b)-act(a));
  if(!vis.length){
    list.innerHTML=q
      ?'<div style="padding:20px 14px;font-size:var(--fs-xs);color:var(--muted-2);text-align:center">Ничего не найдено</div>'
      :`<div class="grp-empty"><div class="grp-empty-ico">${GRP_ICON.replace('width="34" height="34"','width="28" height="28"')}</div><div class="grp-empty-t">Групп пока нет</div><div class="grp-empty-s">Создайте первую — её увидят все пользователи Pulsar</div></div>`;
    return;
  }
  const mine=vis.filter(g=>(g.members||[]).includes(me.uid)),other=vis.filter(g=>!(g.members||[]).includes(me.uid));
  list.innerHTML=
    (mine.length?`<div class="sb-section-tag"><span>Мои группы</span></div>`+mine.map(makeGroupCard).join(''):'')+
    (other.length?`<div class="sb-section-tag"><span>${mine.length?'Другие группы':'Все группы'}</span></div>`+other.map(makeGroupCard).join(''):'');
}
function onGroupsChanged(){
  renderGroupList();
  // открытая группа: подтягиваем свежие данные (участники, название, фото)
  if(currentCh?.type==='group'){
    const g=_allGroups.find(x=>x.id===currentCh.id);
    if(g){currentCh=g;updateChatHeader();if(_gpOpen)fillGroupProfile(false);}
  }
  // первая загрузка: уже имеющиеся сообщения считаем прочитанными, дальше работает индикатор
  if(!_grpBase){
    _grpBase=true;let ch=false;
    _allGroups.forEach(g=>{if((g.members||[]).includes(me.uid)&&!_readMap[g.id]){_readMap[g.id]=Date.now();ch=true;}});
    if(ch)_saveRead();
  }
  // пришли по ссылке-приглашению ?join=ID
  if(_pendingJoin){
    const id=_pendingJoin;_pendingJoin=null;
    try{localStorage.removeItem('p_join');history.replaceState(null,'',location.pathname);}catch(e){}
    if(_allGroups.some(g=>g.id===id))openChannel(id);else toast('Группа не найдена','err');
  }
}

  const iw=$('input-wrap'),jb=$('grp-join'),jbtn=$('grp-join-btn');

  if(iw)iw.style.display=joined?'':'none';
  if(jb)jb.style.display=(isGrp&&!joined)?'':'none';

async function joinGroup(){
  if(!currentCh||currentCh.type!=='group'||!me)return;
  if((currentCh.banned||[]).includes(me.uid)){toast('Вас исключили из этой группы','err');return;}
  const btn=$('grp-join-btn');btn.disabled=true;
  try{
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id),{members:arrayUnion(me.uid)});
    if(!(currentCh.members||[]).includes(me.uid))currentCh.members=[...(currentCh.members||[]),me.uid];

function openGroupCreate(){
  if(!me)return;
  _grpBuild();
  Sheet.open('group-create');
}
async function createGroup(){
  if(_grpBusy||!me)return;
  const name=$('grp-name').value.trim(),description=$('grp-desc').value.trim();
  if(!name){toast('Введите название','err');return;}
  _grpBusy=true;_grpValid();$('grp-submit').textContent='Создание…';
  try{
    let photoURL='';
    if(_grpBlob){
      // путь avatars/{uid}/… уже разрешён правилами Storage для аватарок
      const snap=await uploadBytesResumable(sRef(storage,`avatars/${me.uid}/group_${Date.now()}.jpg`),_grpBlob,{contentType:'image/jpeg'});
      photoURL=await getDownloadURL(snap.ref);
    }
    const members=[me.uid,...[..._grpPicked].filter(id=>id!==me.uid)];
    const ref=await addDoc(collection(fdb,'pulsar_channels'),{
      type:'group',privacy:'public',name,description,photoURL,members,
      createdBy:me.uid,createdAt:serverTimestamp(),order:9999,lastMessage:null
    });
    Sheet.close('group-create');
    toast('Группа создана ✓','ok');
    openChannel(ref.id);
  }catch(e){toast('Не удалось создать: '+e.message,'err');}
  _grpBusy=false;
  if($('grp-submit')){$('grp-submit').textContent='Создать группу';_grpValid();}
}

async function openGroupProfile(){

  Sheet.open('group-profile');

async function saveGroupProfile(){
  const g=_gpGroup();if(!g||!_gpIsOwner(g)||_gpBusy)return;
  const name=$('gp-name-input').value.trim(),description=$('gp-desc-input').value.trim();
  if(!name){toast('Введите название','err');return;}
  _gpBusy=true;$('gp-save').textContent='Сохранение…';_gpDirty();
  try{
    await updateDoc(doc(fdb,'pulsar_channels',g.id),{name,description});
    g.name=name;g.description=description;_gpSnap={name,desc:description};
    updateChatHeader();renderGroupList();
    Sheet.close('group-profile');toast('Группа обновлена ✓','ok');
  }catch(e){toast('Ошибка: '+e.message,'err');}
  _gpBusy=false;$('gp-save').textContent='Сохранить';_gpDirty();
}
const _grpRef=id=>doc(fdb,'pulsar_channels',id);
function toggleGroupMute(){
  const g=_gpGroup();if(!g)return;
  if(mutedChannels.has(g.id)){mutedChannels.delete(g.id);toast('Уведомления включены','ok');}
  else{mutedChannels.add(g.id);toast('Уведомления выключены','ok');}
  try{localStorage.setItem('p_muted',JSON.stringify([...mutedChannels]));}catch(e){}
  fillGroupProfile(false);renderGroupList();
}
async function leaveGroup(){
  const g=_gpGroup();if(!g||_gpIsOwner(g)||!(g.members||[]).includes(me.uid))return;
  if(!confirm(`Покинуть группу «${g.name}»?`))return;
  try{
    await updateDoc(_grpRef(g.id),{members:arrayRemove(me.uid)});
    g.members=(g.members||[]).filter(x=>x!==me.uid);
    Sheet.close('group-profile');
    toast('Вы покинули группу','ok');
    leaveConversation();                                   // обратно во вкладку «Группы»
  }catch(e){toast('Ошибка: '+e.message,'err');}
}
async function kickMember(uid){
  const g=_gpGroup();if(!g||!_gpIsOwner(g)||uid===me.uid||uid===g.createdBy)return;
  const nm=allUsers[uid]?.displayName||allUsers[uid]?.email||'участника';
  if(!confirm(`Исключить «${nm}» из группы?\nОн не сможет вступить снова, пока вы сами его не добавите.`))return;
  try{
    await updateDoc(_grpRef(g.id),{members:arrayRemove(uid),banned:arrayUnion(uid)});
    g.members=(g.members||[]).filter(x=>x!==uid);
    g.banned=[...new Set([...(g.banned||[]),uid])];
    fillGroupProfile(false);renderGroupList();updateChatHeader();
    toast('Участник исключён','ok');
  }catch(e){toast('Ошибка: '+e.message,'err');}
}
function openGroupAdd(){
  const g=_gpGroup();if(!g||!_gpIsOwner(g))return;
  _grpBuild();
  _grpPickMode='add';_grpPicked=new Set();
  Sheet.setTitle('group-pick','Добавить в группу');
  _grpPickedLabel();
  $('grp-pick-inp').value='';_grpPickRender();
  Sheet.open('group-pick');
}
async function addGroupMembers(){
  const g=_gpGroup(),ids=[..._grpPicked];
  if(!g||!_gpIsOwner(g))return;
  if(!ids.length){Sheet.close('group-pick');return;}
  const btn=$('grp-pick-done');btn.disabled=true;
  try{
    // явное добавление снимает исключение
    await updateDoc(_grpRef(g.id),{members:arrayUnion(...ids),banned:arrayRemove(...ids)});
    g.members=[...new Set([...(g.members||[]),...ids])];
    g.banned=(g.banned||[]).filter(x=>!ids.includes(x));
    fillGroupProfile(false);renderGroupList();updateChatHeader();
    Sheet.close('group-pick');
    toast(`Добавлено: ${ids.length}`,'ok');
  }catch(e){toast('Ошибка: '+e.message,'err');}
  btn.disabled=false;
}
// фото/обложка группы (вызывается из пикеров); true — сохранено
async function _saveGroupMedia(fields,okMsg){
  const g=_gpGroup();
  if(!g||!_gpIsOwner(g)||g.id!==_pickGrp){toast('Менять группу может только создатель','err');return false;}
  try{
    await updateDoc(doc(fdb,'pulsar_channels',g.id),fields);
    Object.assign(g,fields);
    fillGroupProfile(false);updateChatHeader();renderGroupList();
    toast(okMsg,'ok');return true;
  }catch(e){toast('Ошибка: '+e.message,'err');return false;}
}

function openMembers(){
  if(!currentCh)return;
  const ids=(currentCh.members&&currentCh.members.length)?currentCh.members:Object.keys(allUsers);

/* ── DM ── */
async function openOrCreateDM(otherUid){
  const members=[me.uid,otherUid].sort();
  try{
    const snap=await getDocs(query(collection(fdb,'pulsar_channels'),where('type','==','direct'),where('members','==',members)));
    if(!snap.empty){closeModal('modal-dm');openChannel(snap.docs[0].id);return;}
    const ref=await addDoc(collection(fdb,'pulsar_channels'),{type:'direct',members,createdBy:me.uid,createdAt:serverTimestamp(),order:9999,lastMessage:null});
    closeModal('modal-dm');openChannel(ref.id);
  }catch(e){toast('Ошибка: '+e.message,'err');}
}

/* ── КНОПКА «НАЗАД» (Android) ──
 * MainActivity вызывает window.handleBack(). true — страница сама обработала «назад»
 * (закрыла шторку/окно/чат), false — приложению можно закрыться как обычно.
 * Порядок: самое верхнее закрываем первым. */
window.handleBack=function(){
  // 1. Просмотр фото
  if($('lightbox')?.classList.contains('open')){closeLightbox();return true;}
  // 2. Меню сообщения
  if(_mm&&_mm.classList.contains('open')&&_mm.classList.contains('show')){closeMsgMenu();return true;}
  // 3. Шторки (профиль, участники, поиск, звонок…) — верхняя
  if(Sheet.closeTop())return true;
  // 4. Модальные окна
  const modal=document.querySelector('.modal-overlay.open');
  if(modal){closeModal(modal.id);return true;}
  // 5. Панель треда
  if($('thread-panel')?.classList.contains('open')){closeThread();return true;}
  // 6. Подсказка упоминаний
  if($('mention-popup')?.classList.contains('open')){closeMentionPopup();return true;}
  // 7. Переписка или вкладка «Комнаты»/«Группы» → к списку чатов
  const cur=_allViews.find(v=>{const e=$(v);return e&&getComputedStyle(e).display!=='none';});
  if(cur==='conversation'){leaveConversation();return true;}
  if(cur&&cur!=='no-channel'){openSidebar();return true;}
  // 8. Мы на главном экране — пусть приложение закроется как обычно
  return false;
};

  $('profile-name-input').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!$('btn-save-profile').disabled) saveProfile(); } });
  // Sheet controls (элементы находятся внутри sheet-body, уже в DOM)
  $('btn-save-profile').addEventListener('click', saveProfile);
  // Статус-кнопки в профиле
  document.querySelectorAll('.prof-status-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.prof-status-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    manualStatus=b.dataset.s==='online'?null:b.dataset.s;
    updatePresence(b.dataset.s);
    if(me.presence) me.presence.status=b.dataset.s; else me.presence={status:b.dataset.s};
  }));


  // Thread
  $('thread-close').addEventListener('click',closeThread);
  const ti=$('thread-input');
  ti.addEventListener('input',()=>{ar(ti);$('thread-send').disabled=!ti.value.trim();});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendThreadReply();}});
  $('thread-send').addEventListener('click',sendThreadReply);

  // Lightbox
  $('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox();});
  $('lightbox-close').addEventListener('click',closeLightbox);

  // Mute (button optional — may be absent)
  $('btn-mute')?.addEventListener('click',()=>{
    if(!currentCh){toast('Выберите канал','err');return;}
    const id=currentCh.id;
    if(mutedChannels.has(id)){mutedChannels.delete(id);$('btn-mute')?.classList.remove('active');toast('Уведомления включены','ok');}
    else{mutedChannels.add(id);$('btn-mute')?.classList.add('active');toast('Уведомления выключены','ok');}
    localStorage.setItem('p_muted',JSON.stringify([...mutedChannels]));
  });

  // Modals close
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.modal)));
  document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov.id);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('lightbox').classList.contains('open')){closeLightbox();return;}document.querySelectorAll('.modal-overlay.open').forEach(el=>closeModal(el.id));}});

  // Reset title on focus
  window.addEventListener('focus',()=>{document.title='Pulsar — Galelium';});

  // Navigation
  $('btn-back-to-chats').addEventListener('click',()=>{ leaveConversation(); });
  $('mob-btn-dms')?.addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-channels')?.addEventListener('click',()=>{ setNavActive('mob-btn-channels'); clearChatSearch(); showView('view-rooms'); });
  $('mob-btn-new')?.addEventListener('click',()=>{ setNavActive('mob-btn-new'); showView('view-groups'); renderGroupList(); });

  // Logout
  $('acc-logout')?.addEventListener('click',async()=>{
    if(!confirm('Выйти из Pulsar?'))return;
    stopSupport(); closeAvatarPicker(); closeBgPicker();
    await updatePresence('offline');clearTyping();
    // Убираем FCM-токен этого устройства из профиля, чтобы пуши не приходили после выхода
    // (только если там лежит именно наш токен — токен другого устройства не трогаем)
    try{
      const tok=window._myFcmToken;
      if(tok&&me){const r=doc(fdb,'users',me.uid);const s=await getDoc(r);
        if(s.exists()&&s.data().fcmToken===tok)await setDoc(r,{fcmToken:null},{merge:true});}
    }catch(e){}
    try{window.AndroidBridge?.onLogout?.();}catch(e){}   // Android: сбросить UID для FcmTokenWorker
    await signOut(auth);location.replace('login.html');
  });
}
</script>
</body>
</html>
