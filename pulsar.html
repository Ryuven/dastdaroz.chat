/* ── МЕНЮ СООБЩЕНИЯ ── */
const MM_ICONS={
  reply:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v3"/>',
  thread:'<path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2h-6l-5 4v-4H6a2 2 0 01-2-2z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/>',
  delete:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>'
};
let _mm=null,_mmMsgId=null,_mmTimer=0,_mmGroup=null;
function _mmRoot(){
  if(_mm)return _mm;
  _mm=document.createElement('div');_mm.id='msg-menu';
  _mm.innerHTML='<div class="mm-scrim"></div><div class="mm-clone"></div><div class="mm-pill"></div><div class="mm-list"></div>';
  document.body.appendChild(_mm);
  _mm.querySelector('.mm-scrim').addEventListener('click',closeMsgMenu);
  _mm.addEventListener('click',e=>{
    const id=_mmMsgId;
    const r=e.target.closest('.mm-react');
    if(r){closeMsgMenu();toggleReact(id,r.dataset.emoji);return;}
    const it=e.target.closest('.mm-item');
    if(!it)return;
    const msg=currentMsgs.find(m=>m.id===id);
    closeMsgMenu();
    if(!msg)return;
    if(it.dataset.a==='copy'){
      navigator.clipboard.writeText(msg.text||'').then(()=>toast('Скопировано','ok')).catch(()=>toast('Не удалось скопировать','err'));
      return;
    }
    msgAction(it.dataset.a,id,!!msg.pinned);
  });
  return _mm;
}
function closeMsgMenu(){
  if(!_mm||!_mm.classList.contains('open'))return;
  if(_mmGroup){_mmGroup.style.visibility='';_mmGroup=null;}      // оригинал возвращаем на место
  _mm.classList.remove('show');_mmMsgId=null;
  clearTimeout(_mmTimer);
  _mmTimer=setTimeout(()=>{_mm.classList.remove('open');_mm.querySelector('.mm-clone').innerHTML='';},180);
}
function openMsgMenu(group){
  if(!group)return;
  const msg=currentMsgs.find(m=>m.id===group.dataset.msgid);
  if(!msg||msg.deleted)return;
  const root=_mmRoot(),isMe=msg.authorId===me.uid;
  clearTimeout(_mmTimer);_mmMsgId=msg.id;
  if(_mmGroup)_mmGroup.style.visibility='';
  _mmGroup=group;group.style.visibility='hidden';          // пока открыто меню, показываем только копию
  const cloneBox=root.querySelector('.mm-clone'),pill=root.querySelector('.mm-pill'),list=root.querySelector('.mm-list');

  // Копия сообщения поверх затемнения
  const c=group.cloneNode(true);
  c.classList.remove('new-msg');
  c.removeAttribute('data-msgid');c.querySelectorAll('[data-msgid]').forEach(n=>n.removeAttribute('data-msgid'));
  c.style.cssText='margin:0;width:100%';
  // Пузырёк в копии делаем непрозрачным: его цвет полупрозрачный и сквозь него просвечивали дата и соседние сообщения
  const ob=group.querySelector('.msg-bubble'),cb=c.querySelector('.msg-bubble');
  if(ob&&cb){
    const col=getComputedStyle(ob).backgroundColor;
    cb.style.backgroundColor=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f3f7f4';
    cb.style.backgroundImage=`linear-gradient(${col},${col})`;
  }
  cloneBox.innerHTML='';cloneBox.appendChild(c);

  pill.innerHTML=REACT5.map(e=>`<button class="mm-react${(msg.reactions?.[e]||[]).includes(me.uid)?' mine':''}" data-emoji="${e}">${e}</button>`).join('');
  const items=[['reply','Ответить'],['thread','Ответить в треде']];
  if(msg.text)items.push(['copy','Копировать текст']);
  items.push(['pin',msg.pinned?'Открепить':'Закрепить']);
  if(isMe)items.push(['edit','Изменить'],['delete','Удалить']);
  list.innerHTML=items.map(([a,l])=>`<button class="mm-item${a==='delete'?' danger':''}" data-a="${a}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${MM_ICONS[a]}</svg>${l}</button>`).join('');

  root.classList.add('open');                        // показываем (прозрачным) — чтобы измерить
  const vv=window.visualViewport,vw=window.innerWidth,vh=vv?vv.height:window.innerHeight;
  const tb=document.querySelector('.topbar'),topMin=(tb?tb.getBoundingClientRect().bottom:0)+8,botMax=vh-8,gap=8;
  const gr=group.getBoundingClientRect(),wr=(group.querySelector('.msg-bubble-wrap')||group).getBoundingClientRect();
  const pillH=pill.offsetHeight,pillW=pill.offsetWidth,listH=list.offsetHeight,listW=list.offsetWidth;
  const cloneH=Math.min(gr.height,Math.max(100,botMax-topMin-pillH-listH-gap*2));   // очень длинное — обрезаем
  const total=pillH+gap+cloneH+gap+listH;
  const top=Math.max(topMin,Math.min(gr.top-pillH-gap,botMax-total));
  const cTop=top+pillH+gap;
  Object.assign(cloneBox.style,{left:gr.left+'px',top:cTop+'px',width:gr.width+'px',height:cloneH+'px'});
  const place=(el,w,y)=>{                            // прижимаем к стороне пузырька, не выходя за экран
    const x=isMe?wr.right-w:wr.left;
    Object.assign(el.style,{top:y+'px',left:Math.max(8,Math.min(x,vw-w-8))+'px',transformOrigin:isMe?'top right':'top left'});
  };
  place(pill,pillW,top);
  place(list,listW,cTop+cloneH+gap);
  requestAnimationFrame(()=>root.classList.add('show'));
}

/* ── MESSAGE ACTIONS ── */
function msgAction(action,msgId,isPinned=false){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  if(action==='reply'){replyTo={id:msg.id,text:msg.text||'',authorName:msg.authorName};$('reply-bar').classList.add('visible');updateInputRadius();$('reply-to-name').textContent=msg.authorName;$('reply-preview').textContent=(msg.text||'Вложение').slice(0,80);$('msg-input').focus();}
  if(action==='edit'&&msg.authorId===me.uid&&!msg.deleted){msg._prevText=msg.text;startEdit(msgId,msg.text||'');}
  if(action==='delete'&&msg.authorId===me.uid){if(!confirm('Удалить сообщение?'))return;delMsg(msgId);}
  if(action==='pin')pinMessage(msgId,isPinned);
  if(action==='thread')openThread(msgId);
}
function startEdit(msgId,text){
  cancelEdit();editingId=msgId;
  // Ищем текстовый элемент внутри пузырька
  const el=document.querySelector(`.msg-bubble .msg-text[data-msgid="${msgId}"]`);if(!el)return;
  const w=document.createElement('div');w.className='msg-edit-wrap';w.dataset.editwrap=msgId;
  w.innerHTML=`<textarea class="msg-edit-input" rows="2">${esc(text)}</textarea><div class="msg-edit-btns"><button class="msg-edit-save">Сохранить</button><button class="msg-edit-cancel">Отмена</button><span class="msg-edit-hint">Enter — сохранить · Esc — отмена</span></div>`;
  el.replaceWith(w);
  const ta=w.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ar(ta);
  ta.addEventListener('input',()=>ar(ta));
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit(msgId,ta.value);}if(e.key==='Escape')cancelEdit();});
  w.querySelector('.msg-edit-save').addEventListener('click',()=>saveEdit(msgId,ta.value));
  w.querySelector('.msg-edit-cancel').addEventListener('click',cancelEdit);
}
function cancelEdit(){if(!editingId)return;document.querySelector(`[data-editwrap="${editingId}"]`)?.remove();editingId=null;}
async function saveEdit(msgId,t){
  const tx=t.trim();if(!tx||!currentCh)return;
  // Оптимистично обновляем локально
  const msg=currentMsgs.find(m=>m.id===msgId);
  if(msg){msg.text=tx;msg.edited=true;}
  cancelEdit();
  // Убираем редактор, показываем обновлённый текст
  if(msg) updateMessageEl(msg);
  try{
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{text:tx,edited:true,editedAt:serverTimestamp()});
    editingId=null;
  }catch(e){
    toast('Ошибка сохранения: '+e.message,'err');
    // Откат
    if(msg){msg.text=msg._prevText||tx;updateMessageEl(msg);}
  }
}
async function delMsg(msgId){if(!currentCh)return;try{await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{deleted:true,text:''});}catch(e){toast('Ошибка: '+e.message,'err');}}
async function toggleReact(msgId,emoji){
  if(!currentCh||!me)return;
  const ref=doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId);
  const msg=currentMsgs.find(m=>m.id===msgId);
  const prev=msg?(msg.reactions||{}):null;
  const users=prev?.[emoji]||[];
  const adding=!users.includes(me.uid);
  // Оптимистично: сразу обновляем интерфейс
  if(msg){msg.reactions={...prev,[emoji]:adding?[...users,me.uid]:users.filter(u=>u!==me.uid)};updateMessageEl(msg);}
  try{
    await updateDoc(ref,{[`reactions.${emoji}`]:adding?arrayUnion(me.uid):arrayRemove(me.uid)});
  }catch(e){
    console.error('react:',e);
    if(msg){msg.reactions=prev;updateMessageEl(msg);}     // настоящий откат
    toast('Не удалось поставить реакцию','err');
  }
}

/* ── FILE UPLOAD ── */
function handleFileSelect(file){
  if(!file)return;
  pendingFile=file;
  const isImg=file.type.startsWith('image/');
  $('upload-preview').classList.add('visible');
  $('upload-name').textContent=file.name+' ('+fmtSize(file.size)+')';
  $('upload-fill').style.width='0%';
  if(isImg){const r=new FileReader();r.onload=e=>{$('upload-thumb').src=e.target.result;};r.readAsDataURL(file);}
  else $('upload-thumb').src='';
  updateInputRadius();
  $('btn-send').disabled=false;
}
function cancelUpload(){pendingFile=null;if(uploadTask)uploadTask.cancel();$('upload-preview').classList.remove('visible');$('upload-thumb').src='';$('file-input').value='';updateInputRadius();$('btn-send').disabled=!$('msg-input').value.trim();}
function updateInputRadius(){
  const hasAbove=$('upload-preview').classList.contains('visible')||$('reply-bar').classList.contains('visible');
}

/* ── SEND MESSAGE ── */
async function sendMessage(){
  const input=$('msg-input'),text=input.value.trim();
  if(!text&&!pendingFile)return;
  if(!currentCh)return;
  if(text.length>MAX_CHARS){toast(`Слишком длинное сообщение (макс. ${MAX_CHARS})`,'err');return;}
  const chId=currentCh.id;                 // фиксируем чат: пока грузится файл, пользователь мог перейти в другой
  clearTyping();

  let attachData={};
  if(pendingFile){
    const file=pendingFile;pendingFile=null;$('btn-send').disabled=true;
    try{
      const path=`pulsar/${chId}/${Date.now()}_${file.name}`;
      const storRef=sRef(storage,path);
      uploadTask=uploadBytesResumable(storRef,file);
      await new Promise((res,rej)=>{uploadTask.on('state_changed',s=>{$('upload-fill').style.width=(s.bytesTransferred/s.totalBytes*100)+'%';},rej,async()=>{const url=await getDownloadURL(uploadTask.snapshot.ref);attachData={attachmentUrl:url,attachmentName:file.name,attachmentSize:fmtSize(file.size),attachmentType:file.type.startsWith('image/')?'image':'file'};res();});});
    }catch(e){if(e?.code!=='storage/canceled')toast('Ошибка загрузки: '+e.message,'err');$('btn-send').disabled=false;return;}
    cancelUpload();
  }

  input.value='';ar(input);$('btn-send').disabled=true;$('char-count').textContent='';
  const payload={text:text||'',authorId:me.uid,authorName:me.displayName||me.email,ts:serverTimestamp(),clientTs:Date.now(),edited:false,deleted:false,pinned:false,reactions:{},replyTo:replyTo||null,threadCount:0,...attachData};
  clearReply();
  try{
    await addDoc(collection(fdb,'pulsar_channels',chId,'messages'),payload);
  }catch(e){toast('Ошибка отправки: '+e.message,'err');input.value=text;ar(input);$('btn-send').disabled=false;return;}
  // Превью в списке чатов — отдельно: сбой тут не должен возвращать текст в поле (получился бы дубль)
  updateDoc(doc(fdb,'pulsar_channels',chId),{lastMessage:{text:(text||'Файл').slice(0,80),authorId:me.uid,authorName:me.displayName||me.email,attachmentType:attachData.attachmentType||null,ts:serverTimestamp()}}).catch(e=>console.error('lastMessage:',e));
}

function clearReply(){replyTo=null;$('reply-bar').classList.remove('visible');$('reply-to-name').textContent='';$('reply-preview').textContent='';updateInputRadius();}

/* ── THREAD ── */
function openThread(msgId){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  threadMsgId=msgId;
  $('shell').classList.add('thread-open');
  $('thread-panel').classList.add('open');
  const user=allUsers[msg.authorId]||{};
  const avI=user.photoURL?`<img src="${esc(user.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit"/>`:esc(ini(msg.authorName));
  $('thread-root').innerHTML=`<div class="thread-root-author">${avI} ${esc(msg.authorName)} <span class="thread-root-time">${fmtT({toDate:()=>msgTs(msg)})}</span></div><div class="thread-root-text">${renderText(msg.text||'[Вложение]')}</div>`;
  if(threadUnsub)threadUnsub();
  const tq=query(collection(fdb,'pulsar_channels',currentCh.id,'messages',msgId,'thread'),orderBy('clientTs','asc'));
  const tmList=$('thread-msgs');
  threadUnsub=onSnapshot(tq,snap=>{
    const replies=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!replies.length){tmList.innerHTML='<div style="padding:20px;font-size:var(--fs-xs);color:var(--muted);text-align:center">Ответов пока нет<br><span style="font-size:var(--fs-2xs);color:var(--muted-2)">Напишите первый</span></div>';return;}
    tmList.innerHTML=replies.map(r=>{
      const u=allUsers[r.authorId]||{};
      const avI2=u.photoURL?`<img src="${esc(u.photoURL)}" alt=""/>`:esc(ini(r.authorName));
      return`<div class="thread-reply-row"><div class="thread-reply-av">${avI2}</div><div class="thread-reply-body"><div class="thread-reply-meta"><span class="thread-reply-author">${esc(r.authorName)}</span><span class="thread-reply-time">${fmtT(r.ts||{toDate:()=>new Date(r.clientTs)})}</span></div><div class="thread-reply-text">${renderText(r.text||'')}</div></div></div>`;
    }).join('');
    requestAnimationFrame(()=>{tmList.scrollTop=tmList.scrollHeight;});
  });
}
function closeThread(){$('shell').classList.remove('thread-open');$('thread-panel').classList.remove('open');if(threadUnsub){threadUnsub();threadUnsub=null;}threadMsgId=null;}
async function sendThreadReply(){
  const input=$('thread-input'),text=input.value.trim();
  if(!text||!currentCh||!threadMsgId)return;
  input.value='';ar(input);$('thread-send').disabled=true;
  try{
    await addDoc(collection(fdb,'pulsar_channels',currentCh.id,'messages',threadMsgId,'thread'),{text,authorId:me.uid,authorName:me.displayName||me.email,ts:serverTimestamp(),clientTs:Date.now()});
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',threadMsgId),{threadCount:increment(1)});
  }catch(e){toast('Ошибка: '+e.message,'err');}
  $('thread-send').disabled=false;
}

/* ── MENTION AUTOCOMPLETE ── */
function openMentionPopup(query){
  const popup=$('mention-popup');
  const ql=query.toLowerCase();
  mentionMatches=Object.values(allUsers).filter(u=>u.uid!==me.uid&&((u.displayName||'').toLowerCase().includes(ql)||(u.email||'').toLowerCase().includes(ql))).slice(0,6);
  if(!mentionMatches.length){popup.classList.remove('open');return;}
  mentionIdx=0;
  popup.innerHTML=mentionMatches.map((u,i)=>{
    const pr=u.presence?.status||'offline';
    const avI=u.photoURL?`<img src="${esc(u.photoURL)}" alt=""/>`:ini(u.displayName||u.email);
    return`<div class="mention-item ${i===0?'active':''}" data-idx="${i}"><div class="mention-av">${avI}</div><div><div class="mention-name">${esc(u.displayName||'—')}</div><div class="mention-email">${esc(u.email||'')}</div></div>${pr==='online'?'<span class="mention-online"></span>':''}</div>`;
  }).join('');
  popup.classList.add('open');
  popup.querySelectorAll('.mention-item').forEach(el=>el.addEventListener('click',()=>insertMention(parseInt(el.dataset.idx))));
}
function closeMentionPopup(){$('mention-popup').classList.remove('open');mentionIdx=-1;mentionMatches=[];}
function insertMention(idx){
  const u=mentionMatches[idx];if(!u)return;
  const input=$('msg-input');const val=input.value;
  const at=val.lastIndexOf('@');
  if(at<0){closeMentionPopup();return;}
  input.value=val.slice(0,at)+'@'+(u.displayName||u.email)+' ';
  input.focus();ar(input);
  closeMentionPopup();
}
function updateMentionHighlight(){
  const popup=$('mention-popup');
  popup.querySelectorAll('.mention-item').forEach((el,i)=>el.classList.toggle('active',i===mentionIdx));
}

function fillProfileModal(u, isOwn){
  const avEl = $('profile-av-big');
  avEl.textContent = '';
  if(u.photoURL){ avEl.innerHTML = `<img src="${esc(u.photoURL)}" alt=""/>`; }
  else { avEl.textContent = ini(u.displayName||u.email); }

  const st = u.presence?.status || (isOwn ? me.presence?.status : null) || 'offline';
  $('prof-av-status').className = `prof-av-status ${st}`;

  $('profile-display-name').textContent = u.displayName || u.email || '—';
  const emailVal = u.email || '';
  const sub = [emailVal.includes('@') ? emailVal : '', u.role==='admin' ? 'администратор' : ''].filter(Boolean);
  $('profile-email-label').textContent = sub.join(' · ');

  // Био показываем только чужое (своё редактируется в форме ниже)
  $('prof-bio-view').textContent = isOwn ? '' : (u.bio || '');

        <div style="font-size:var(--fs-2xs);color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${emailHl}${prLabel?' · '+prLabel:''}</div>
      </div>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="color:var(--muted-2);flex-shrink:0">
        <path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>`;
  }).join('');

  list.querySelectorAll('.sh-user-row').forEach(el => {
    el.addEventListener('mouseenter', () => el.style.background = 'var(--surface-3)');
    el.addEventListener('mouseleave', () => el.style.background = '');
    el.addEventListener('click', () => {
      Sheet.close('search');
      openUserProfile(el.dataset.uid);
    });
  });
}

/* ── MODAL / SIDEBAR ── */
function openModal(id){$(id)?.classList.add('open');}
function closeModal(id){$(id)?.classList.remove('open');}
const _allViews=['no-channel','conversation','view-rooms','view-groups'];
function showView(id){
  _allViews.forEach(v=>{ const el=$(v); if(!el)return; el.style.display=(v===id)?'flex':'none'; });
  // Общий топбар виден везде, кроме переписки — там свой .topbar
  const tp=$('main-topbar');
  if(tp) tp.style.display=(id==='conversation')?'none':'';
  // В переписке нижняя навигация скрыта (см. body.in-chat в CSS)
  document.body.classList.toggle('in-chat',id==='conversation');
  closeMsgMenu();
}
function openSidebar(){ showView('no-channel'); setNavActive('mob-btn-dms'); }
function setNavActive(id){ document.querySelectorAll('.mob-nav-btn').forEach(b=>b.classList.remove('active')); $(id)?.classList.add('active'); }
function closeSidebar(){}

/* ── INIT UI ── */
function initUI(){
  const input=$('msg-input');
  initMessageEvents();
  bindChatListEvents();

  // Scroll btn
  let scrollRaf=0;
  $('msg-list').addEventListener('scroll',()=>{
    if(scrollRaf)return;
    scrollRaf=requestAnimationFrame(()=>{
      scrollRaf=0;
      if(isNearBottom()){newMsgCount=0;updateScrollBtn();$('scroll-btn').classList.remove('show');document.title='Pulsar — Galelium';}
      else $('scroll-btn').classList.add('show');
    });
  },{passive:true});

  // Input core
  input.addEventListener('input',()=>{
    ar(input);
    const len=input.value.length;
    $('btn-send').disabled=!input.value.trim()&&!pendingFile;
    // Char count
    const cc=$('char-count');
    if(len>3200){cc.textContent=`${len}/${MAX_CHARS}`;cc.className='char-count '+(len>MAX_CHARS?'over':'warn');}
    else cc.textContent='';
    // Typing
    clearTimeout(typingTimer);
    if(input.value.trim()){broadcastTyping();typingTimer=setTimeout(clearTyping,4000);}
    // Mention detection
    const val=input.value,cursor=input.selectionStart;
    const before=val.slice(0,cursor);
    const atMatch=before.match(/@([^\s]*)$/);
    if(atMatch&&usersLoaded){openMentionPopup(atMatch[1]);}
    else closeMentionPopup();
  });

  input.addEventListener('keydown',e=>{
    // Mention navigation
    if($('mention-popup').classList.contains('open')){
      if(e.key==='ArrowDown'){e.preventDefault();mentionIdx=Math.min(mentionIdx+1,mentionMatches.length-1);updateMentionHighlight();return;}
      if(e.key==='ArrowUp'){e.preventDefault();mentionIdx=Math.max(mentionIdx-1,0);updateMentionHighlight();return;}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertMention(mentionIdx);return;}
      if(e.key==='Escape'){closeMentionPopup();return;}
    }
    if((e.key==='Enter'&&!e.shiftKey)||(e.key==='Enter'&&e.ctrlKey)){e.preventDefault();sendMessage();}
  });

  input.addEventListener('blur',()=>setTimeout(closeMentionPopup,150));

  $('btn-send').addEventListener('click',sendMessage);
  $('reply-close').addEventListener('click',clearReply);

  // Emoji

  // File
  $('file-input').addEventListener('change',e=>{if(e.target.files[0])handleFileSelect(e.target.files[0]);});
  $('upload-cancel').addEventListener('click',cancelUpload);
  document.addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(f&&currentCh)handleFileSelect(f);});

  // Drag & drop
  const main=$('main');
  let dragCounter=0;
  main.addEventListener('dragenter',e=>{e.preventDefault();dragCounter++;if(currentCh)$('drag-overlay').classList.add('active');});
  main.addEventListener('dragleave',()=>{dragCounter--;if(dragCounter<=0){dragCounter=0;$('drag-overlay').classList.remove('active');}});
  main.addEventListener('dragover',e=>e.preventDefault());
  main.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;$('drag-overlay').classList.remove('active');const f=e.dataTransfer.files[0];if(f&&currentCh)handleFileSelect(f);});

  // ── Call Sheet ───────────────────────────────────────────────
  Sheet.define({ id: 'call', title: 'Звонок', zIndex: 650 });
  Sheet.body('call').innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 40px;text-align:center">
      <div style="width:68px;height:68px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 012 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
        </svg>
      </div>
      <div style="font-family:var(--font-display);font-weight:800;font-size:var(--fs-xl);color:var(--text)">Скоро</div>
      <div style="font-size:var(--fs-xs);color:var(--muted);max-width:210px;line-height:1.7">Голосовые звонки появятся в следующем обновлении Pulsar</div>
    </div>
  `;
  $('btn-call')?.addEventListener('click', () => Sheet.open('call'));

  // ── Video Sheet (заглушка) ───────────────────────────────────
  Sheet.define({ id: 'video', title: 'Видеозвонок', zIndex: 650 });
  Sheet.body('video').innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 40px;text-align:center">
      <div style="width:68px;height:68px;background:var(--accent-dim);border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--accent)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5" fill="currentColor" fill-opacity=".14"/><path d="M15.5 10.5l4.9-3a.6.6 0 01.9.5v8a.6.6 0 01-.9.5l-4.9-3"/></svg>
      </div>
      <div style="font-family:var(--font-display);font-weight:800;font-size:var(--fs-xl);color:var(--text)">Скоро</div>
      <div style="font-size:var(--fs-xs);color:var(--muted);max-width:210px;line-height:1.7">Видеозвонки появятся в следующем обновлении Pulsar</div>
    </div>
  `;
  $('btn-video')?.addEventListener('click', () => Sheet.open('video'));

  // Compose btn — открывает sheet поиска аккаунтов
  Sheet.define({
    id:     'search',
    title:  'Поиск аккаунтов',
    zIndex: 700,
    onOpen: () => {
      _renderUserSearch('');
      setTimeout(() => document.getElementById('sh-search-inp')?.focus(), 80);
    },
  });

  Sheet.body('search').innerHTML = `
    <div style="padding:12px 16px 10px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px;background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 13px;transition:border-color .14s" id="sh-search-box">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--muted-2);flex-shrink:0">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input id="sh-search-inp"
          placeholder="Поиск по email…"
          autocomplete="off" autocapitalize="none" spellcheck="false"
          style="flex:1;background:none;border:none;outline:none;font-size:var(--fs-sm);color:var(--text);caret-color:var(--accent);font-family:var(--font)"
        />
        <button id="sh-search-clear" style="display:none;color:var(--muted-2);padding:0;line-height:1;background:none;border:none;cursor:pointer;font-size:var(--fs-md)">✕</button>
      </div>
    </div>
    <div id="sh-user-list" style="flex:1;overflow-y:auto;padding:0 8px 16px"></div>
  `;

  // focus border
  const shBox = document.getElementById('sh-search-box');
  const shInp = document.getElementById('sh-search-inp');
  const shClear = document.getElementById('sh-search-clear');
  shInp?.addEventListener('focus', () => shBox.style.borderColor = 'var(--accent-mid)');
  shInp?.addEventListener('blur',  () => shBox.style.borderColor = 'var(--border)');
  shInp?.addEventListener('input', e => {
    const v = e.target.value;
    shClear.style.display = v ? '' : 'none';
    _renderUserSearch(v);
  });
  shClear?.addEventListener('click', () => {
    shInp.value = '';
    shClear.style.display = 'none';
    _renderUserSearch('');
    shInp.focus();
  });

  $('btn-compose')?.addEventListener('click', () => Sheet.open('search'));

  // Поиск по чатам и людям (строка над списком)
  const csi = $('chat-search-input');
  csi?.addEventListener('input', e => setChatSearch(e.target.value));
  csi?.addEventListener('keydown', e => {
    if(e.key==='Enter') csi.blur();
    else if(e.key==='Escape') clearChatSearch();
  });
  $('chat-search-x')?.addEventListener('click', () => { clearChatSearch(); csi?.focus(); });

  // DM

  // Search
  // Аватар/имя и кнопка ⋮ → профиль собеседника (DM) или участники (канал)
  const openChatInfo = () => {
    if (!currentCh) return;
    if (currentCh.type === 'direct') {
      const oid = (currentCh.members || []).find(u => u !== me.uid);
      if (oid) openUserProfile(oid);
    } else {
      openMembers();
    }
  };
  $('btn-chat-menu')?.addEventListener('click', openChatInfo);
  $('topbar-who')?.addEventListener('click', openChatInfo);

  // Pinned
  $('pinned-bar').addEventListener('click', () => {
    const p = pinnedMsgs[0]; if (!p) return;
    const g = document.querySelector(`.msg-group[data-msgid="${p.id}"]`);
    if (!g) { toast('Сообщение вне загруженной истории','ok'); return; }
    g.scrollIntoView({behavior:'smooth', block:'center'});
    g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 1400);
  });
  $('pinned-bar-close').addEventListener('click',e=>{e.stopPropagation();$('pinned-bar').classList.remove('visible');});



  // ── Members Sheet ────────────────────────────────────────────
  Sheet.define({ id: 'members', title: 'Участники', zIndex: 700 });
  Sheet.body('members').innerHTML = '<div id="sh-members-list" style="flex:1;overflow-y:auto;padding:0 8px"></div>';
  $('sh-members-list').addEventListener('click', e => {
    const el = e.target.closest('[data-uid]');
    if (el) openUserProfile(el.dataset.uid);
  });

  // ── Profile Sheet ────────────────────────────────────────────
  Sheet.define({
    id:     'profile',
    title:  'Профиль',
    zIndex: 800,
  });

  Sheet.body('profile').innerHTML = `
    <div class="prof-head">
      <div class="prof-av-wrap" id="prof-av-wrap">
        <div class="prof-av-inner" id="profile-av-big">?</div>
        <div class="prof-av-status offline" id="prof-av-status"></div>
      </div>
      <div class="prof-name" id="profile-display-name">—</div>
      <div class="prof-sub" id="profile-email-label"></div>
      <div class="prof-bio" id="prof-bio-view"></div>
    </div>

    <!-- Чужой профиль -->
    <div class="prof-actions" id="prof-other-actions" style="display:none">
      <button class="prof-action-btn" id="prof-btn-dm">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 8V3a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H9l-3 2v-2H3a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Написать
      </button>
    </div>

    <!-- Свой профиль -->
    <div class="prof-pad" id="profile-own">
      <div class="prof-status-btns" id="profile-status-row">
        <button class="prof-status-btn online"  data-s="online"><span class="prof-sdot"></span>В сети</button>
        <button class="prof-status-btn away"    data-s="away"><span class="prof-sdot"></span>Отошёл</button>
        <button class="prof-status-btn offline" data-s="offline"><span class="prof-sdot"></span>Не беспокоить</button>
      </div>
      <div>
        <div class="prof-field">
          <label for="profile-name-input">Имя</label>
          <input id="profile-name-input" placeholder="Ваше имя" autocomplete="off"/>
        </div>
        <div class="prof-field">
          <label for="profile-bio-input">О себе</label>
          <textarea id="profile-bio-input" placeholder="Пара слов о себе" rows="2"></textarea>
        </div>
        <div class="prof-field">
          <label for="profile-avatar-url">Ссылка на аватар</label>
          <input id="profile-avatar-url" placeholder="https://…" type="url"/>
        </div>
      </div>
    </div>

    <div class="prof-foot" id="profile-foot">
      <button class="btn btn-ghost" id="btn-logout" style="margin-right:auto;color:var(--muted);font-size:var(--fs-xs)" title="Выйти из аккаунта">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" style="margin-right:5px"><path d="M9.5 4.5L12 7l-2.5 2.5M12 7H5.5M7 2H3a1 1 0 00-1 1v8a1 1 0 001 1h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Выйти
      </button>
      <button class="btn btn-primary" id="btn-save-profile">Сохранить</button>
    </div>
  `;

  // Profile triggers
  $('btn-my-profile')?.addEventListener('click',openMyProfile);
  $('my-avatar')?.addEventListener('click',openMyProfile);
  $('mob-btn-profile').addEventListener('click',openMyProfile);
  // Sheet controls (элементы находятся внутри sheet-body, уже в DOM)
  $('btn-save-profile').addEventListener('click', saveProfile);
  // Статус-кнопки в профиле
  document.querySelectorAll('.prof-status-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.prof-status-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    manualStatus=b.dataset.s==='online'?null:b.dataset.s;
    updatePresence(b.dataset.s);
    if(me.presence) me.presence.status=b.dataset.s; else me.presence={status:b.dataset.s};
  }));


  // Thread
  $('thread-close').addEventListener('click',closeThread);
  const ti=$('thread-input');
  ti.addEventListener('input',()=>{ar(ti);$('thread-send').disabled=!ti.value.trim();});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendThreadReply();}});
  $('thread-send').addEventListener('click',sendThreadReply);

  // Lightbox
  $('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox();});
  $('lightbox-close').addEventListener('click',closeLightbox);

  // Mute (button optional — may be absent)
  $('btn-mute')?.addEventListener('click',()=>{
    if(!currentCh){toast('Выберите канал','err');return;}
    const id=currentCh.id;
    if(mutedChannels.has(id)){mutedChannels.delete(id);$('btn-mute')?.classList.remove('active');toast('Уведомления включены','ok');}
    else{mutedChannels.add(id);$('btn-mute')?.classList.add('active');toast('Уведомления выключены','ok');}
    localStorage.setItem('p_muted',JSON.stringify([...mutedChannels]));
  });

  // Modals close
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.modal)));
  document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov.id);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('lightbox').classList.contains('open')){closeLightbox();return;}document.querySelectorAll('.modal-overlay.open').forEach(el=>closeModal(el.id));}});

  // Reset title on focus
  window.addEventListener('focus',()=>{document.title='Pulsar — Galelium';});

  // Navigation
  $('btn-back-to-chats').addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-dms')?.addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-channels')?.addEventListener('click',()=>{ setNavActive('mob-btn-channels'); clearChatSearch(); showView('view-rooms'); });
  $('mob-btn-new')?.addEventListener('click',()=>{ setNavActive('mob-btn-new'); showView('view-groups'); });

  // Logout
  $('btn-logout')?.addEventListener('click',async()=>{
    if(!confirm('Выйти из Pulsar?'))return;
    await updatePresence('offline');clearTyping();
    // Убираем FCM-токен этого устройства из профиля, чтобы пуши не приходили после выхода
    // (только если там лежит именно наш токен — токен другого устройства не трогаем)
    try{
      const tok=window._myFcmToken;
      if(tok&&me){const r=doc(fdb,'users',me.uid);const s=await getDoc(r);
        if(s.exists()&&s.data().fcmToken===tok)await setDoc(r,{fcmToken:null},{merge:true});}
    }catch(e){}
    try{window.AndroidBridge?.onLogout?.();}catch(e){}   // Android: сбросить UID для FcmTokenWorker
    await signOut(auth);location.replace('login.html');
  });
}
</script>
