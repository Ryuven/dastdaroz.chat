/* ── OPEN CHANNEL ── */
async function openChannel(chId){
  if(currentCh?.id===chId){showView('conversation');return;}
  if(msgUnsub){msgUnsub();msgUnsub=null;}
  closeThread();clearTyping();
  replyTo=null;
  delete unreadCounts[chId];
  knownMsgIds=new Set();currentMsgs=[];newMsgCount=0;
  updateScrollBtn();

  // ── Сразу открываем чат, без ожидания ──
  _openingChId=chId;
  showView('conversation');
  $('ch-name').textContent='…';
  $('ch-desc').textContent='';
  $('msg-list').innerHTML='<div style="padding:28px;text-align:center;color:var(--muted);font-size:.75rem">Загрузка…</div>';
  clearReply();cancelUpload();
  closeSidebar();
  setTimeout(()=>$('msg-input').focus(),150);

  // ── Грузим данные канала в фоне ──
  let chData;
  try{const s=await getDoc(doc(fdb,'pulsar_channels',chId));if(!s.exists()){toast('Канал не найден','err');openSidebar();return;}chData={id:s.id,...s.data()};}
  catch(e){toast('Ошибка: '+e.message,'err');openSidebar();return;}
  // Если пользователь уже открыл другой чат пока грузилось — выходим
  if(_openingChId!==chId) return;
  currentCh=chData;
  if(chData.type==='direct'){
    const oid=(chData.members||[]).find(u=>u!==me.uid),o=allUsers[oid]||{};
    $('ch-icon').textContent='@';$('ch-name').textContent=o.displayName||o.email||'DM';$('ch-desc').textContent='';
  }else{
    $('ch-icon').textContent=chData.type==='private'?'🔒':'#';
    $('ch-name').textContent=chData.name||'';$('ch-desc').textContent=chData.description||'';
  }
  document.querySelectorAll('.ch-card').forEach(el=>el.classList.toggle('active',el.dataset.chid===chId));
  loadPinnedMsgs(chId);
  startMessageListener(chId);
  startTypingListener(chId);
}

/* ── MESSAGE LISTENER (incremental) ── */
function startMessageListener(chId){
  const list=$('msg-list');
  list.innerHTML='<div style="padding:28px;text-align:center;color:var(--muted);font-size:.75rem">Загрузка…</div>';
  const q=query(collection(fdb,'pulsar_channels',chId,'messages'),orderBy('clientTs','asc'),limit(150));
  let first=true;
  msgUnsub=onSnapshot(q,snap=>{
    // Incremental: only process changes
    snap.docChanges().forEach(change=>{
      const m={id:change.doc.id,chId,...change.doc.data()};
      if(change.type==='added'){
        if(!knownMsgIds.has(m.id)){
          knownMsgIds.add(m.id);
          if(!first){
            // New message arrived after initial load
            const isNew=(m.clientTs||0)>firstLoadTs;
            appendMessage(m,isNew);
            if(m.authorId!==me.uid&&isNew){
              showInAppNotif(m,currentCh?.name||'DM');
              document.title='(!) Pulsar — Galelium';
              if(!isNearBottom()){newMsgCount++;updateScrollBtn();}
            }
          }
        }
      } else if(change.type==='modified'){
        // Update existing message in-place
        const m2={id:change.doc.id,...change.doc.data()};
        const idx=currentMsgs.findIndex(x=>x.id===m2.id);
        if(idx>=0)currentMsgs[idx]=m2;
        updateMessageEl(m2);
      }
    });
    if(first){
      // Initial batch — full render
      currentMsgs=snap.docs.map(d=>({id:d.id,chId,...d.data()}));
      currentMsgs.forEach(m=>knownMsgIds.add(m.id));
      firstLoadTs=Date.now();
      fullRender(currentMsgs);
      scrollBot();
      first=false;
    }else{
      // Keep currentMsgs in sync for additions
      const ids=new Set(currentMsgs.map(m=>m.id));
      snap.docChanges().filter(c=>c.type==='added').forEach(c=>{
        const m2={id:c.doc.id,chId,...c.doc.data()};
        if(!ids.has(m2.id))currentMsgs.push(m2);
      });
    }
  },e=>{list.innerHTML=`<div style="padding:20px;color:var(--red);font-size:.75rem;text-align:center">Ошибка: ${esc(e.message)}</div>`;});
}

/* ── FULL RENDER (initial) ── */
function fullRender(msgs){
  const list=$('msg-list');
  if(!msgs.length){list.innerHTML='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:40px;text-align:center"><div style="font-size:2.4rem">💬</div><div style="font-size:.8rem;font-weight:500">Напишите первое сообщение!</div><div style="font-size:.72rem;color:var(--muted-2)">Это начало вашего общения в этом канале</div></div>';return;}
  list.innerHTML='';
  let pDate='',pAId='',pTs=0;
  msgs.forEach((msg,i)=>{
    const ts=msgTs(msg);
    const dk=ts.toDateString();
    if(dk!==pDate){list.appendChild(makeDateDiv(ts));pDate=dk;pAId='';}
    const grouped=shouldGroup(msg,pAId,pTs);
    list.appendChild(makeMsgEl(msg,grouped,false));
    pAId=msg.authorId;pTs=msg.clientTs||0;
  });
  bindMsgEvents(list);
}

/* ── APPEND NEW MESSAGE (incremental) ── */
function appendMessage(msg,animate){
  const list=$('msg-list');
  const ts=msgTs(msg);
  const dk=ts.toDateString();
  // Надёжная проверка: берём дату последнего date-div из DOM
  // (не lastElementChild — он может быть msg-group)
  const allDateDivs=list.querySelectorAll('.date-div');
  const lastDateDivDate=allDateDivs.length ? allDateDivs[allDateDivs.length-1].dataset.date : null;
  if(lastDateDivDate!==dk){
    const dd=makeDateDiv(ts);
    list.appendChild(dd);
  }
  // Берём предыдущее сообщение по msgId последнего msg-group в DOM
  // (надёжнее чем индекс массива, т.к. currentMsgs мог обновиться)
  const lastGroup=list.querySelector('.msg-group:last-of-type');
  const lastMsgId=lastGroup?.dataset.msgid;
  const lastMsg=lastMsgId ? currentMsgs.find(m=>m.id===lastMsgId) : null;
  const grouped=lastMsg&&shouldGroup(msg,lastMsg.authorId,lastMsg.clientTs||0)&&!msg.replyTo;
  const el=makeMsgEl(msg,grouped,animate);
  list.appendChild(el);
  bindMsgEvents(el);
  if(isNearBottom())scrollBot();
}

/* ── UPDATE SINGLE MESSAGE EL ── */
function updateMessageEl(msg){
  const group=document.querySelector(`.msg-group[data-msgid="${msg.id}"]`);
  if(!group)return;

  // 1. Текст — обновляем только текстовый узел, сохраняем tsInline
  const textEl=group.querySelector('.msg-text[data-msgid]');
  if(textEl){
    if(msg.deleted){
      textEl.textContent='Сообщение удалено';
      textEl.className='msg-text deleted';
    } else {
      // Сохраняем tsInline если есть
      const tsSpan=textEl.querySelector('.msg-ts-inline');
      textEl.innerHTML=renderText(msg.text||'');
      if(tsSpan) textEl.appendChild(tsSpan.cloneNode(true));
    }
  }

  // 2. Реакции — ищем в msg-bubble-wrap
  const bubbleWrap=group.querySelector('.msg-bubble-wrap');
  if(!bubbleWrap) return;
  const reactWrap=bubbleWrap.querySelector('.msg-reactions');
  const rl=(['👍','❤️','🔥','😂','😮']).filter(e=>(msg.reactions||{})[e]?.length);
  if(rl.length){
    const newReact=document.createElement('div');
    newReact.className='msg-reactions';
    newReact.innerHTML=rl.map(e=>`<button class="reaction-btn ${(msg.reactions[e]||[]).includes(me.uid)?'active':''}" data-msgid="${esc(msg.id)}" data-emoji="${e}">${e}<span class="reaction-count">${msg.reactions[e].length}</span></button>`).join('');
    if(reactWrap) reactWrap.replaceWith(newReact);
    else bubbleWrap.appendChild(newReact);
    // Привязываем события
    newReact.querySelectorAll('.reaction-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleReact(b.dataset.msgid,b.dataset.emoji);}));
  } else if(reactWrap){
    reactWrap.remove();
  }

  // 3. Тег "изменено"
  const meta=group.querySelector('.msg-meta');
  if(meta&&msg.edited&&!meta.querySelector('.msg-edited-tag')){
    meta.insertAdjacentHTML('beforeend','<span class="msg-edited-tag">(изм.)</span>');
  }

  // 4. Перепривязываем клик на пузырёк (на случай перерисовки)
  const bubble=group.querySelector('.msg-bubble');
  if(bubble && !bubble._clickBound){
    bubble._clickBound=true;
    bubble.addEventListener('click',e=>{
      e.stopPropagation();
      const wasOpen=group.classList.contains('actions-open');
      document.querySelectorAll('.msg-group.actions-open').forEach(g=>g.classList.remove('actions-open'));
      if(!wasOpen) group.classList.add('actions-open');
    });
  }
}

function makeMsgEl(msg, grouped, animate){
  const isMe = msg.authorId === me.uid;

  // Мета: для каналов — всегда у первого; для DM — только у чужих первых

    <span class="msg-author${isMe?' is-me':''}" data-uid="${esc(msg.authorId)}">${esc(msg.authorName)}</span>

    ${msg.pinned?'<span class="msg-pinned-tag">📌</span>':''}

  // Время внутри пузырька (малое, справа внизу) — для своих и при группировке

  const textHtml = msg.deleted
    ? '<div class="msg-text deleted">Сообщение удалено</div>'
    : `<div class="msg-text" data-msgid="${esc(msg.id)}">${renderText(msg.text||'')}${tsInline}</div>`;

  const reactHtml = rl.length ? `<div class="msg-reactions">${rl.map(e=>
    `<button class="reaction-btn ${react[e]?.includes(me.uid)?'active':''}" data-msgid="${esc(msg.id)}" data-emoji="${e}">${e}<span class="reaction-count">${react[e].length}</span></button>`

  const threadHtml = threadCount > 0 && !msg.deleted

        <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M1 8V3a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H9l-3 2v-2H3a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>

          <span class="msg-reply-author">${esc(msg.replyTo.authorName)}</span>

        </div>

    </div>
    <div class="msg-actions">
      ${REACT5.slice(0,3).map(e=>`<button class="msg-action-btn react-quick" data-msgid="${esc(msg.id)}" data-emoji="${e}" title="${e}">${e}</button>`).join('')}
      <div class="msg-action-sep"></div>
      <button class="msg-action-btn" data-action="reply" data-msgid="${esc(msg.id)}" title="Ответить"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 8V5a4 4 0 014-4h6M1 8l3-3M1 8l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="msg-action-btn" data-action="thread" data-msgid="${esc(msg.id)}" title="Тред"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 8V3a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H9l-3 2v-2H3a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <button class="msg-action-btn ${msg.pinned?'pin-active':''}" data-action="pin" data-msgid="${esc(msg.id)}" data-pinned="${msg.pinned?1:0}" title="${msg.pinned?'Открепить':'Закрепить'}"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9 1L13 5l-3.5 1L6 9.5 5 13 1 9l3.5-1L8 4.5 9 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M1 13l3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>

      <button class="msg-action-btn" data-action="edit" data-msgid="${esc(msg.id)}" title="Редактировать"><svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5a1.5 1.5 0 012 2L4 10H2v-2l6.5-6.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="msg-action-btn danger" data-action="delete" data-msgid="${esc(msg.id)}" title="Удалить"><svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M4 3V2h4v1M10 3l-.8 7H2.8L2 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>`:''}

function bindMsgEvents(root){
  // Клик на пузырёк — показать/скрыть тулбар
  root.querySelectorAll('.msg-bubble').forEach(bubble=>{
    if(bubble._clickBound) return;
    bubble._clickBound=true;
    bubble.addEventListener('click', e=>{
      e.stopPropagation();
      const group=bubble.closest('.msg-group');
      const wasOpen=group.classList.contains('actions-open');
      document.querySelectorAll('.msg-group.actions-open').forEach(g=>g.classList.remove('actions-open'));
      if(!wasOpen) group.classList.add('actions-open');
    });
  });
  root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();msgAction(b.dataset.action,b.dataset.msgid,b.dataset.pinned==='1');}));
  root.querySelectorAll('.react-quick,.reaction-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleReact(b.dataset.msgid,b.dataset.emoji);}));
  root.querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click',()=>{const t=document.querySelector(`[data-msgid="${el.dataset.scroll}"]`);if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}));
  root.querySelectorAll('[data-lightbox]').forEach(img=>img.addEventListener('click',()=>openLightbox(img.dataset.lightbox)));
  root.querySelectorAll('.msg-thread-btn').forEach(b=>b.addEventListener('click',()=>openThread(b.dataset.msgid)));
  root.querySelectorAll('[data-uid]').forEach(el=>el.addEventListener('click',e=>{if(e.target.dataset.uid)openUserProfile(e.target.dataset.uid);}));
  root.querySelectorAll('.code-copy').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    navigator.clipboard.writeText(b.dataset.code||'').then(()=>{b.textContent='Скопировано';b.classList.add('copied');setTimeout(()=>{b.textContent='Скопировать';b.classList.remove('copied');},2000);});
  }));
}

// Клик вне сообщения — закрыть тулбар
document.addEventListener('click',()=>{
  document.querySelectorAll('.msg-group.actions-open').forEach(g=>g.classList.remove('actions-open'));
});

/* ── SCROLL BOTTOM ── */
function isNearBottom(){const l=$('msg-list');return l.scrollHeight-l.scrollTop-l.clientHeight<160;}
function scrollBot(){requestAnimationFrame(()=>{const l=$('msg-list');l.scrollTop=l.scrollHeight;newMsgCount=0;updateScrollBtn();});}
function updateScrollBtn(){
  const btn=$('scroll-btn'),badge=$('scroll-btn-badge');
  if(newMsgCount>0){badge.textContent=newMsgCount;badge.classList.add('show');}else badge.classList.remove('show');
}
$('scroll-btn').addEventListener('click',()=>{newMsgCount=0;scrollBot();});

/* ── PINNED ── */
async function loadPinnedMsgs(chId){
  try{const snap=await getDocs(query(collection(fdb,'pulsar_channels',chId,'messages'),where('pinned','==',true),orderBy('clientTs','desc'),limit(10)));pinnedMsgs=snap.docs.map(d=>({id:d.id,...d.data()}));updatePinnedBar();}
  catch(e){pinnedMsgs=[];updatePinnedBar();}
}
function updatePinnedBar(){
  const bar=$('pinned-bar');
  if(!pinnedMsgs.length){bar.classList.remove('visible');return;}
  bar.classList.add('visible');const p=pinnedMsgs[0];
  $('pinned-bar-author').textContent=p.authorName||'';
  $('pinned-bar-text').textContent=(p.text||'Вложение').slice(0,80);
}
async function pinMessage(msgId,isPinned){
  if(!currentCh)return;
  try{await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{pinned:!isPinned});toast(isPinned?'Откреплено':'Закреплено ✓','ok');loadPinnedMsgs(currentCh.id);}
  catch(e){toast('Ошибка: '+e.message,'err');}
}

/* ── MESSAGE ACTIONS ── */
function msgAction(action,msgId,isPinned=false){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  if(action==='reply'){replyTo={id:msg.id,text:msg.text||'',authorName:msg.authorName};$('reply-bar').classList.add('visible');updateInputRadius();$('reply-to-name').textContent=msg.authorName;$('reply-preview').textContent=(msg.text||'Вложение').slice(0,80);$('msg-input').focus();}
  if(action==='edit'&&msg.authorId===me.uid&&!msg.deleted){msg._prevText=msg.text;startEdit(msgId,msg.text||'');}
  if(action==='delete'&&msg.authorId===me.uid){if(!confirm('Удалить сообщение?'))return;delMsg(msgId);}
  if(action==='pin')pinMessage(msgId,isPinned);
  if(action==='thread')openThread(msgId);
}
function startEdit(msgId,text){
  cancelEdit();editingId=msgId;
  // Ищем текстовый элемент внутри пузырька
  const el=document.querySelector(`.msg-bubble .msg-text[data-msgid="${msgId}"]`);if(!el)return;
  const w=document.createElement('div');w.className='msg-edit-wrap';w.dataset.editwrap=msgId;
  w.innerHTML=`<textarea class="msg-edit-input" rows="2">${esc(text)}</textarea><div class="msg-edit-btns"><button class="msg-edit-save">Сохранить</button><button class="msg-edit-cancel">Отмена</button><span class="msg-edit-hint">Enter — сохранить · Esc — отмена</span></div>`;
  el.replaceWith(w);
  const ta=w.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ar(ta);
  ta.addEventListener('input',()=>ar(ta));
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit(msgId,ta.value);}if(e.key==='Escape')cancelEdit();});
  w.querySelector('.msg-edit-save').addEventListener('click',()=>saveEdit(msgId,ta.value));
  w.querySelector('.msg-edit-cancel').addEventListener('click',cancelEdit);
}
function cancelEdit(){if(!editingId)return;document.querySelector(`[data-editwrap="${editingId}"]`)?.remove();editingId=null;}
async function saveEdit(msgId,t){
  const tx=t.trim();if(!tx||!currentCh)return;
  // Оптимистично обновляем локально
  const msg=currentMsgs.find(m=>m.id===msgId);
  if(msg){msg.text=tx;msg.edited=true;}
  cancelEdit();
  // Убираем редактор, показываем обновлённый текст
  if(msg) updateMessageEl(msg);
  try{
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{text:tx,edited:true,editedAt:serverTimestamp()});
    editingId=null;
  }catch(e){
    toast('Ошибка сохранения: '+e.message,'err');
    // Откат
    if(msg){msg.text=msg._prevText||tx;updateMessageEl(msg);}
  }
}
async function delMsg(msgId){if(!currentCh)return;try{await updateDoc(doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId),{deleted:true,text:''});}catch(e){toast('Ошибка: '+e.message,'err');}}
async function toggleReact(msgId,emoji){
  if(!currentCh||!me)return;
  const ref=doc(fdb,'pulsar_channels',currentCh.id,'messages',msgId);
  // Оптимистичное обновление — сразу меняем UI, потом пишем в Firestore
  const msg=currentMsgs.find(m=>m.id===msgId);
  if(msg){
    const users=(msg.reactions||{})[emoji]||[];
    const hasMe=users.includes(me.uid);
    // Обновляем локально
    if(!msg.reactions) msg.reactions={};
    if(hasMe) msg.reactions[emoji]=users.filter(u=>u!==me.uid);
    else msg.reactions[emoji]=[...users,me.uid];
    updateMessageEl(msg);
  }
  try{
    await updateDoc(ref,{[`reactions.${emoji}`]:(msg?.reactions?.[emoji]||[]).includes(me.uid)?arrayUnion(me.uid):arrayRemove(me.uid)});
  }catch(e){
    // Откат при ошибке
    console.error('react:',e);
    if(msg) updateMessageEl(msg);
  }
}

async function sendMessage(){
  const input=$('msg-input'),text=input.value.trim();
  if(!text&&!pendingFile)return;
  if(!currentCh)return;
  clearTyping();

  let attachData={};
  if(pendingFile){
    const file=pendingFile;pendingFile=null;$('btn-send').disabled=true;
    try{
      const path=`pulsar/${currentCh.id}/${Date.now()}_${file.name}`;
      const storRef=sRef(storage,path);
      uploadTask=uploadBytesResumable(storRef,file);
      await new Promise((res,rej)=>{uploadTask.on('state_changed',s=>{$('upload-fill').style.width=(s.bytesTransferred/s.totalBytes*100)+'%';},rej,async()=>{const url=await getDownloadURL(uploadTask.snapshot.ref);attachData={attachmentUrl:url,attachmentName:file.name,attachmentSize:fmtSize(file.size),attachmentType:file.type.startsWith('image/')?'image':'file'};res();});});
    }catch(e){toast('Ошибка загрузки: '+e.message,'err');$('btn-send').disabled=false;return;}
    cancelUpload();
  }

  input.value='';ar(input);$('btn-send').disabled=true;$('char-count').textContent='';
  const payload={text:text||'',authorId:me.uid,authorName:me.displayName||me.email,ts:serverTimestamp(),clientTs:Date.now(),edited:false,deleted:false,pinned:false,reactions:{},replyTo:replyTo||null,threadCount:0,...attachData};
  clearReply();
  try{
    await addDoc(collection(fdb,'pulsar_channels',currentCh.id,'messages'),payload);
    await updateDoc(doc(fdb,'pulsar_channels',currentCh.id),{lastMessage:{text:(text||'Файл').slice(0,80),authorName:me.displayName,ts:serverTimestamp()}});
  }catch(e){toast('Ошибка отправки: '+e.message,'err');input.value=text;$('btn-send').disabled=false;}
}

function openThread(msgId){
  const msg=currentMsgs.find(m=>m.id===msgId);if(!msg)return;
  threadMsgId=msgId;
  $('shell').classList.add('thread-open');
  $('thread-panel').classList.add('open');
  const user=allUsers[msg.authorId]||{};
  const avI=user.photoURL?`<img src="${esc(user.photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit"/>`:esc(ini(msg.authorName));
  $('thread-root').innerHTML=`<div class="thread-root-author">${avI} ${esc(msg.authorName)} <span class="thread-root-time">${fmtT({toDate:()=>msgTs(msg)})}</span></div><div class="thread-root-text">${renderText(msg.text||'[Вложение]')}</div>`;
  if(threadUnsub)threadUnsub();
  const tq=query(collection(fdb,'pulsar_channels',currentCh.id,'messages',msgId,'thread'),orderBy('clientTs','asc'));
  const tmList=$('thread-msgs');
  threadUnsub=onSnapshot(tq,snap=>{
    const replies=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!replies.length){tmList.innerHTML='<div style="padding:20px;font-size:.73rem;color:var(--muted);text-align:center">Ответов пока нет<br><span style="font-size:.65rem;color:var(--muted-2)">Напишите первый</span></div>';return;}
    tmList.innerHTML=replies.map(r=>{
      const u=allUsers[r.authorId]||{};
      const avI2=u.photoURL?`<img src="${esc(u.photoURL)}" alt=""/>`:esc(ini(r.authorName));
      return`<div class="thread-reply-row"><div class="thread-reply-av">${avI2}</div><div class="thread-reply-body"><div class="thread-reply-meta"><span class="thread-reply-author">${esc(r.authorName)}</span><span class="thread-reply-time">${fmtT(r.ts||{toDate:()=>new Date(r.clientTs)})}</span></div><div class="thread-reply-text">${renderText(r.text||'')}</div></div></div>`;
    }).join('');
    requestAnimationFrame(()=>{tmList.scrollTop=tmList.scrollHeight;});
  });
}

function doSearch(q){
  document.querySelectorAll('.msg-group').forEach(g=>g.classList.remove('search-hl','search-cur'));
  searchResults=[];searchIdx=0;
  if(!q.trim()){updateSearchNav();return;}
  const ql=q.toLowerCase();
  searchResults=currentMsgs.filter(m=>!m.deleted&&(m.text||'').toLowerCase().includes(ql));
  applySearchHL();
  if(searchResults.length){searchIdx=0;scrollToSearch();}
  updateSearchNav();
}
function applySearchHL(){
  document.querySelectorAll('.msg-group').forEach(g=>g.classList.remove('search-hl','search-cur'));
  searchResults.forEach((m,i)=>{const g=document.querySelector(`.msg-group[data-msgid="${m.id}"]`);if(g){g.classList.add('search-hl');if(i===searchIdx)g.classList.add('search-cur');}});
}
function scrollToSearch(){if(!searchResults[searchIdx])return;const g=document.querySelector(`.msg-group[data-msgid="${searchResults[searchIdx].id}"]`);if(g)g.scrollIntoView({behavior:'smooth',block:'center'});applySearchHL();}
function updateSearchNav(){
  const prev=$('search-prev'),next=$('search-next');
  if(prev)prev.disabled=searchIdx<=0;

function insertMention(idx){
  const u=mentionMatches[idx];if(!u)return;

  if(at<0){closeMentionPopup();return;}
  input.value=val.slice(0,at)+'@'+u.displayName+' ';

  closeMentionPopup();
}

/* ── INIT UI ── */
function initUI(){
  const input=$('msg-input');

  // Scroll btn
  $('msg-list').addEventListener('scroll',()=>{
    if(isNearBottom()){newMsgCount=0;updateScrollBtn();$('scroll-btn').classList.remove('show');document.title='Pulsar — Galelium';}
    else $('scroll-btn').classList.add('show');
  });

  // Input core
  input.addEventListener('input',()=>{
    ar(input);
    const len=input.value.length;
    $('btn-send').disabled=!input.value.trim()&&!pendingFile;
    // Char count
    const cc=$('char-count');
    if(len>3200){cc.textContent=`${len}/${MAX_CHARS}`;cc.className='char-count '+(len>MAX_CHARS?'over':'warn');}
    else cc.textContent='';
    // Typing
    clearTimeout(typingTimer);
    if(input.value.trim()){broadcastTyping();typingTimer=setTimeout(clearTyping,4000);}
    // Mention detection
    const val=input.value,cursor=input.selectionStart;
    const before=val.slice(0,cursor);
    const atMatch=before.match(/@([^\s]*)$/);
    if(atMatch&&usersLoaded){openMentionPopup(atMatch[1]);}
    else closeMentionPopup();
  });

  input.addEventListener('keydown',e=>{
    // Mention navigation
    if($('mention-popup').classList.contains('open')){
      if(e.key==='ArrowDown'){e.preventDefault();mentionIdx=Math.min(mentionIdx+1,mentionMatches.length-1);updateMentionHighlight();return;}
      if(e.key==='ArrowUp'){e.preventDefault();mentionIdx=Math.max(mentionIdx-1,0);updateMentionHighlight();return;}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertMention(mentionIdx);return;}
      if(e.key==='Escape'){closeMentionPopup();return;}
    }
    if((e.key==='Enter'&&!e.shiftKey)||(e.key==='Enter'&&e.ctrlKey)){e.preventDefault();sendMessage();}
  });

  input.addEventListener('blur',()=>setTimeout(closeMentionPopup,150));

  $('btn-send').addEventListener('click',sendMessage);
  $('reply-close').addEventListener('click',clearReply);

  document.addEventListener('click',e=>{if(!picker.contains(e.target)&&e.target!==$('emoji-toggle'))picker.classList.remove('open');});

  // File
  $('file-input').addEventListener('change',e=>{if(e.target.files[0])handleFileSelect(e.target.files[0]);});

  main.addEventListener('dragenter',e=>{e.preventDefault();dragCounter++;if(currentCh)$('drag-overlay').classList.add('active');});

  main.addEventListener('dragover',e=>e.preventDefault());

        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 012 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>

    </div>

  Sheet.define({
    id:     'search',

    zIndex: 700,
    onOpen: () => {

      setTimeout(() => document.getElementById('sh-search-inp')?.focus(), 80);
    },
  });

  Sheet.body('search').innerHTML = `
    <div style="padding:12px 16px 10px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px;background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:9px 13px;transition:border-color .14s" id="sh-search-box">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--muted-2);flex-shrink:0">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>

  shInp?.addEventListener('focus', () => shBox.style.borderColor = 'var(--accent-mid)');
  shInp?.addEventListener('blur',  () => shBox.style.borderColor = 'var(--border)');
  shInp?.addEventListener('input', e => {
    const v = e.target.value;
    shClear.style.display = v ? '' : 'none';
    _renderUserSearch(v);
  });
  shClear?.addEventListener('click', () => {
    shInp.value = '';
    shClear.style.display = 'none';
    _renderUserSearch('');

  $('btn-compose')?.addEventListener('click', () => Sheet.open('search'));

  $('pinned-bar').addEventListener('click', () => {

  Sheet.body('profile').innerHTML = `

      </button>
      <button class="prof-action-btn ghost" id="prof-btn-mention">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9 7a2 2 0 11-4 0 2 2 0 014 0z" stroke="currentColor" stroke-width="1.2"/><path d="M11 7a4 4 0 10-1.5 3.1M11 7v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Упомянуть
      </button>
    </div>

    <!-- Карточки -->
    <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">

      <!-- Статы -->
      <div class="prof-card">

            <div class="prof-stat-label">Каналов</div>
          </div>

      </div>

      <!-- О себе -->
      <div class="prof-card">

        </div>
      </div>

      <!-- Статус (только свой) -->
      <div class="prof-card" id="profile-status-row">
        <div class="prof-card-section">
          <div class="prof-section-title">Статус</div>

            <button class="prof-status-btn online"  data-s="online"><span class="prof-sdot"></span>В сети</button>
            <button class="prof-status-btn away"    data-s="away"><span class="prof-sdot"></span>Отошёл</button>
            <button class="prof-status-btn offline" data-s="offline"><span class="prof-sdot"></span>Не беспокоить</button>
          </div>
        </div>
      </div>

      <!-- Редактирование (только свой) -->
      <div class="prof-card" id="profile-edit-section">

              <label>Отображаемое имя</label>
              <input id="profile-name-input" placeholder="Ваше имя" autocomplete="off"/>
            </div>
            <div class="prof-field">
              <label>О себе</label>
              <textarea id="profile-bio-input" placeholder="Расскажите о себе…" rows="3"></textarea>
            </div>

              <label>Аватар (URL изображения)</label>

    <!-- Footer -->
    <div class="prof-foot" id="profile-foot">

        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" style="margin-right:5px"><path d="M9.5 4.5L12 7l-2.5 2.5M12 7H5.5M7 2H3a1 1 0 00-1 1v8a1 1 0 001 1h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Выйти
      </button>
      <button class="btn btn-ghost" id="prof-sh-cancel">Отмена</button>
      <button class="btn btn-primary" id="btn-save-profile">Сохранить</button>
    </div>
  `;

  // Profile triggers
  $('btn-my-profile')?.addEventListener('click',openMyProfile);
  $('my-avatar')?.addEventListener('click',openMyProfile);
  $('mob-btn-profile').addEventListener('click',openMyProfile);
  // Sheet controls (элементы находятся внутри sheet-body, уже в DOM)
  $('prof-sh-cancel').addEventListener('click', () => Sheet.close('profile'));
  $('btn-save-profile').addEventListener('click', saveProfile);
  // Статус-кнопки в профиле
  document.querySelectorAll('.prof-status-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.prof-status-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    updatePresence(b.dataset.s);
    if(me.presence) me.presence.status=b.dataset.s; else me.presence={status:b.dataset.s};
  }));

  // Предпросмотр аватара при вводе URL
  $('profile-avatar-url').addEventListener('input', e=>updateProfAvPreview(e.target.value.trim()));

  // Thread
  $('thread-close').addEventListener('click',closeThread);
  const ti=$('thread-input');
  ti.addEventListener('input',()=>{ar(ti);$('thread-send').disabled=!ti.value.trim();});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendThreadReply();}});
  $('thread-send').addEventListener('click',sendThreadReply);

  // Lightbox
  $('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox();});
  $('lightbox-close').addEventListener('click',closeLightbox);

  // Mute (button optional — may be absent)
  $('btn-mute')?.addEventListener('click',()=>{
    if(!currentCh){toast('Выберите канал','err');return;}
    const id=currentCh.id;
    if(mutedChannels.has(id)){mutedChannels.delete(id);$('btn-mute')?.classList.remove('active');toast('Уведомления включены','ok');}
    else{mutedChannels.add(id);$('btn-mute')?.classList.add('active');toast('Уведомления выключены','ok');}
    localStorage.setItem('p_muted',JSON.stringify([...mutedChannels]));
  });

  // Modals close
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.modal)));
  document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov.id);}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('lightbox').classList.contains('open')){closeLightbox();return;}document.querySelectorAll('.modal-overlay.open').forEach(el=>closeModal(el.id));}});

  // Reset title on focus
  window.addEventListener('focus',()=>{document.title='Pulsar — Galelium';});

  // Navigation
  $('btn-back-to-chats').addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-dms')?.addEventListener('click',()=>{ openSidebar(); });
  $('mob-btn-channels')?.addEventListener('click',()=>{ setNavActive('mob-btn-channels'); _sbQuery=''; rebuildChatList(); showView('view-rooms'); });
  $('mob-btn-new')?.addEventListener('click',()=>{ setNavActive('mob-btn-new'); showView('view-groups'); });

  // Logout
  $('btn-logout')?.addEventListener('click',async()=>{if(!confirm('Выйти из Pulsar?'))return;await updatePresence('offline');clearTyping();await signOut(auth);location.replace('login.html');});
}
</script>
