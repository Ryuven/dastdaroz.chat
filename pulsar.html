<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Pulsar — Galelium</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap"/></noscript>
<style>
:root{
  --bg:#f3f7f4;--surface:#ffffff;--surface-2:#edf4ef;--surface-3:#e0ede3;--surface-4:#c8dccb;
  --border:rgba(0,0,0,.07);--border-h:rgba(0,0,0,.15);
  --accent:#1a9e4a;--accent-dim:rgba(26,158,74,.09);--accent-mid:rgba(26,158,74,.25);
  --text:#171f1a;--muted:#5a7a62;--muted-2:#8aa88e;--muted-3:#c8dccb;
  --green:#1a9e4a;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;
  --font-display:'Unbounded',sans-serif;--font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --font-pixel:'Press Start 2P',monospace;
  --sb-w:320px;--topbar-h:50px;--mob-nav-h:58px;--thread-w:340px;
  --t:.22s;--tf:.14s;--ease:cubic-bezier(.4,0,.2,1);--r:6px;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  --shadow-md:0 4px 20px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}

/* ── SHELL ── */
#shell{display:grid;height:100svh;grid-template-columns:1fr;grid-template-areas:"main"}
#shell.active{display:grid}
#shell.thread-open{grid-template-columns:1fr var(--thread-w);grid-template-areas:"main thread"}

/* ── SIDEBAR ── */
#sidebar{
  display:none!important;
  grid-area:sidebar;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;z-index:10;
}

/* Шапка сайдбара — как в Telegram */
.sb-head{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--surface);
  position:sticky;top:0;z-index:10;
}
.sb-head-top{
  display:flex;align-items:center;gap:10px;
}
.sb-logo-img{
  height:26px;width:auto;object-fit:contain;flex-shrink:0;
  display:block;
}
.sb-head-actions{display:flex;gap:4px}
.sb-action-btn{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--muted);
  transition:background var(--tf),color var(--tf);
}
.sb-action-btn:hover{background:var(--surface-3);color:var(--text)}
/* Поиск в шапке */
.sb-search{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:20px;padding:6px 12px;
  transition:border-color var(--tf);
}
.sb-search:focus-within{border-color:var(--accent-mid)}
.sb-search svg{color:var(--muted-2);flex-shrink:0}
#sb-search-input{
  flex:1;background:none;font-size:.78rem;color:var(--text);
  caret-color:var(--accent);
}
#sb-search-input::placeholder{color:var(--muted-2)}

/* Список чатов */
.sb-chat-list{
  flex:1;overflow-y:auto;padding:4px 0 8px;
}

/* Метка-раздел (тег "Каналы" / "Личные") */
.sb-section-tag{
  padding:8px 14px 4px;
  font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted-2);display:flex;align-items:center;gap:8px;
}
.sb-section-tag span{flex:1}
.sb-section-tag button{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--muted-2);font-size:14px;line-height:1;
  transition:background var(--tf),color var(--tf);
}
.sb-section-tag button:hover{background:var(--surface-3);color:var(--accent)}

.sb-label{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2)}
.sb-label-add{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background var(--tf),color var(--tf);color:var(--muted-2);font-size:15px;line-height:1}
.sb-label-add:hover{background:var(--surface-3);color:var(--accent)}

/* ── CHAT CARD ── */
.ch-card{
  display:flex;align-items:center;gap:11px;
  padding:9px 14px;cursor:pointer;
  transition:background var(--tf);position:relative;
  user-select:none;min-width:0;
}
.ch-card:hover{background:var(--surface-2)}
.ch-card.active{background:rgba(255,255,255,.06)}
.ch-card.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;background:var(--accent);border-radius:0 2px 2px 0;
}

/* Аватар/иконка */
.ch-ava-wrap{
  position:relative;flex-shrink:0;
  width:46px;height:46px;
}
.ch-ava{
  width:46px;height:46px;border-radius:50%;
  background:var(--surface-3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;font-weight:700;color:var(--accent);
  position:relative;overflow:hidden;
  transition:border-color var(--tf);
}
.ch-ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ch-ava.ch-ava--ch{
  border-radius:12px;
  background:var(--accent-dim);border-color:var(--accent-mid);
  font-size:.82rem;color:var(--accent);
}
.ch-card.active .ch-ava{border-color:var(--accent-mid)}

/* Presence dot */
.ch-presence{
  position:absolute;bottom:0;right:0;
  width:11px;height:11px;border-radius:50%;
  border:2px solid var(--surface);
  transition:border-color var(--tf);
  pointer-events:none;
}
.ch-card.active .ch-presence{border-color:rgba(255,255,255,.06)}
.ch-presence.online{background:var(--green)}
.ch-presence.away{background:#8888c0}
.ch-presence.offline{background:var(--muted-2)}

/* Тело карточки */
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ch-row1{display:flex;align-items:center;gap:6px}
.ch-title{
  font-size:.82rem;font-weight:500;color:var(--text);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-card:not(.active) .ch-title{color:var(--muted);font-weight:400}
.ch-card:hover .ch-title,.ch-card.active .ch-title{color:var(--text);font-weight:500}
.ch-ts{font-size:.62rem;color:var(--muted-2);white-space:nowrap;flex-shrink:0}
.ch-card.has-unread .ch-ts{color:var(--accent)}

.ch-row2{display:flex;align-items:center;gap:5px}
.ch-preview{
  flex:1;font-size:.73rem;color:var(--muted-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-preview b{color:var(--muted);font-weight:500}
.ch-preview.empty{font-style:italic;color:var(--muted-3)}

/* Unread badge */
.ch-badge{
  background:var(--red);color:#fff;
  font-size:.52rem;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(208,96,112,.35);
}
/* Маленькая точка (без числа) */
.ch-unread-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}

/* Skeleton */
.ch-card-sk{display:flex;align-items:center;gap:11px;padding:9px 14px}
.sk-circle{width:46px;height:46px;border-radius:50%;background:var(--surface-3);flex-shrink:0;animation:skPulse 1.8s ease-in-out infinite}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:7px}

/* Убираем старые стили */
.sb-item,.sb-unread-badge{display:none!important}
/* dm-item используется в поиске DM — НЕ скрываем */
.dm-item .presence-dot{position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--surface-2)}
.dm-avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--accent-mid);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--accent);flex-shrink:0;position:relative;overflow:hidden}
.dm-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}

/* User panel (нижняя панель) */
.user-avatar{
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-dim);border:1px solid var(--accent-mid);
  font-weight:700;color:var(--accent);
  cursor:pointer;overflow:hidden;position:relative;
  transition:border-color var(--tf),transform var(--tf);
  flex-shrink:0;
}
.user-avatar:hover{border-color:var(--accent);transform:scale(1.06)}
.user-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit}
.user-panel{
  height:52px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:9px;padding:0 14px;
  flex-shrink:0;background:rgba(243,247,244,.88);backdrop-filter:blur(8px);
}
.user-panel .user-info{flex:1;min-width:0}
.user-panel .user-name{font-size:.76rem;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-panel .user-status{font-size:.6rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.user-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.user-actions{display:flex;gap:2px}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);transition:background var(--tf),color var(--tf)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.active{color:var(--accent)}

/* ── MAIN ── */
#main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}

/* Topbar */
.topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border);background:rgba(243,247,244,.88);backdrop-filter:blur(12px);position:relative;z-index:5}
.topbar-name{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.topbar-hash{display:none}
.topbar-ch-name{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.topbar-sep{display:none}
.topbar-desc{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.topbar-desc:empty{display:none}
.topbar-actions{display:flex;gap:2px;flex-shrink:0;align-items:center}

/* Pinned bar */
#pinned-bar{display:none;align-items:center;gap:10px;padding:7px 16px;background:linear-gradient(135deg,rgba(26,158,74,.07),rgba(26,158,74,.03));border-bottom:1px solid rgba(26,158,74,.15);cursor:pointer;transition:background var(--tf);flex-shrink:0}
#pinned-bar:hover{background:linear-gradient(135deg,rgba(26,158,74,.12),rgba(26,158,74,.06))}
#pinned-bar.visible{display:flex}
.pinned-icon{color:var(--accent);flex-shrink:0}
.pinned-text{font-size:.7rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinned-text strong{color:var(--accent)}
.pinned-close{color:var(--muted-2);padding:2px;transition:color var(--tf);flex-shrink:0;border-radius:3px}
.pinned-close:hover{color:var(--text);background:var(--surface-3)}

/* Search bar */

/* ── DRAG DROP OVERLAY ── */
#drag-overlay{position:absolute;inset:0;z-index:50;background:rgba(26,158,74,.06);border:2px dashed var(--accent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(2px)}
#drag-overlay.active{display:flex}
.drag-icon{font-size:2.4rem}
.drag-label{font-size:.82rem;color:var(--accent);font-family:var(--font-display);font-weight:700;letter-spacing:.04em}
.drag-sub{font-size:.68rem;color:var(--muted)}

/* ── MESSAGES ── */
#msg-list{flex:1;overflow-y:auto;padding:8px 0 2px;display:flex;flex-direction:column;overscroll-behavior:contain;scroll-behavior:smooth}

/* Date divider */
.date-div{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;pointer-events:none}
.date-div-line{flex:1;height:1px;background:var(--border)}
.date-div-text{font-size:.58rem;color:var(--muted-2);white-space:nowrap;letter-spacing:.04em}
.new-msgs-div{display:flex;align-items:center;gap:10px;padding:8px 20px;margin:4px 0}
.new-msgs-line{flex:1;height:1px;background:rgba(208,96,112,.3)}
.new-msgs-label{font-size:.58rem;color:var(--red);white-space:nowrap;padding:1px 8px;background:rgba(208,96,112,.07);border-radius:10px;border:1px solid rgba(208,96,112,.18)}
/* Message group */
.msg-group{position:relative;padding:1px 14px;display:flex;flex-direction:column}
.msg-group.msg-first{margin-top:10px}
.msg-group.new-msg{animation:msgSlideIn .24s var(--ease) both}
@keyframes msgSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-group.search-hl .msg-bubble{background:rgba(26,158,74,.06)!important;outline:1px solid rgba(26,158,74,.22)}
.msg-group.search-cur .msg-bubble{background:rgba(26,158,74,.12)!important;outline:1px solid var(--accent)}
/* Row — bubble alignment */
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg-row.is-me{justify-content:flex-end}
/* Avatar */
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);transition:transform var(--tf);position:relative;align-self:flex-end}
.msg-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:50%}
.msg-av:hover{transform:scale(1.08)}
.msg-av.ghost{background:transparent;border:none;cursor:default;pointer-events:none}
/* Bubble wrap */
.msg-bubble-wrap{display:flex;flex-direction:column;max-width:min(500px,74%);min-width:0}
.msg-row.is-me .msg-bubble-wrap{align-items:flex-end}
/* Meta */
.msg-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;padding:0 2px}
.msg-row.is-me .msg-meta{flex-direction:row-reverse}
.msg-author{font-size:.72rem;font-weight:600;color:var(--text);cursor:pointer;transition:color var(--tf)}
.msg-author:hover{color:var(--accent)}
.msg-author.is-me{color:var(--accent)}
.msg-time{font-size:.57rem;color:var(--muted-2);font-weight:300}
.msg-edited-tag{font-size:.54rem;color:var(--muted-2);font-style:italic}
.msg-pinned-tag{font-size:.5rem;color:var(--accent);background:var(--accent-dim);padding:1px 4px;border-radius:3px}
/* Bubble */
.msg-bubble{position:relative;padding:7px 11px;word-break:break-word;transition:background .1s}
.msg-row:not(.is-me) .msg-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:16px 16px 16px 4px}
.msg-row.is-me .msg-bubble{background:rgba(26,158,74,.13);border:1px solid rgba(26,158,74,.22);border-radius:16px 16px 4px 16px}
/* Consecutive — скругление только у сгруппированных (тот же автор) */
.msg-group.msg-grouped .msg-row:not(.is-me) .msg-bubble{border-top-left-radius:4px}
.msg-group.msg-grouped .msg-row.is-me .msg-bubble{border-top-right-radius:4px}
/* Text */
.msg-text{font-size:.8rem;line-height:1.6;color:var(--text);white-space:pre-wrap}
.msg-row.is-me .msg-text{color:#0d2e18}
.msg-text a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.msg-text a:hover{color:#8ab8e8}
.msg-text.deleted{color:var(--muted-2);font-style:italic}
.msg-text strong{font-weight:600}.msg-text em{font-style:italic}
/* Inline time inside bubble */
.msg-ts-inline{display:inline-block;font-size:.54rem;color:var(--muted-2);margin-left:8px;vertical-align:bottom;white-space:nowrap;line-height:1;margin-bottom:1px}
.msg-row.is-me .msg-ts-inline{color:rgba(13,46,24,.45)}
/* Mention */
.mention{color:var(--accent);background:var(--accent-dim);padding:0 3px;border-radius:3px;font-weight:500;cursor:pointer;transition:background var(--tf)}
.mention:hover{background:var(--accent-mid)}
.mention.is-me{background:rgba(26,158,74,.18);border:1px solid var(--accent-mid)}
/* Code inline */
.msg-text code{background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.09);padding:1px 5px;border-radius:4px;font-size:.73rem;font-family:var(--mono);color:#2563eb}
/* Code block */
.code-block{margin:6px 0;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);border-radius:var(--r);overflow:hidden}
.code-block-head{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid rgba(0,0,0,.07)}
.code-lang{font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.code-copy{font-size:.6rem;color:var(--muted);padding:2px 7px;border-radius:3px;background:rgba(255,255,255,.05);cursor:pointer;border:none;transition:color var(--tf)}
.code-copy:hover{color:var(--accent)}.code-copy.copied{color:var(--green)}
.code-block pre{padding:10px 12px;overflow-x:auto;font-size:.73rem;font-family:var(--mono);line-height:1.6;color:#1e3a2a}
/* Reply ref */
.msg-reply-ref{display:flex;align-items:center;gap:7px;padding:4px 8px;margin-bottom:4px;border-left:2px solid var(--accent-mid);background:rgba(26,158,74,.06);border-radius:0 6px 6px 0;cursor:pointer;transition:background var(--tf)}
.msg-reply-ref:hover{background:rgba(26,158,74,.12)}
.msg-reply-author{font-size:.61rem;color:var(--accent);font-weight:600;white-space:nowrap;flex-shrink:0}
.msg-reply-text{font-size:.65rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Image / file */
.msg-attachment{margin-top:5px}
.msg-img-wrap{display:inline-block;position:relative;cursor:pointer;border-radius:10px;overflow:hidden}
.msg-img{max-width:260px;max-height:220px;display:block;object-fit:cover;border-radius:10px;transition:opacity var(--tf)}
.msg-img:hover{opacity:.88}
.msg-img-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity var(--tf)}
.msg-img-wrap:hover .msg-img-overlay{opacity:1}
.msg-img-overlay svg{color:#fff}
.msg-file{display:inline-flex;align-items:center;gap:9px;background:rgba(0,0,0,.04);border:1px solid var(--border);padding:8px 12px;border-radius:10px;cursor:pointer;transition:border-color var(--tf);text-decoration:none;max-width:240px}
.msg-file:hover{border-color:var(--border-h)}
.msg-file-icon{width:28px;height:28px;background:var(--accent-dim);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.msg-file-info{min-width:0}
.msg-file-name{font-size:.73rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;display:block}
.msg-file-size{font-size:.59rem;color:var(--muted)}
/* Reactions */
.msg-reactions{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.reaction-btn{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:10px;font-size:.7rem;cursor:pointer;transition:all var(--tf);user-select:none}
.reaction-btn:hover{border-color:var(--border-h);background:var(--surface-3)}
.reaction-btn.active{border-color:var(--accent-mid);background:var(--accent-dim)}
.reaction-count{font-size:.61rem;color:var(--muted)}
.reaction-btn.active .reaction-count{color:var(--accent)}
/* Thread button */
.msg-thread-btn{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:.65rem;color:var(--blue);cursor:pointer;border-radius:4px;padding:2px 6px;transition:background var(--tf)}
.msg-thread-btn:hover{background:rgba(106,159,216,.08)}
/* ── ACTIONS TOOLBAR — минималистичный hover ── */
.msg-actions{
  position:absolute;top:-15px;right:0;
  display:flex;gap:1px;
  background:var(--surface);border:1px solid var(--border);
  padding:2px;border-radius:8px;
  opacity:0;pointer-events:none;
  transition:opacity .1s,transform .1s;z-index:10;
  box-shadow:0 4px 16px rgba(0,0,0,.10);transform:translateY(2px);
}
.msg-group.actions-open .msg-actions{opacity:1;pointer-events:auto;transform:translateY(0)}
@media(hover:hover){.msg-group:hover .msg-actions{opacity:1;pointer-events:auto;transform:translateY(0)}}
.msg-group.from-me .msg-actions{right:auto;left:0}
.msg-action-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted-2);transition:background var(--tf),color var(--tf);cursor:pointer;position:relative}
.msg-action-btn:hover{background:var(--surface-3);color:var(--text)}
.msg-action-btn.danger:hover{background:rgba(208,96,112,.1);color:var(--red)}
.msg-action-btn.pin-active{color:var(--accent)}
.msg-action-sep{width:1px;height:16px;background:var(--border);align-self:center;margin:0 1px}
.msg-action-btn::before{content:attr(title);position:absolute;bottom:calc(100%+4px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);font-size:.56rem;padding:3px 6px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;border:1px solid var(--border)}
.msg-action-btn:hover::before{opacity:1}
/* Edit */
.msg-edit-wrap{margin-top:4px}
.msg-edit-input{width:100%;background:var(--surface-2);border:1px solid var(--accent-mid);color:var(--text);font-size:.8rem;line-height:1.55;padding:8px 11px;border-radius:var(--r);resize:none;min-height:52px;box-shadow:0 0 0 2px rgba(26,158,74,.08)}
.msg-edit-btns{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:.63rem}
.msg-edit-save{background:var(--accent);color:#fff;padding:4px 12px;border-radius:var(--r);font-weight:700;transition:opacity var(--tf)}
.msg-edit-save:hover{opacity:.85}
.msg-edit-cancel{color:var(--muted);padding:4px 9px;border-radius:var(--r);transition:color var(--tf),background var(--tf)}
.msg-edit-cancel:hover{color:var(--text);background:var(--surface-3)}
.msg-edit-hint{font-size:.58rem;color:var(--muted-2);margin-left:auto}
/* Typing */
#typing-bar{padding:2px 20px;min-height:20px;font-size:.64rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0}
.typing-dots{display:flex;align-items:center;gap:2px}
.typing-dots span{display:block;width:4px;height:4px;border-radius:50%;background:var(--muted);animation:tdot 1.4s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* ── SCROLL-TO-BOTTOM BUTTON ── */
#scroll-btn{
  position:absolute;bottom:90px;right:20px;z-index:20;
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:opacity var(--tf),transform var(--tf),color var(--tf),background var(--tf);
  opacity:0;pointer-events:none;transform:translateY(8px)
}
#scroll-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#scroll-btn:hover{color:var(--text);background:var(--surface-3);border-color:var(--border-h)}
#scroll-btn-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--red);color:#fff;font-size:.48rem;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;
  display:none;align-items:center;justify-content:center;padding:0 3px;
  border:2px solid var(--surface)
}
#scroll-btn-badge.show{display:flex}

/* ── MENTION AUTOCOMPLETE ── */
#mention-popup{
  position:absolute;bottom:calc(100% + 6px);left:14px;right:14px;z-index:200;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 8px 32px rgba(0,0,0,.1);overflow:hidden;
  display:none;max-height:200px;overflow-y:auto
}
#mention-popup.open{display:block;animation:scaleIn .15s var(--ease)}
@keyframes scaleIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.mention-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background var(--tf)}
.mention-item:hover,.mention-item.active{background:var(--surface-3)}
.mention-av{width:24px;height:24px;border-radius:6px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;position:relative}
.mention-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mention-name{font-size:.76rem;font-weight:500;color:var(--text)}
.mention-email{font-size:.62rem;color:var(--muted)}
.mention-online{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;flex-shrink:0}

/* ── INPUT ── */
.input-wrap{
  padding:0;flex-shrink:0;position:relative;
  background:var(--bg);
  border-top:1px solid var(--border);
}
.upload-preview{display:none;align-items:center;gap:10px;background:var(--surface-2);border-bottom:1px solid var(--border);padding:8px 14px}
.upload-preview.visible{display:flex}
.upload-thumb{width:40px;height:40px;border-radius:5px;object-fit:cover;background:var(--surface-3);flex-shrink:0;border:1px solid var(--border)}
.upload-info{flex:1;min-width:0}
.upload-name{font-size:.72rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-progress{height:3px;background:var(--surface-3);border-radius:2px;margin-top:4px;overflow:hidden}
.upload-progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .15s}
.upload-cancel{color:var(--muted);padding:4px;border-radius:4px;transition:color var(--tf),background var(--tf);flex-shrink:0}
.upload-cancel:hover{color:var(--red);background:rgba(208,96,112,.08)}

.input-reply-bar{display:none;align-items:center;gap:8px;background:var(--surface-2);border-bottom:1px solid var(--border);padding:8px 14px}
.input-reply-bar.visible{display:flex}
.input-reply-to{font-size:.68rem;color:var(--muted);flex-shrink:0}.input-reply-to strong{color:var(--accent)}
.input-reply-preview{font-size:.68rem;color:var(--muted-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input-reply-close{color:var(--muted);padding:3px;border-radius:3px;transition:color var(--tf),background var(--tf);flex-shrink:0}
.input-reply-close:hover{color:var(--text);background:var(--surface-3)}

.input-box{
  display:flex;align-items:flex-end;gap:8px;
  background:transparent;
  border:none;border-radius:0;
  padding:10px 14px;
}
.has-above .input-box{border-top:1px solid var(--border)}
.input-box:focus-within{background:transparent}
#msg-input{flex:1;background:none;color:var(--text);font-size:.82rem;line-height:1.55;resize:none;min-height:22px;max-height:140px;overflow-y:auto;padding:5px 0;tab-size:4}
#msg-input::placeholder{color:var(--muted-2)}

.input-icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted-2);transition:color var(--tf),background var(--tf);flex-shrink:0;cursor:pointer}
.input-icon-btn:hover{color:var(--text);background:rgba(0,0,0,.06)}
/* Кнопка отправки — круглая */
.input-send{width:34px;height:34px;background:var(--accent);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:opacity .18s,transform .18s,box-shadow .18s}
.input-send:hover:not(:disabled){opacity:.9;transform:scale(1.07);box-shadow:0 0 16px rgba(26,158,74,.35)}
.input-send:disabled{opacity:.22;cursor:not-allowed;transform:none}
/* Счётчик символов — минимально */
.char-count{font-size:.58rem;color:var(--muted-2);transition:color var(--tf);text-align:right;padding:2px 14px 6px}
.char-count.warn{color:#aaaacc}
.char-count.over{color:var(--red)}

/* Emoji picker */
.emoji-picker{position:absolute;bottom:calc(100% + 6px);right:14px;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;display:none;grid-template-columns:repeat(7,1fr);gap:2px;box-shadow:0 8px 32px rgba(0,0,0,.1);animation:scaleIn .15s var(--ease)}
.emoji-picker.open{display:grid}
.ep-emoji{font-size:1.25rem;padding:5px;text-align:center;border-radius:4px;cursor:pointer;transition:background var(--tf),transform .1s;line-height:1}
.ep-emoji:hover{background:var(--surface-3);transform:scale(1.2)}

/* ── THREAD ── */
#thread-panel{grid-area:thread;background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
#thread-panel.open{display:flex;animation:slideFromRight .22s var(--ease)}
@keyframes slideFromRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.thread-head{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(243,247,244,.88);backdrop-filter:blur(8px)}
.thread-title{font-size:.82rem;font-weight:600;flex:1;color:var(--text)}
.thread-close{color:var(--muted);padding:5px;border-radius:5px;transition:color var(--tf),background var(--tf)}
.thread-close:hover{color:var(--text);background:var(--surface-3)}
.thread-root{padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(26,158,74,.05),transparent);flex-shrink:0}
.thread-root-author{font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.thread-root-time{font-weight:300;color:var(--muted-2);font-size:.6rem}
.thread-root-text{font-size:.78rem;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
#thread-msgs{flex:1;overflow-y:auto;padding:6px 0}
.thread-reply-row{display:flex;align-items:flex-start;gap:10px;padding:5px 14px;transition:background var(--tf)}
.thread-reply-row:hover{background:rgba(0,0,0,.025)}
.thread-reply-av{width:28px;height:28px;border-radius:7px;background:var(--accent-dim);border:1px solid var(--accent-mid);display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;position:relative}
.thread-reply-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thread-reply-body{flex:1;min-width:0}
.thread-reply-meta{display:flex;gap:7px;align-items:baseline;margin-bottom:2px}
.thread-reply-author{font-size:.72rem;font-weight:600;color:var(--text)}
.thread-reply-time{font-size:.58rem;color:var(--muted-2)}
.thread-reply-text{font-size:.78rem;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.thread-input-wrap{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
.thread-input-box{display:flex;align-items:flex-end;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;transition:border-color var(--tf),box-shadow .18s}
.thread-input-box:focus-within{border-color:var(--accent-mid);box-shadow:0 0 0 2px var(--accent-dim)}
#thread-input{flex:1;background:none;color:var(--text);font-size:.8rem;line-height:1.5;resize:none;min-height:20px;max-height:120px;overflow-y:auto;padding:3px 0}
#thread-input::placeholder{color:var(--muted-2)}
.thread-send{width:28px;height:28px;background:var(--accent);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:opacity var(--tf),transform var(--tf)}
.thread-send:hover:not(:disabled){opacity:.85;transform:scale(1.06)}
.thread-send:disabled{opacity:.3;cursor:not-allowed}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
#lightbox.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.8)}
#lightbox-close{position:absolute;top:16px;right:16px;color:#fff;font-size:1.2rem;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.35);transition:background var(--tf);border:1px solid rgba(255,255,255,.15)}
#lightbox-close:hover{background:rgba(0,0,0,.6)}
#lightbox-dl{position:absolute;bottom:20px;right:20px;color:#fff;font-size:.72rem;padding:8px 14px;border-radius:var(--r);background:rgba(0,0,0,.35);transition:background var(--tf);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:6px}
#lightbox-dl:hover{background:rgba(0,0,0,.6)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);width:min(480px,calc(100vw - 24px));animation:scaleIn .2s var(--ease) both;position:relative;border-radius:var(--r);overflow:hidden}
.modal.wide{width:min(600px,calc(100vw - 24px))}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 60%)}
.modal-head{padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--font-display);font-weight:800;font-size:.95rem}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-close{position:absolute;top:12px;right:12px;color:var(--muted);padding:6px;transition:color var(--tf),background var(--tf);border-radius:5px}
.modal-close:hover{color:var(--text);background:var(--surface-3)}
.field{margin-bottom:14px}
.field-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;display:block}
.field-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:.82rem;padding:10px 12px;border-radius:var(--r);transition:border-color var(--tf)}
.field-input:focus{border-color:var(--accent-mid)}
.field-input::placeholder{color:var(--muted-2)}
.btn{padding:9px 18px;font-size:.7rem;font-weight:500;letter-spacing:.04em;border-radius:var(--r);transition:opacity var(--tf),background var(--tf);cursor:pointer}
.btn-ghost{border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--border-h);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;font-weight:700}.btn-primary:hover:not(:disabled){opacity:.87}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:rgba(208,96,112,.12);color:var(--red);border:1px solid rgba(208,96,112,.2)}.btn-danger:hover{background:rgba(208,96,112,.2)}

/* ── PROFILE SHEET ── */

/* Баннер */
.prof-banner{
  height:110px;
  background:linear-gradient(135deg,#d4ede0 0%,#b8dfc8 45%,#c8e8d8 100%);
  position:relative;flex-shrink:0;
}
/* Внутренний слой для обрезки градиента */
.prof-banner-inner{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
}
.prof-banner::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,
    rgba(26,158,74,.10) 0%,
    rgba(34,197,94,.06) 55%,
    rgba(26,158,74,.12) 100%);
}
.prof-banner-dots{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(26,158,74,.12) 1px,transparent 1px);
  background-size:20px 20px;
}
.prof-close-btn{
  position:absolute;top:12px;right:12px;z-index:10;
  width:28px;height:28px;
  background:rgba(255,255,255,.75);
  border:1px solid rgba(0,0,0,.1);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;
  transition:background var(--tf),color var(--tf);
}
.prof-close-btn:hover{background:#fff;color:var(--text)}

/* Аватар — выходит из баннера */
.prof-av-wrap{
  position:absolute;
  bottom:-30px;left:22px;
  width:80px;height:80px;
  border-radius:50%;
  border:4px solid var(--surface);
  background:var(--surface-2);
  z-index:20;cursor:pointer;
  flex-shrink:0;
  overflow:visible;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.prof-av-inner{
  width:100%;height:100%;border-radius:50%;
  overflow:hidden;
  background:var(--accent-dim);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;font-weight:800;color:var(--accent);
  position:relative;
}
.prof-av-inner img{
  width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;border-radius:50%;
}
.prof-av-wrap:hover .prof-av-inner::after{
  content:'📷';
  position:absolute;inset:0;
  background:rgba(0,0,0,.52);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;border-radius:50%;
}
/* Статус-dot прямо на аватаре */
.prof-av-status{
  position:absolute;bottom:3px;right:3px;
  width:16px;height:16px;border-radius:50%;
  border:3px solid var(--surface);
  z-index:6;transition:background .3s;
}
.prof-av-status.online {background:var(--green)}
.prof-av-status.away   {background:#8888c0}
.prof-av-status.offline{background:var(--muted-2)}

/* Тело профиля */
.prof-body{
  padding:42px 22px 4px;
}

/* Имя + роль + email */
.prof-name-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.prof-name{
  font-family:var(--font-display);font-weight:800;
  font-size:1.1rem;color:var(--text);line-height:1.2;
}
.prof-role-badge{
  font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;font-weight:700;flex-shrink:0;
}
.prof-role-badge.admin{background:rgba(208,96,112,.1);color:var(--red);border:1px solid rgba(208,96,112,.22)}
.prof-role-badge.user {background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-mid)}
.prof-username{font-size:.7rem;color:var(--muted);margin-bottom:16px}

/* Карточка-профиль (белый блок под именем) */
.prof-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:14px;
}
.prof-card-section{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.prof-card-section:last-child{border-bottom:none}

/* Статы внутри карточки */
.prof-stats{display:flex;gap:0}
.prof-stat{
  flex:1;padding:14px 0;text-align:center;
  border-right:1px solid var(--border);
}
.prof-stat:last-child{border-right:none}
.prof-stat-num{
  font-family:var(--font-display);font-weight:800;
  font-size:.98rem;color:var(--accent);line-height:1;
}
.prof-stat-label{
  font-size:.54rem;color:var(--muted-2);
  text-transform:uppercase;letter-spacing:.08em;
  margin-top:3px;
}

/* Заголовок секции внутри карточки */
.prof-section-title{
  font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:6px;font-weight:600;
}
.prof-bio{
  font-size:.78rem;color:var(--text);line-height:1.6;
}
.prof-bio.empty{font-style:italic;color:var(--muted-3)}

.prof-divider{height:1px;background:var(--border);margin:14px 0}

/* Статус-пикер */
.prof-status-btns{display:flex;gap:5px;flex-wrap:wrap}
.prof-status-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;
  font-size:.66rem;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;
  transition:all .15s;background:none;
}
.prof-status-btn:hover{border-color:var(--border-h);color:var(--text)}
.prof-status-btn.active.online {background:rgba(76,175,130,.08);border-color:rgba(76,175,130,.4);color:var(--green)}
.prof-status-btn.active.away   {background:rgba(136,136,192,.08);border-color:rgba(136,136,192,.4);color:#8888c0}
.prof-status-btn.active.offline{background:rgba(72,70,63,.14);border-color:rgba(72,70,63,.5);color:var(--muted)}
.prof-sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prof-status-btn.active.online .prof-sdot {background:var(--green)}
.prof-status-btn.active.away   .prof-sdot {background:#8888c0}
.prof-status-btn.active.offline .prof-sdot{background:var(--muted-2)}
.prof-status-btn:not(.active) .prof-sdot  {background:var(--muted-2)}

/* Поля формы внутри карточки */
.prof-field{margin-bottom:12px}
.prof-field:last-child{margin-bottom:0}
.prof-field label{
  font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted-2);display:block;margin-bottom:6px;font-weight:600;
}
.prof-field input,.prof-field textarea{
  width:100%;background:var(--surface-3);
  border:1px solid var(--border);color:var(--text);
  font-size:.8rem;padding:9px 11px;
  border-radius:var(--r);transition:border-color .15s;
  font-family:var(--font);
}
.prof-field input:focus,.prof-field textarea:focus{
  border-color:var(--accent-mid);outline:none;
}
.prof-field input::placeholder,.prof-field textarea::placeholder{color:var(--muted-2)}
.prof-field textarea{resize:none;line-height:1.5}

/* Предпросмотр аватара */
.prof-av-preview-row{
  display:none;align-items:center;gap:10px;margin-top:8px;
}
.prof-av-preview-row.visible{display:flex}
.prof-av-preview-img{
  width:38px;height:38px;border-radius:50%;
  object-fit:cover;border:2px solid var(--border);
  background:var(--surface-3);
}
.prof-av-preview-label{font-size:.66rem;color:var(--muted)}

/* Действия для чужого профиля */
.prof-actions{display:flex;gap:8px;padding:0 22px 16px}
.prof-action-btn{
  flex:1;padding:9px 12px;border-radius:var(--r);
  font-size:.72rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;transition:opacity var(--tf),background var(--tf),border-color var(--tf);
  border:none;
}
.prof-action-btn.primary{background:var(--accent);color:#fff}
.prof-action-btn.primary:hover{opacity:.85}
.prof-action-btn.ghost{
  background:var(--surface-2);color:var(--muted);
  border:1px solid var(--border);
}
.prof-action-btn.ghost:hover{border-color:var(--border-h);color:var(--text)}

/* Footer */
.prof-foot{
  display:flex;gap:8px;justify-content:flex-end;
  padding:14px 22px;border-top:1px solid var(--border);
}

/* Прокручиваемая область профиля (в sheet — bs-body уже scrollable) */
.prof-scroll{ display:contents; }

/* Pinned */
.pinned-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.pinned-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color var(--tf)}
.pinned-item:hover{border-color:var(--border-h)}
.pinned-item-author{font-size:.68rem;color:var(--accent);font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.pinned-item-text{font-size:.76rem;color:var(--text);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pinned-item-time{font-size:.6rem;color:var(--muted-2);margin-top:5px}
.pinned-unpin{font-size:.62rem;color:var(--muted);padding:2px 7px;border-radius:3px;background:var(--surface-3);transition:color var(--tf),background var(--tf)}
.pinned-unpin:hover{color:var(--red);background:rgba(208,96,112,.1)}

/* Notifications */
#notif-bar{position:fixed;top:12px;right:12px;z-index:8000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notif-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.12);display:flex;gap:10px;align-items:flex-start;width:290px;pointer-events:auto;animation:notifIn .3s var(--ease) both;cursor:pointer;transition:border-color var(--tf),transform var(--tf)}
.notif-card:hover{border-color:var(--border-h);transform:translateX(-2px)}
@keyframes notifIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.notif-card.fade{opacity:0;transform:translateX(16px);transition:opacity .3s,transform .3s}
.notif-avatar{width:32px;height:32px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden}
.notif-avatar img{width:100%;height:100%;object-fit:cover}
.notif-body{flex:1;min-width:0}
.notif-ch{font-size:.58rem;color:var(--muted-2);margin-bottom:1px}
.notif-name{font-size:.73rem;font-weight:600;color:var(--text);margin-bottom:2px}
.notif-msg{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);z-index:9999;background:var(--surface);border:1px solid var(--border);padding:9px 18px;font-size:.74rem;display:flex;align-items:center;gap:8px;border-radius:var(--r);opacity:0;transition:transform .25s var(--ease),opacity .2s ease;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.12);white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:rgba(76,175,130,.4)}.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#toast.err{border-color:rgba(208,96,112,.4)}
#toast.ok .toast-dot{background:var(--green)}#toast.err .toast-dot{background:var(--red)}

/* No channel */
#no-channel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.nc-icon{width:68px;height:68px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.nc-title{font-family:var(--font-display);font-weight:800;font-size:1.4rem}
.nc-sub{font-size:.76rem;color:var(--muted);max-width:260px;line-height:1.65}
.nc-mob-btn{display:none;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--border);border-radius:var(--r);font-size:.75rem;color:var(--muted);cursor:pointer;transition:background var(--tf),color var(--tf),border-color var(--tf)}
.nc-mob-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-h)}

/* Connection */
#conn-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(220,38,38,.08);border-bottom:1px solid rgba(220,38,38,.2);padding:7px 20px;font-size:.68rem;color:var(--red);align-items:center;justify-content:center;gap:8px}
#conn-banner.show{display:flex}

/* Skeleton */
.sk-line{height:9px;background:var(--surface-3);border-radius:3px;margin:5px 0;animation:skPulse 1.8s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:.35}50%{opacity:.7}}

/* Mobile nav */
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;height:var(--mob-nav-h);background:var(--surface);border-top:1px solid var(--border);align-items:stretch}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.58rem;letter-spacing:.05em;color:var(--muted);cursor:pointer;transition:color var(--tf);border:none;background:none;padding:6px 4px;position:relative}
.mob-nav-btn.active{color:var(--accent)}
.mob-dot{position:absolute;top:5px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--surface);display:none}
.mob-dot.show{display:block}
.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:190;opacity:0;pointer-events:none;transition:opacity .2s}
.mob-overlay.open{opacity:1;pointer-events:auto}
.topbar-mob-menu{display:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);transition:background var(--tf),color var(--tf);flex-shrink:0}
.topbar-mob-menu:hover{background:var(--surface-2);color:var(--text)}

@media(max-width:780px){
  :root{--sb-w:min(300px,100vw);--thread-w:100vw}  #shell{grid-template-columns:1fr;grid-template-areas:"main"}
  #shell.thread-open{grid-template-columns:1fr;grid-template-areas:"main"}
  #sidebar{position:fixed;top:0;left:0;bottom:var(--mob-nav-h);width:var(--sb-w);transform:translateX(-100%);transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:200}
  #sidebar.open{transform:translateX(0)}
  #thread-panel{position:fixed;inset:0;bottom:var(--mob-nav-h);z-index:250}
  #mob-nav{display:flex}
  /* input-wrap фиксируется вплотную над nav — никакого зазора */
  .input-wrap{
    position:fixed;
    bottom:var(--mob-nav-h);
    left:0;right:0;
    z-index:120;
    /* border слияния убран — разделение только сверху input-wrap */
  }
  /* msg-list получает отступ снизу чтобы последние сообщения не скрывались за инпутом */
  #msg-list{padding-bottom:calc(var(--mob-nav-h) + 20px)}
  /* main больше не нужен padding-bottom — инпут фиксирован */
  #main{padding-bottom:var(--mob-nav-h)}
  .topbar-mob-menu{display:flex!important}
  .nc-mob-btn{display:flex}
  .msg-action-btn::before{display:none}
  .msg-action-sep{display:none}
  #toast{bottom:calc(var(--mob-nav-h) + 8px)}
  #notif-bar{top:auto;bottom:calc(var(--mob-nav-h) + 60px);right:8px}
  .notif-card{width:calc(100vw - 44px)}
  #scroll-btn{bottom:calc(var(--mob-nav-h) + 80px + 56px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .msg-group.new-msg{animation:none}
}

/* ── TOPBAR BACK BUTTON ── */
.topbar-back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);transition:background var(--tf),color var(--tf);flex-shrink:0}
.topbar-back-btn:hover{background:var(--surface-2);color:var(--text)}
.topbar-mob-menu{display:none!important}
</style>
</head>
<body>



<div id="conn-banner"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.5v3M6 8v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Нет соединения</div>
<div id="notif-bar"></div>
<div class="mob-overlay" id="mob-overlay"></div>

<!-- Mobile nav -->
<nav id="mob-nav">
  <button class="mob-nav-btn active" id="mob-btn-dms">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 4a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2H6l-4 3V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <span class="mob-dot" id="mob-dot-dm"></span><span>Сообщения</span>
  </button>
  <button class="mob-nav-btn" id="mob-btn-channels">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="7" y="2" width="6" height="9" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 10a6 6 0 0012 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 16v2M8 18h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="mob-dot" id="mob-dot-ch"></span><span>Комнаты</span>
  </button>
  <button class="mob-nav-btn" id="mob-btn-new">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 12c2.5 1 4 2.8 4 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3 17c0-3 2.2-5 5-5s5 2 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M13 4a3 3 0 110 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>Группы</span>
  </button>
  <button class="mob-nav-btn" id="mob-btn-profile">
    <div class="user-avatar" id="mob-my-avatar" style="width:24px;height:24px;font-size:.6rem;border-radius:6px;border-color:transparent">?</div>
    <span>Профиль</span>
  </button>
</nav>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt=""/>
  <a id="lightbox-dl" href="#" download target="_blank"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Скачать</a>
</div>

<div id="shell">
  <!-- Main -->
  <div id="main">
    <!-- ═══ Общий топбар — один на все вкладки ═══ -->
    <div class="sb-head" id="main-topbar">
      <div class="sb-head-top">
        <img class="sb-logo-img" src="./pulsar.png" alt="Pulsar" draggable="false"/>
        <div style="flex:1"></div>
        <div class="sb-head-actions">
          <button class="sb-action-btn" id="btn-compose" title="Найти или начать чат">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M11.5 11.5L15 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="no-channel">
      <!-- Список чатов -->
      <div class="sb-chat-list" id="chat-list">
        <div id="chat-list-skeleton">
          <div class="ch-card-sk"><div class="sk-circle"></div><div class="sk-lines"><div class="sk-line" style="width:52%"></div><div class="sk-line" style="width:36%"></div></div></div>
          <div class="ch-card-sk"><div class="sk-circle"></div><div class="sk-lines"><div class="sk-line" style="width:38%"></div><div class="sk-line" style="width:26%"></div></div></div>
          <div class="ch-card-sk"><div class="sk-circle"></div><div class="sk-lines"><div class="sk-line" style="width:62%"></div><div class="sk-line" style="width:43%"></div></div></div>
          <div class="ch-card-sk"><div class="sk-circle"></div><div class="sk-lines"><div class="sk-line" style="width:45%"></div><div class="sk-line" style="width:31%"></div></div></div>
          <div class="ch-card-sk"><div class="sk-circle"></div><div class="sk-lines"><div class="sk-line" style="width:55%"></div><div class="sk-line" style="width:38%"></div></div></div>
        </div>
      </div>

    </div>

    <div id="conversation" style="display:none;flex-direction:column;flex:1;overflow:hidden;position:relative">
      <!-- Topbar -->
      <div class="topbar">
        <button class="topbar-back-btn" id="btn-back-to-chats" title="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <div class="topbar-name">
          <span class="topbar-hash" id="ch-icon" style="display:none">#</span>
          <span class="topbar-ch-name" id="ch-name">—</span>
          <span class="topbar-desc" id="ch-desc"></span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-call" title="Звонок">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 012 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-chat-menu" title="Информация"><svg width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
      </div>

      <!-- Pinned bar -->
      <div id="pinned-bar">
        <svg class="pinned-icon" width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M9 1L13 5l-3.5 1L6 9.5 5 13 1 9l3.5-1L8 4.5 9 1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M1 13l3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <div class="pinned-text"><strong id="pinned-bar-author"></strong>&nbsp;<span id="pinned-bar-text"></span></div>
        <button class="pinned-close" id="pinned-bar-close">✕</button>
      </div>


      <!-- Messages -->
      <div id="msg-list"></div>
      <div id="typing-bar"></div>

      <!-- Scroll to bottom -->
      <button id="scroll-btn" title="Вниз">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v9M3.5 8L7 11l3.5-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="scroll-btn-badge"></span>
      </button>

      <!-- Drag overlay -->
      <div id="drag-overlay">
        <div class="drag-icon">📎</div>
        <div class="drag-label">Отпустите для загрузки</div>
        <div class="drag-sub">Изображения и файлы</div>
      </div>

      <!-- Input -->
      <div class="input-wrap" id="input-wrap">
        <div class="upload-preview" id="upload-preview">
          <img class="upload-thumb" id="upload-thumb" src="" alt=""/>
          <div class="upload-info">
            <div class="upload-name" id="upload-name"></div>
            <div class="upload-progress"><div class="upload-progress-fill" id="upload-fill"></div></div>
          </div>
          <button class="upload-cancel" id="upload-cancel">✕</button>
        </div>
        <div class="input-reply-bar" id="reply-bar">
          <div class="input-reply-to">Ответ&nbsp;<strong id="reply-to-name"></strong></div>
          <div class="input-reply-preview" id="reply-preview"></div>
          <button class="input-reply-close" id="reply-close"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
        <div class="input-box" id="input-box">
          <label class="input-icon-btn" for="file-input" title="Прикрепить файл" style="cursor:pointer">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12.5 7L7 12.5a4 4 0 01-5.7-5.6L7.5 1a2.5 2.5 0 013.5 3.5L4.8 10.8a1 1 0 01-1.4-1.4L9 3.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          <input type="file" id="file-input" style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.txt,.mp4,.mp3"/>
          <textarea id="msg-input" placeholder="Сообщение…" rows="1"></textarea>
          <button class="input-send" id="btn-send" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12.5 1.5L1.5 5.5l4 2 2 4 5-10z" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="char-count" id="char-count"></div>
        <div class="emoji-picker" id="emoji-picker"></div>
        <!-- Mention popup -->
        <div id="mention-popup"></div>
      </div>
    </div>

    <!-- Комнаты — внутри #main -->
    <div id="view-rooms" style="display:none;flex-direction:column;flex:1;overflow:hidden;background:var(--surface)">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center">
        <div style="width:62px;height:62px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:4px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.4"><rect x="7" y="2" width="10" height="14" rx="5"/><path d="M5 10a7 7 0 0014 0" stroke-linecap="round"/><path d="M12 17v4M9 21h6" stroke-linecap="round"/></svg>
        </div>
        <div style="font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:var(--text)">Скоро</div>
        <div style="font-size:.76rem;color:var(--muted);max-width:210px;line-height:1.65">Голосовые комнаты появятся в следующем обновлении Pulsar</div>
      </div>
    </div>

    <!-- Группы — внутри #main -->

<script type="module">

import { auth, db as fdb, storage } from './firebase.js';

/* ════════════════════════════════════════════════════════════════
 *  FIRESTORE — СХЕМА БАЗЫ ДАННЫХ  (pulsar-galelium)
 * ════════════════════════════════════════════════════════════════
 *
 *  ┌─ users/{uid}
 *  │    Профили всех зарегистрированных пользователей.
 *  │    Создаётся при регистрации (login.html → ensureUserProfile).
 *  │    ├─ uid            string      Firebase Auth UID
 *  │    ├─ email          string
 *  │    ├─ displayName    string      имя и фамилия
 *  │    ├─ phone          string      необязательно
 *  │    ├─ photoURL       string      URL аватара
 *  │    ├─ bio            string      строка «о себе»
 *  │    ├─ role           string      'user' | 'admin' | 'moderator'
 *  │    ├─ status         string      'active' | 'banned'
 *  │    ├─ provider       string      'email' | 'google'
 *  │    ├─ createdAt      Timestamp
 *  │    ├─ updatedAt      Timestamp
 *  │    ├─ lastLoginAt    Timestamp
 *  │    ├─ verifiedByAdmin boolean
 *  │    └─ notes          string      заметки администратора
 *  │
 *  ├─ pulsar_channels/{channelId}
 *  │    Публичные, приватные каналы и личные переписки (DM).
 *  │    ├─ name           string      название канала (не для DM)
 *  │    ├─ description    string
 *  │    ├─ type           string      'public' | 'private' | 'direct'
 *  │    ├─ members        string[]    uid участников (обязателен для DM)
 *  │    ├─ createdBy      string      uid создателя
 *  │    ├─ createdAt      Timestamp
 *  │    ├─ order          number      порядок в сайдбаре (asc)
 *  │    └─ lastMessage    object      { text, authorName, ts }
 *  │
 *  │    └── messages/{messageId}
 *  │          Сообщения внутри канала.
 *  │          ├─ text            string
 *  │          ├─ authorId        string      uid
 *  │          ├─ authorName      string
 *  │          ├─ ts              Timestamp   серверное время записи
 *  │          ├─ clientTs        number      Date.now() — для сортировки
 *  │          ├─ edited          boolean
 *  │          ├─ editedAt        Timestamp
 *  │          ├─ deleted         boolean     soft-delete (текст стирается)
 *  │          ├─ pinned          boolean
 *  │          ├─ replyTo         object      { id, text, authorName }
 *  │          ├─ attachmentURL   string
 *  │          ├─ attachmentType  string      'image' | 'file'
 *  │          ├─ attachmentName  string
 *  │          ├─ attachmentSize  number      байт
 *  │          ├─ reactions       object      { '👍': [uid, ...], '❤️': [...] }
 *  │          └─ threadCount     number
 *  │
 *  │          └── thread/{threadMessageId}
 *  │                Ответы в треде (тред привязан к одному сообщению).
 *  │                ├─ text        string
 *  │                ├─ authorId    string
 *  │                ├─ authorName  string
 *  │                ├─ ts          Timestamp
 *  │                └─ clientTs    number
 *  │
 *  ├─ pulsar_presence/{uid}
 *  │    Онлайн-статус пользователей (обновляется в реальном времени).
 *  │    Документ перезаписывается при каждом изменении статуса.
 *  │    ├─ uid          string
 *  │    ├─ displayName  string
 *  │    ├─ email        string
 *  │    ├─ photoURL     string
 *  │    ├─ status       string   'online' | 'away' | 'offline'
 *  │    └─ updatedAt    Timestamp
 *  │
 *  └─ pulsar_typing/{channelId_uid}
 *       Индикатор набора текста (ephemeral).
 *       Ключ документа = `${chId}_${uid}` для уникальности.
 *       Устаревает через 5 сек (проверяется на клиенте).
 *       ├─ uid    string
 *       ├─ name   string
 *       ├─ chId   string
 *       └─ ts     Timestamp | null   null = пользователь перестал печатать
 *
 * ════════════════════════════════════════════════════════════════ */

/* ── STATE ── */
let me=null, currentCh=null, msgUnsub=null, replyTo=null, editingId=null;
let allUsers={}, usersLoaded=false;
let currentMsgs=[], knownMsgIds=new Set();
let threadMsgId=null, threadUnsub=null;
let pinnedMsgs=[], searchResults=[], searchIdx=0;
let mutedChannels=new Set(JSON.parse(localStorage.getItem('p_muted')||'[]'));
let unreadCounts={};
let _openingChId=null;
let pendingFile=null, uploadTask=null;
let typingTimer=null, typingUnsub=null;
let newMsgCount=0; // for scroll btn badge
let mentionIdx=-1, mentionMatches=[];
let firstLoadTs=0; // used for "new messages" divider

const EMOJIS=['👍','❤️','🔥','😂','😮','👏','✅','🎉','🚀','💯','😎','🙏','💪','✨','🎯','😅','🤔','💀','🫡','⚡'];
const REACT5 =['👍','❤️','🔥','😂','😮'];
const MAX_CHARS=4000;

/* ── UTILS ── */
const $=id=>document.getElementById(id);
let _tt;
function toast(msg,type='ok'){const el=$('toast');$('toast-msg').textContent=msg;el.className='show '+type;clearTimeout(_tt);_tt=setTimeout(()=>el.className='',3500);}
function ini(n=''){return(n||'?').trim()[0].toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtT(ts){
  if(!ts)return'';
  const d=ts.toDate?ts.toDate():new Date(ts),diff=Math.floor((Date.now()-d)/86400000);
  if(diff===0)return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(diff===1)return'вчера '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function fmtD(ts){
  if(!ts)return'';
  const d=ts.toDate?ts.toDate():new Date(ts),diff=Math.floor((Date.now()-d)/86400000);
  if(diff===0)return'Сегодня';if(diff===1)return'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(0)+'KB';return(b/1048576).toFixed(1)+'MB';}
function ar(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';}

/* ── MARKDOWN / CODE RENDERING ── */
function renderText(raw){
  if(!raw) return '';
  // Code blocks ```lang\n...\n```
  let html=esc(raw).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    const l=lang||'code';
    return `<div class="code-block">
      <div class="code-block-head"><span class="code-lang">${esc(l)}</span><button class="code-copy" data-code="${esc(code.trim())}" title="Скопировать">Скопировать</button></div>
      <pre>${esc(code.trim())}</pre>
    </div>`;
  });
  // Inline code `...`
  html=html.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Bold **
  html=html.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  // Italic *
  html=html.replace(/\*(.*?)\*/g,'<em>$1</em>');
  // Strikethrough ~~
  html=html.replace(/~~(.*?)~~/g,'<del>$1</del>');
  // Mentions @Name
  html=html.replace(/@([А-Яа-яёA-Za-z][А-Яа-яёA-Za-z\s]*?)(?=\s|$|[^\wА-Яа-я])/g,(m,name)=>{
    const isMe=name.trim().toLowerCase()===(me?.displayName||'').toLowerCase();
    return`<span class="mention${isMe?' is-me':''}" data-mention="${esc(name.trim())}">@${esc(name.trim())}</span>`;
  });
  // URLs
  html=html.replace(/(?<!href="|src=")(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return html;
}

/* ── SOUND ── */
function playNotifSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+.12);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.22);}catch(e){}
}

/* ── IN-APP NOTIFICATION ── */
function showInAppNotif(msg,chName){
  if(document.hasFocus()&&currentCh?.id===msg.chId)return;
  if(mutedChannels.has(msg.chId))return;
  const bar=$('notif-bar');
  const card=document.createElement('div');
  const av=allUsers[msg.authorId];
  const avContent=av?.photoURL?`<img src="${esc(av.photoURL)}" alt=""/>`:(ini(msg.authorName));
  card.className='notif-card';
  card.innerHTML=`<div class="notif-avatar">${avContent}</div><div class="notif-body"><div class="notif-ch"># ${esc(chName)}</div><div class="notif-name">${esc(msg.authorName)}</div><div class="notif-msg">${msg.attachmentType?'📎 '+esc(msg.attachmentName||'Файл'):esc((msg.text||'').slice(0,60))}</div></div>`;
  card.addEventListener('click',()=>{openChannel(msg.chId);card.remove();});
  bar.appendChild(card);
  playNotifSound();
  if(Notification.permission==='granted'&&!document.hasFocus()){new Notification('Pulsar · '+chName,{body:msg.authorName+': '+(msg.text||'Файл').slice(0,80)});}
  setTimeout(()=>{card.classList.add('fade');setTimeout(()=>card.remove(),300);},5000);
}

/* ── NETWORK ── */
window.addEventListener('online',()=>$('conn-banner').classList.remove('show'));
window.addEventListener('offline',()=>$('conn-banner').classList.add('show'));

/* ── AUTH ── */
// Redirect to login if Firebase doesn't respond in 8s
const authTO=setTimeout(()=>location.replace('login.html'),8000);
onAuthStateChanged(auth,async user=>{
  clearTimeout(authTO);
  if(!user){location.replace('login.html');return;}
  // Load profile
  let p={uid:user.uid,displayName:user.displayName||user.email,email:user.email,role:'user',photoURL:user.photoURL||''};
  try{const s=await getDoc(doc(fdb,'users',user.uid));if(s.exists())Object.assign(p,s.data());}catch(e){}
  me=p;
  updatePresence('online');
  document.addEventListener('visibilitychange',()=>updatePresence(document.hidden?'away':'online'));
  window.addEventListener('beforeunload',()=>updatePresence('offline'));
  // Интерфейс уже виден (skeleton), обновляем данные
  updateMyAvatarUI();
  if($('my-name'))$('my-name').textContent=me.displayName||me.email;
  await loadAllUsers();
  startChannelListener();
  initUI();
  if(Notification.permission==='default')Notification.requestPermission();
});

function updateMyAvatarUI(){
  [$('my-avatar'),$('mob-my-avatar')].forEach(av=>{
    if(!av)return;

/* ── PRESENCE ── */
async function updatePresence(status){
  if(!me)return;
  try{await setDoc(doc(fdb,'pulsar_presence',me.uid),{status,displayName:me.displayName,email:me.email,uid:me.uid,photoURL:me.photoURL||'',updatedAt:serverTimestamp()},{merge:true});}catch(e){}
  const colors={online:'var(--green)',away:'#8888c0',offline:'var(--muted-2)'};
  const labels={online:'В сети',away:'Отошёл',offline:'Не в сети'};

/* ── TYPING INDICATOR ── */
async function broadcastTyping(){
  if(!me||!currentCh)return;
  try{
    await setDoc(doc(fdb,'pulsar_typing',`${currentCh.id}_${me.uid}`),{uid:me.uid,name:me.displayName,chId:currentCh.id,ts:serverTimestamp()},{merge:true});
  }catch(e){}
}
async function clearTyping(){
  if(!me||!currentCh)return;
  try{await setDoc(doc(fdb,'pulsar_typing',`${currentCh.id}_${me.uid}`),{uid:me.uid,chId:currentCh.id,ts:null},{merge:true});}catch(e){}
}
function startTypingListener(chId){
  if(typingUnsub){typingUnsub();typingUnsub=null;}
  typingUnsub=onSnapshot(collection(fdb,'pulsar_typing'),snap=>{
    const typers=[];
    const cutoff=Date.now()-5000;
    snap.forEach(d=>{
      const dt=d.data();
      if(dt.chId!==chId||dt.uid===me?.uid||!dt.ts)return;
      const ts=dt.ts.toDate?dt.ts.toDate().getTime():0;
      if(ts>cutoff)typers.push(dt.name||'Кто-то');
    });
    const bar=$('typing-bar');
    if(!typers.length){bar.innerHTML='';return;}
    const names=typers.slice(0,3).join(', ');
    const suffix=typers.length>1?'печатают…':'печатает…';
    bar.innerHTML=`<div class="typing-dots"><span></span><span></span><span></span></div><span>${esc(names)} ${suffix}</span>`;
  },()=>{});
}

/* ── LOAD USERS ── */
async function loadAllUsers(){
  try{
    const snap=await getDocs(collection(fdb,'users'));
    snap.forEach(d=>{allUsers[d.id]={uid:d.id,...d.data()};});
    usersLoaded=true;
    onSnapshot(collection(fdb,'pulsar_presence'),snap=>{
      snap.forEach(d=>{
        if(allUsers[d.id])allUsers[d.id].presence=d.data();
        else allUsers[d.id]={uid:d.id,...d.data(),presence:d.data()};
      });
      renderDMList();
    });
  }catch(e){console.error('loadAllUsers:',e);usersLoaded=true;}
}

/* ── CHANNEL LISTENER ── */
function startChannelListener(){
  onSnapshot(query(collection(fdb,'pulsar_channels'),orderBy('order','asc')),snap=>{
    const chs=[],dms=[];
    snap.forEach(d=>{const ch={id:d.id,...d.data()};if(ch.type==='direct'){if((ch.members||[]).includes(me.uid))dms.push(ch);}else chs.push(ch);});
    // Обновляем оба массива атомарно — один вызов rebuildChatList, без промежуточного пустого состояния
    _allChs=chs; _allDmChs=dms; _dmChs=dms;
    rebuildChatList();
  },e=>console.error('channels:',e));
}

/* ── SIDEBAR HELPERS ── */
function fmtSbTime(ts){
  if(!ts)return'';
  const d=ts.toDate?ts.toDate():new Date(ts);
  const diff=Math.floor((Date.now()-d)/86400000);
  if(diff===0)return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(diff===1)return'вчера';
  if(diff<7)return d.toLocaleDateString('ru-RU',{weekday:'short'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'numeric'});
}

function makeChCard(ch, o /* null for channels */, oid=null){
  const isDM   = ch.type === 'direct';
  const isActive = currentCh?.id === ch.id;
  const uc     = unreadCounts[ch.id] || 0;
  const lm     = ch.lastMessage;
  const ts     = lm?.ts ? fmtSbTime(lm.ts) : '';

  // Аватар
  let avaHtml;
  if(isDM && o){
    const pr  = o.presence?.status || 'offline';
    const avI = o.photoURL ? `<img src="${esc(o.photoURL)}" alt=""/>` : esc(ini(o.displayName||o.email));
    avaHtml = `<div class="ch-ava-wrap"><div class="ch-ava"><span>${avI}</span></div><div class="ch-presence ${pr}"></div></div>`;
  } else {
    const icon = ch.type==='private' ? '🔒' : ch.name?.[0]?.toUpperCase() || '#';
    avaHtml = `<div class="ch-ava ch-ava--ch">${icon}</div>`;
  }

  // Превью
  let previewHtml;
  if(!lm){
    previewHtml = `<div class="ch-preview empty">Нет сообщений</div>`;
  } else {
    const icon = lm.attachmentType==='image'?'🖼 ':lm.attachmentType==='file'?'📎 ':'';
    const txt  = (icon + (lm.text||'').slice(0,55)) || (lm.attachmentType?'Файл':'');
    const isMyMsg = lm.authorName === (me?.displayName||me?.email);
    const who = isDM
      ? (isMyMsg ? '<b>Вы:</b> ' : '')
      : `<b>${esc((lm.authorName||'').split(' ')[0])}:</b> `;
    previewHtml = `<div class="ch-preview">${who}${esc(txt)}</div>`;
  }

  // Badge
  const badgeHtml = (!isActive && uc > 0)
    ? `<span class="ch-badge">${uc>99?'99+':uc}</span>` : '';

  const title = isDM ? esc(o?.displayName||o?.email||'—') : esc(ch.name||'');

  return `<div class="ch-card${isActive?' active':''}${uc>0&&!isActive?' has-unread':''}" data-chid="${esc(ch.id)}"${oid?` data-uid="${esc(oid)}"`:''} role="button" tabindex="0">
    ${avaHtml}
    <div class="ch-body">
      <div class="ch-row1">
        <span class="ch-title">${title}</span>
        ${ts?`<span class="ch-ts">${ts}</span>`:''}
        ${badgeHtml}
      </div>
      ${previewHtml}
    </div>
  </div>`;
}

// Все чаты в одном массиве, сортировка по lastMessage.ts
let _allChs = [], _allDmChs = [];
let _sbQuery = '';

let _chatListLoaded = false;

function rebuildChatList(){
  const list = $('chat-list');
  $('chat-list-skeleton')?.remove();

  // Объединяем каналы + DM
  const combined = [
    ..._allChs,
    ..._allDmChs
  ].sort((a,b)=>{
    const ta = a.lastMessage?.ts?.toDate?.()?.getTime() || a.createdAt?.toDate?.()?.getTime() || 0;
    const tb = b.lastMessage?.ts?.toDate?.()?.getTime() || b.createdAt?.toDate?.()?.getTime() || 0;
    return tb - ta;
  });

  // Фильтрация по поиску
  const q = _sbQuery.trim().toLowerCase();
  const filtered = q ? combined.filter(ch=>{
    if(ch.type==='direct'){
      const oid=(ch.members||[]).find(u=>u!==me.uid);
      const o=allUsers[oid]||{};
      return (o.displayName||'').toLowerCase().includes(q)||(o.email||'').toLowerCase().includes(q);
    }
    return (ch.name||'').toLowerCase().includes(q)||(ch.description||'').toLowerCase().includes(q);
  }) : combined;

  if(!filtered.length){
    // Не показываем пустое состояние пока данные ещё не пришли
    if(!_chatListLoaded && !q) return;
    list.innerHTML = `<div style="padding:20px 14px;font-size:.74rem;color:var(--muted-2);text-align:center">${q?'Ничего не найдено':'Нет чатов — создайте первый'}</div>`;
    return;
  }

  _chatListLoaded = true;

  list.innerHTML = filtered.map(ch=>{
    if(ch.type==='direct'){
      const oid=(ch.members||[]).find(u=>u!==me.uid);
      return makeChCard(ch, allUsers[oid]||{displayName:'Пользователь'}, oid);
    }
    return makeChCard(ch, null);
  }).join('');

  _chatListLoaded = true;

  list.querySelectorAll('.ch-card').forEach(el => {
    const uid = el.dataset.uid;
    let lpTimer = null, longPressed = false;

    // Long-press (500ms) — открыть профиль (только для DM)
    if(uid){
      el.addEventListener('touchstart', () => {
        longPressed = false;
        lpTimer = setTimeout(() => {
          longPressed = true;
          lpTimer = null;
          openUserProfile(uid);
        }, 500);
      }, {passive: true});

      el.addEventListener('touchmove', () => {
        if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
      }, {passive: true});

      el.addEventListener('touchend', e => {
        if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
        if(longPressed){ e.preventDefault(); longPressed = false; }
      });
    }

    // Обычный клик — открыть чат
    el.addEventListener('click', () => {
      if(longPressed){ longPressed = false; return; }
      openChannel(el.dataset.chid);
    });
  });
}
